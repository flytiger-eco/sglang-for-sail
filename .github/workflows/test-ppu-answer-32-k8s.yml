name: PROBE Cross-node RDMA data path (PPU K8s)

# PROBE ONLY -- never to be merged. This exists to settle one question at the
# smallest cost that can settle it: does a collective between two ZW-M890P
# boards carry bytes over RDMA?
#
# The four-node Answer entry reached ncclCommInitRank on all four nodes,
# reported "Connected all rings" and "Connected all trees", and then sat in the
# warmup all_reduce forever. Forcing NCCL_IB_DISABLE made the same collective
# complete in 35s over TCP, which puts the fault in the RDMA data path -- but
# every run that established this held four whole boards for tens of minutes,
# because the collective under investigation was buried behind a dependency
# install and a 2324.7 GiB checkpoint load.
#
# Two boards and no install reproduce the same transport with the same driver,
# the same host network and the same pccl. Nothing here loads a model.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
  # Reached through the dispatch shim on this branch: GitHub indexes
  # workflow_dispatch by file name on the default branch, and this file is not
  # there.
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''

concurrency:
  group: probe-ppu-net-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312

jobs:
  probe-net:
    name: cross-node RDMA probe (btv1.5, 2 nodes)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 25
    env:
      PROBE_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/probe
      PROBE_IN_POD: /mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/probe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Probe the cross-node data path
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          image: ${{ env.PPU_BASE_IMAGE }}
          # Two nodes, whole boards. Two is the smallest group that crosses a
          # node boundary, and the board is claimed whole for the same reason
          # the Answer entry claims it: nothing else may land on a board this
          # run is measuring.
          nnodes: 2
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          command: |
            set -u
            cd /workspace/source
            git config --global --add safe.directory /workspace/source
            mkdir -p "$PROBE_IN_POD/ranks"
            RANK="${NODE_RANK:-0}"
            # The action's MASTER_ADDR is a *.svc.cluster.local name that these
            # hostNetwork pods cannot resolve, so the group exchanges the
            # address over the NAS, exactly as the Answer entry does.
            ADDR=$(bash scripts/ci/ppu/answer_rendezvous.sh "$PROBE_IN_POD/ranks")
            MASTER_ADDR="${ADDR%:*}"
            export MASTER_ADDR
            echo "node $RANK of ${NNODES:-1} on ${NODE_NAME:-an unnamed node}, master $MASTER_ADDR"

            # --- what the transport can see, per node -------------------------
            #
            # An earlier report concluded these hosts expose no GID table. That
            # was wrong, and wrongly mine: it only listed gids/ when
            # gid_attr/types was also a directory, and gid_attr is absent on a
            # healthy PPU host too. gids/ is enumerated on its own here.
            python3 - > "$PROBE_IN_POD/ranks/node-$RANK-net.txt" 2>&1 <<'NETPY'
            import fcntl, os, socket, struct

            print("== node %s on %s ==" % (os.environ.get("NODE_RANK", "0"),
                                           os.environ.get("NODE_NAME", "an unnamed node")))

            def cat(path):
                try:
                    with open(path) as handle:
                        return handle.read().strip()
                except OSError:
                    return "?"

            print("-- interfaces --")
            sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
            for _, name in sorted(socket.if_nameindex()):
                try:
                    addr = socket.inet_ntoa(fcntl.ioctl(
                        sock.fileno(), 0x8915, struct.pack("256s", name[:15].encode()))[20:24])
                except OSError:
                    addr = "no IPv4"
                base = "/sys/class/net/%s" % name
                print("%-12s %-18s oper=%-8s carrier=%-2s mtu=%-6s mac=%s" % (
                    name, addr, cat(base + "/operstate"), cat(base + "/carrier"),
                    cat(base + "/mtu"), cat(base + "/address")))

            # RoCE v2 GIDs are formed from the netdev's addresses, so IPv6
            # matters as much as IPv4 here: with no IPv4 on the bonds, a
            # link-local v6 GID is the only other thing pccl could have picked.
            print("-- IPv6 (/proc/net/if_inet6) --")
            print(cat("/proc/net/if_inet6"))

            print("-- /dev/infiniband --")
            print(" ".join(sorted(os.listdir("/dev/infiniband")))
                  if os.path.isdir("/dev/infiniband") else "absent")

            root = "/sys/class/infiniband"
            print("-- %s --" % root)
            if not os.path.isdir(root):
                print("absent")
            else:
                for dev in sorted(os.listdir(root)):
                    ports = os.path.join(root, dev, "ports")
                    if not os.path.isdir(ports):
                        print("%s (no ports/)" % dev)
                        continue
                    for port in sorted(os.listdir(ports)):
                        p = os.path.join(ports, port)
                        print("%s port %s state=%s phys=%s rate=%s link_layer=%s" % (
                            dev, port, cat(p + "/state"), cat(p + "/phys_state"),
                            cat(p + "/rate"), cat(p + "/link_layer")))
                        gids = os.path.join(p, "gids")
                        if not os.path.isdir(gids):
                            print("  no gids/")
                            continue
                        for idx in sorted((v for v in os.listdir(gids) if v.isdigit()), key=int):
                            gid = cat(os.path.join(gids, idx))
                            if not gid or set(gid) <= set("0:"):
                                continue
                            # gid_attr is absent on this driver; type and ndev
                            # are printed when they happen to be there.
                            print("  gid %-3s type=%-10s ndev=%-10s %s" % (
                                idx,
                                cat(os.path.join(p, "gid_attr", "types", idx)),
                                cat(os.path.join(p, "gid_attr", "ndevs", idx)),
                                gid))

            print("-- locked memory --")
            print("\n".join(line.strip() for line in cat("/proc/self/limits").splitlines()
                            if "locked" in line.lower()))

            print("-- transport env --")
            for key in sorted(os.environ):
                if any(token in key.lower() for token in
                       ("nccl", "pccl", "master", "node_rank", "nnodes")):
                    print("%s=%s" % (key, os.environ[key]))
            NETPY
            cat "$PROBE_IN_POD/ranks/node-$RANK-net.txt"

            # --- the collective itself ---------------------------------------
            #
            # One process per node, so this is a two-rank all_reduce over the
            # same backend the server uses: torch names it nccl and the PPU SDK
            # provides pccl behind that name, which is why the failing run's
            # logs read "PCCL INFO".
            cat > /tmp/allreduce_probe.py <<'ARPY'
            import datetime, os, sys
            import torch
            import torch.distributed as dist

            torch.cuda.set_device(0)
            dist.init_process_group(
                backend="nccl",
                init_method="env://",
                world_size=int(os.environ["WORLD_SIZE"]),
                rank=int(os.environ["RANK"]),
                timeout=datetime.timedelta(seconds=90),
            )
            print("init_process_group returned", flush=True)
            tensor = torch.ones(1024 * 1024, device="cuda")
            dist.all_reduce(tensor)
            torch.cuda.synchronize()
            expected = float(os.environ["WORLD_SIZE"])
            got = tensor[0].item()
            print("all_reduce returned %s, expected %s" % (got, expected), flush=True)
            sys.exit(0 if got == expected else 1)
            ARPY

            export RANK="$RANK"
            export WORLD_SIZE="${NNODES:-2}"
            export NCCL_DEBUG=INFO

            # Phase A is the transport under investigation. The hard timeout is
            # what makes this cheap: a hang costs three minutes, not the pod
            # budget. Distinct ports per phase so neither meets the other's
            # TCPStore.
            echo "=== phase A: RDMA (pccl defaults) ==="
            MASTER_PORT=29500 timeout 180 python3 /tmp/allreduce_probe.py \
              > "$PROBE_IN_POD/ranks/node-$RANK-phaseA.log" 2>&1
            A=$?
            echo "$A" > "$PROBE_IN_POD/ranks/node-$RANK-phaseA.status"
            echo "phase A exit $A (124 = timed out, i.e. the hang reproduced)"
            tail -40 "$PROBE_IN_POD/ranks/node-$RANK-phaseA.log"

            # Phase B is the control: same collective, TCP data path. It is
            # expected to pass, and it is what says phase A's result is about
            # RDMA rather than about the group, the boards or this probe.
            echo "=== phase B: TCP control (NCCL_IB_DISABLE=1) ==="
            MASTER_PORT=29501 NCCL_IB_DISABLE=1 NCCL_SOCKET_IFNAME=eth0 \
              timeout 180 python3 /tmp/allreduce_probe.py \
              > "$PROBE_IN_POD/ranks/node-$RANK-phaseB.log" 2>&1
            B=$?
            echo "$B" > "$PROBE_IN_POD/ranks/node-$RANK-phaseB.status"
            echo "phase B exit $B"
            tail -40 "$PROBE_IN_POD/ranks/node-$RANK-phaseB.log"

            echo "node $RANK: phase A=$A phase B=$B"
            # The probe's own exit is deliberately 0 whatever the phases did:
            # a reproduced hang is this run's finding, not its failure, and a
            # red job would hide the evidence behind a cancelled group.
            exit 0
          extra_env: "PROBE_IN_POD=${{ env.PROBE_IN_POD }}"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 15

      - name: Collect probe evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          destination="${GITHUB_WORKSPACE}/probe-artifacts"
          mkdir -p "${destination}"
          if [ -d "${PROBE_ON_RUNNER}" ]; then
            cp -a "${PROBE_ON_RUNNER}/." "${destination}/"
          else
            echo "::warning::the group produced nothing at ${PROBE_ON_RUNNER}"
          fi
          for phase in A B; do
            for status_file in "${destination}"/ranks/node-*-phase${phase}.status; do
              [ -f "${status_file}" ] || continue
              node=$(basename "${status_file}" ".status")
              echo "::notice::${node} exited $(cat "${status_file}")"
            done
          done

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-net-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe-artifacts/
          if-no-files-found: warn
          retention-days: 7
