name: PPU Nightly (CUDA parity)
run-name: PPU nightly | ${{ inputs.suite }} | ${{ inputs.ref || github.sha }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full commit SHA to test; empty uses the dispatched commit'
        type: string
        default: ''
      suite:
        description: 'PPU nightly suite to execute'
        type: choice
        options:
          - all
          - nightly-test-1-gpu-large
          - nightly-test-2-gpu-large
          - nightly-test-4-gpu-h100
        default: all
      max_parallel:
        description: 'Concurrent suite tasks (1-3)'
        type: number
        default: 1
      timeout_per_file:
        description: 'Seconds (600-3600); 0 uses each PPU registration est_time'
        type: number
        default: 0

concurrency:
  group: ppu-nightly-cuda-parity-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.17-py312-20261001
  PPU_SDK_VERSION: 2.2.0

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.dispatch.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      parallel: ${{ steps.dispatch.outputs.parallel }}
      timeout: ${{ steps.dispatch.outputs.timeout }}
    steps:
      - name: Validate dispatch before checkout
        id: dispatch
        env:
          REQUESTED_SHA: ${{ inputs.ref || github.sha }}
          SUITE: ${{ inputs.suite }}
          PARALLEL: ${{ inputs.max_parallel }}
          FILE_TIMEOUT: ${{ inputs.timeout_per_file }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          (( PARALLEL >= 1 && PARALLEL <= 3 ))
          (( FILE_TIMEOUT == 0 || (FILE_TIMEOUT >= 600 && FILE_TIMEOUT <= 3600) ))
          case "$SUITE" in
            all|nightly-test-1-gpu-large|nightly-test-2-gpu-large|nightly-test-4-gpu-h100) ;;
            *) printf 'Unknown suite: %s\n' "$SUITE" >&2; exit 1 ;;
          esac
          printf 'sha=%s\nparallel=%s\ntimeout=%s\n' \
            "$REQUESTED_SHA" "$PARALLEL" "$FILE_TIMEOUT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.dispatch.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate inputs and build suite plan
        id: plan
        env:
          REQUESTED_SHA: ${{ steps.dispatch.outputs.sha }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" == "$(git rev-parse HEAD)" ]]
          mkdir -p .ppu-nightly
          python3 - <<'PY'
          import json
          import os
          import runpy
          from pathlib import Path

          configs = {
              "nightly-test-1-gpu-large": "1-gpu-large",
              "nightly-test-2-gpu-large": "2-gpu-large",
              "nightly-test-4-gpu-h100": "4-gpu-h100",
          }
          requested = os.environ["SUITE"]
          if requested != "all" and requested not in configs:
              raise ValueError(f"Unknown suite: {requested}")
          suites = list(configs) if requested == "all" else [requested]

          registry = runpy.run_path("python/sglang/test/ci/ci_register.py")
          paths = [
              str(path)
              for path in Path("test/registered").rglob("*.py")
              if path.name not in {"conftest.py", "__init__.py"}
          ]
          tests = registry["collect_tests"](paths, sanity_check=True)
          entries = []
          plan_suites = []
          for suite in suites:
              selected = [
                  test
                  for test in tests
                  if test.backend == registry["HWBackend"].PPU
                  and test.effective_suite == suite
                  and not test.nightly
                  and test.disabled is None
              ]
              if not selected:
                  raise ValueError(f"Suite has no enabled PPU registrations: {suite}")
              devices = int(suite.split("-")[2])
              ident = configs[suite]
              entries.append(
                  {
                      "id": ident,
                      "suite": suite,
                      "n_devices": devices,
                      "visible_devices": ",".join(str(i) for i in range(devices)),
                  }
              )
              plan_suites.append(
                  {
                      **entries[-1],
                      "file_count": len(selected),
                      "est_time": sum(test.est_time for test in selected),
                      "files": sorted(test.filename for test in selected),
                  }
              )
              print(f"{suite}: {len(selected)} PPU test files, {devices} visible devices")

          plan = {
              "schema_version": 1,
              "sha": os.environ["REQUESTED_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "suites": plan_suites,
          }
          Path(".ppu-nightly/plan.json").write_text(json.dumps(plan, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"matrix={json.dumps({'include': entries})}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("# PPU nightly CUDA parity plan\n\n")
              stream.write("| Suite | Files | Devices | Estimated seconds |\n| --- | ---: | ---: | ---: |\n")
              for suite in plan_suites:
                  stream.write(
                      f"| {suite['suite']} | {suite['file_count']} | "
                      f"{suite['n_devices']} | {suite['est_time']} |\n"
                  )
          PY

      - name: Build PPU nightly worker
        run: |
          set -euo pipefail
          cat > .ppu-nightly/run.sh <<'SH'
          set -euo pipefail
          cd /workspace/source
          export PYTHONPATH="/workspace/source/python:/workspace/source/test${PYTHONPATH:+:$PYTHONPATH}"
          export PPU_INSTALL_PROFILE=nightly
          export PIP_CACHE_DIR=/ppu-nightly-cache/pip
          export SGL_KERNEL_WHEEL_CACHE_DIR=/ppu-nightly-cache/aot/ZW-M890P
          export TVM_FFI_CACHE_DIR=/ppu-nightly-cache/tvm-ffi
          export SGLANG_JIT_CACHE_DIR=/ppu-nightly-cache/jit
          export DG_JIT_CACHE_DIR=/ppu-nightly-cache/deep-gemm
          export SGLANG_TEST_MAX_RETRY=0 SGLANG_IS_IN_CI=true
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1
          export SGLANG_JIT_KERNEL_RUN_FULL_TESTS=1
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0=/workspace/source
          export NCCL_NVLS_ENABLE=0 SGLANG_JIT_DEEPGEMM_FAST_WARMUP=true
          export GLOO_SOCKET_IFNAME=lo
          export PCCL_MNNVL_ENABLE=0 SGLANG_ENABLE_CUSTOM_ALL_REDUCE_V2_MULTINODE=0
          mkdir -p /ppu-evidence
          {
            bash scripts/ci/ppu/ppu_install_dependency.sh
            python3 -m pip install pytest==8.3.5 tabulate
          } > /ppu-evidence/setup.log 2>&1

          if (( PPU_TIMEOUT_PER_FILE == 0 )); then
            timeout_args=(--timeout-from-est-time)
          else
            timeout_args=(--timeout-per-file "$PPU_TIMEOUT_PER_FILE")
          fi

          # The 1-GPU suite intentionally includes PASS_WITH_SKIPS registrations.
          # Use the normal per-file runner so their existing skips remain non-fatal.
          python3 test/run_suite.py \
            --hw ppu \
            --suite "$PPU_NIGHTLY_SUITE" \
            --continue-on-error \
            "${timeout_args[@]}" 2>&1 | tee /ppu-evidence/suite.log
          SH

      - uses: actions/upload-artifact@v4
        with:
          name: ppu-nightly-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ppu-nightly/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  resolve-image:
    needs: prepare
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Resolve one immutable image for the entire run
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Require immutable image identity
        id: image
        run: |
          [[ "$PPU_BASE_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PPU_BASE_IMAGE_REF" == *"@$PPU_BASE_IMAGE_DIGEST" ]]
          printf 'image=%s\ndigest=%s\n' "$PPU_BASE_IMAGE_REF" "$PPU_BASE_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  execute:
    needs: [prepare, resolve-image]
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 660
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ppu-nightly-${{ matrix.id }}
    env:
      PPU_BASE_IMAGE_REF: ${{ needs.resolve-image.outputs.image }}
      PPU_BASE_IMAGE_DIGEST: ${{ needs.resolve-image.outputs.digest }}
      EVIDENCE_SOURCE: /wl_nas/pr-ci/ppu-nightly/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ppu-nightly-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ppu-nightly
      - name: Prepare an isolated evidence directory
        run: |
          [[ "$PPU_BASE_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PPU_BASE_IMAGE_REF" == *"@$PPU_BASE_IMAGE_DIGEST" ]]
          test ! -e "$EVIDENCE_SOURCE"
          mkdir -p "$EVIDENCE_SOURCE"
      - name: Execute PPU nightly suite
        id: worker
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: ${{ matrix.n_devices }}
          node_selector: board-type=ZW-M890P
          namespace: ppu-sched
          job_suffix: nightly-${{ matrix.id }}
          command: bash /workspace/source/.ppu-nightly/run.sh
          host_volumes: /wl_nas/pr-ci/ppu-nightly/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}:/ppu-evidence,/wl_nas/pr-ci/ppu-nightly-cache/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}:/ppu-nightly-cache
          extra_env: "PPU_NIGHTLY_SUITE=${{ matrix.suite }},PPU_TIMEOUT_PER_FILE=${{ needs.prepare.outputs.timeout }},CUDA_VISIBLE_DEVICES=${{ matrix.visible_devices }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_SUPPORTS_FP8=0,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PIP_INDEX_URL=https://pypi.org/simple"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 600
          cleanup_policy: always
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-nightly-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ env.EVIDENCE_SOURCE }}/
          if-no-files-found: error
          retention-days: 30

  finish:
    needs: [prepare, resolve-image, execute]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = [name for name, info in needs.items() if info["result"] != "success"]
          if failed:
              print(f"Failed jobs: {', '.join(failed)}")
              sys.exit(1)
          print("All PPU nightly suite jobs completed successfully")
          PY
