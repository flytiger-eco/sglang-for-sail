name: PR Test (PPU K8s)

on:
  # No pull_request trigger: the PR path is orchestrated by ci-k8s.yaml
  # (org-level gate chain: precheck -> smoke/AI review -> human review ->
  # this workflow via workflow_call). Manual verification uses
  # workflow_dispatch, which bypasses the gate.
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
      run_all_tests:
        description: "Run all tests"
        required: false
        type: boolean
        default: false
      require_run_ci_label:
        description: >-
          Whether the run-ci label gate applies when the caller's event
          is pull_request. ci-k8s.yaml passes false so Full CI runs after
          human approval without needing the label.
        required: false
        type: boolean
        default: true

concurrency:
  group: pr-test-ppu-k8s-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read
  pull-requests: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312

jobs:
  # ==================== Check Changes ==================== #
  check-changes:
    if: github.event_name != 'pull_request' || !inputs.require_run_ci_label || contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    outputs:
      changes_exist: ${{ steps.filter.outputs.ppu_code == 'true'
        || steps.run-mode.outputs.run_all_tests == 'true' }}
      sgl_kernel_changed: ${{ steps.filter.outputs.sgl_kernel == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Determine run mode
        id: run-mode
        run: |
          if [[ "${{ inputs.run_all_tests }}" == "true" ]]; then
            echo "run_all_tests=true" >> $GITHUB_OUTPUT
          else
            echo "run_all_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        if: steps.run-mode.outputs.run_all_tests != 'true'
        with:
          filters: |
            ppu_code:
              - ".github/workflows/pr-test-ppu.yml"
              - "python/pyproject_other.toml"
              - "python/sglang/!(multimodal_gen)/**"
              - "python/sglang/srt/hardware_backend/ppu/**"
              - "python/sglang/srt/platforms/ppu.py"
              - "sgl-kernel/**"
              - "test/registered/**"
              - "scripts/ci/ppu/**"
            sgl_kernel:
              - "sgl-kernel/**"

  # ==================== Build sgl-kernel Wheel ==================== #
  build-sgl-kernel:
    needs: [check-changes]
    if: needs.check-changes.outputs.changes_exist == 'true'
      && needs.check-changes.outputs.sgl_kernel_changed == 'true'
    uses: ./.github/workflows/_sail-pr-test-sgl-kernel-build.yml
    with:
      git_ref: ${{ inputs.ref || github.sha }}

  # ==================== Stage A: smoke gate (< 5 min test budget) ==================== #
  stage-a-test-1-gpu-ppu:
    needs: [check-changes, build-sgl-kernel]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      needs.check-changes.outputs.changes_exist == 'true'
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2

      - name: Download prebuilt sgl-kernel wheel
        if: needs.build-sgl-kernel.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wheel-python3.12-cuda13.0
          path: ${{ github.workspace }}/sgl-kernel-wheel

      - name: Run PPU smoke test (stage-a) via K8s
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          image: ${{ env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          command: |
            cd /workspace/source &&
            bash scripts/ci/ppu/ppu_install_dependency.sh &&
            git config --global --add safe.directory /workspace/source &&
            JIT_MTIME=$(git -C /workspace/source log -1 --format=%ct 2>/dev/null || echo 0) &&
            { [ "$JIT_MTIME" != 0 ] && find /workspace/source/python/sglang/jit_kernel -type f -exec touch -d @$JIT_MTIME {} + && echo 'Pinned JIT source mtimes' || true; } &&
            cd test &&
            python3 run_suite.py --hw ppu --suite stage-a-test-1-gpu-ppu --continue-on-error
          host_volumes: "/nas_aisw/cache/sglang-jit-ci:/root/.cache/tvm-ffi"
          extra_env: "SGLANG_IS_IN_CI=true,SGLANG_TEST_MAX_RETRY=0,CUDA_VISIBLE_DEVICES=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,SGL_KERNEL_WHEEL_DIR=/workspace/source/sgl-kernel-wheel"
          container_options: |
            privileged: true
            host_ipc: true
            shm_size: 8Gi
          artifact_paths: |
            sgl-kernel-wheel
          timeout_minutes: 110

  # ==================== Stage B: 1-GPU body ==================== #
  stage-b-test-1-gpu-ppu:
    needs:
      [
        check-changes,
        build-sgl-kernel,
        stage-a-test-1-gpu-ppu,
      ]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      needs.check-changes.outputs.changes_exist == 'true'
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2

      - name: Download prebuilt sgl-kernel wheel
        if: needs.build-sgl-kernel.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wheel-python3.12-cuda13.0
          path: ${{ github.workspace }}/sgl-kernel-wheel

      - name: Run PPU 1-GPU tests (stage-b) via K8s
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          image: ${{ env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          command: |
            cd /workspace/source &&
            bash scripts/ci/ppu/ppu_install_dependency.sh &&
            git config --global --add safe.directory /workspace/source &&
            JIT_MTIME=$(git -C /workspace/source log -1 --format=%ct 2>/dev/null || echo 0) &&
            { [ "$JIT_MTIME" != 0 ] && find /workspace/source/python/sglang/jit_kernel -type f -exec touch -d @$JIT_MTIME {} + && echo 'Pinned JIT source mtimes' || true; } &&
            cd test &&
            python3 run_suite.py --hw ppu --suite stage-b-test-1-gpu-ppu --continue-on-error
          host_volumes: "/nas_aisw/cache/sglang-jit-ci:/root/.cache/tvm-ffi"
          extra_env: "SGLANG_IS_IN_CI=true,CUDA_VISIBLE_DEVICES=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,SGL_KERNEL_WHEEL_DIR=/workspace/source/sgl-kernel-wheel"
          container_options: |
            privileged: true
            host_ipc: true
            shm_size: 8Gi
          artifact_paths: |
            sgl-kernel-wheel
          timeout_minutes: 110

  # ==================== Stage C: 2-GPU ==================== #
  stage-c-test-2-gpu-ppu:
    needs:
      [
        check-changes,
        build-sgl-kernel,
        stage-b-test-1-gpu-ppu,
      ]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      needs.check-changes.outputs.changes_exist == 'true'
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2

      - name: Download prebuilt sgl-kernel wheel
        if: needs.build-sgl-kernel.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wheel-python3.12-cuda13.0
          path: ${{ github.workspace }}/sgl-kernel-wheel

      - name: Run PPU 2-GPU tests (stage-c) via K8s
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          image: ${{ env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 2
          command: |
            export CUDA_VISIBLE_DEVICES=0,1 &&
            cd /workspace/source &&
            bash scripts/ci/ppu/ppu_install_dependency.sh &&
            git config --global --add safe.directory /workspace/source &&
            JIT_MTIME=$(git -C /workspace/source log -1 --format=%ct 2>/dev/null || echo 0) &&
            { [ "$JIT_MTIME" != 0 ] && find /workspace/source/python/sglang/jit_kernel -type f -exec touch -d @$JIT_MTIME {} + && echo 'Pinned JIT source mtimes' || true; } &&
            cd test &&
            python3 run_suite.py --hw ppu --suite stage-c-test-2-gpu-ppu --continue-on-error
          host_volumes: "/nas_aisw/cache/sglang-jit-ci:/root/.cache/tvm-ffi"
          extra_env: "SGLANG_IS_IN_CI=true,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,SGL_KERNEL_WHEEL_DIR=/workspace/source/sgl-kernel-wheel"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          artifact_paths: |
            sgl-kernel-wheel
          timeout_minutes: 110

  # ==================== Finish ==================== #
  pr-test-ppu-finish:
    needs:
      [
        check-changes,
        build-sgl-kernel,
        stage-a-test-1-gpu-ppu,
        stage-b-test-1-gpu-ppu,
        stage-c-test-2-gpu-ppu,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "$json_needs" | jq -r 'keys_unsorted[]')

          for job in $job_names; do
            result=$(echo "$json_needs" | jq -r --arg j "$job" '.[$j].result')
            echo "$job: $result"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job $job did not succeed (result: $result)."
              exit 1
            fi
          done
          echo "All jobs completed successfully"
