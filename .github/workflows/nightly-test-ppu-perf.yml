name: Nightly Perf Test (PPU)

# 保留手动入口；定时调度和全局锁只由 global 持有，避免嵌套自锁。
# 同一提交中的 global 解析源码 SHA，测试定义继续使用 @v0.5.18。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Code ref (branch, tag, or SHA) to check out in-pod. Defaults to v0.5.18.'
        required: false
        type: string
        default: ''

# 权限须覆盖 global 和底层趋势发布所需权限。
permissions:
  contents: write
  actions: read

jobs:
  perf:
    uses: ./.github/workflows/nightly-test-ppu-global.yml
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      suite: perf
    secrets: inherit
