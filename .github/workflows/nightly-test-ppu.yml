name: Nightly Test (PPU)

# PROBE SHIM -- not for merge. This borrows the default-branch workflow id of
# nightly-test-ppu.yml only so that workflow_dispatch resolves; its entire body
# has been replaced with a thin launcher that forwards to the Answer
# orchestrator under test. The original nightly board jobs were removed on
# purpose so a dispatch here starts nothing but the orchestrator.
#
# `uses: ./` resolves nightly-test-ppu-answer.yml from this probe commit, whose
# tree is the PR #34 head (per-model regression baselines seeded on top of the
# severity/gate change); the orchestrator then pins every callee's in-pod
# checkout to `ref`, which must be passed as a full 40-char SHA so the 15
# Answer entries judge exactly that commit.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full 40-char SHA to test (pins the in-pod checkout).'
        required: true
        type: string

concurrency:
  group: probe-answer-orchestrator-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  orchestrate:
    uses: ./.github/workflows/nightly-test-ppu-answer.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit
