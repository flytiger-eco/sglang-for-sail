                  def test_native_cuda_partitions(self):
                      planner = cuda_partitioning()
                      cases = [('base', 'pr-test.yml'), ('extra', 'pr-test-extra.yml'), ('nightly', 'nightly-test-nvidia.yml')]
                      for scope, workflow in cases:
                          native = planner.compute_partitions(registrations, str(ROOT), planner.load_run_timeouts(ROOT / '.github/workflows' / workflow))
                          plan = make_plan(scope, '', 0, 2, hardware)
                          for entry in plan['entries']:
                              suite = entry['suite']
                              self.assertEqual(entry['partition_size'], native[suite]['size'] if suite in native else 1)
                              if suite.startswith('base-b-kernel-'):
                                  self.assertEqual(entry['partition_size'], 1)
                                  command = worker_command(entry, self.directory)
                                  self.assertFalse(any(arg.startswith('--auto-partition') for arg in command))
                                  self.assertNotIn('--partition-model-file', command)
                                  expected = entry['files']
                                  self.assertTrue(matches_selection(entry, list(reversed(expected)), expected))
                                  self.assertFalse(matches_selection(entry, expected + expected[:1], expected))
                                  self.assertFalse(matches_selection(entry, expected[1:], expected))
                              else:
                                  self.assertEqual(entry['partition_policy'], 'cuda')
                                  self.assertIn('--auto-partition-size', worker_command(entry, self.directory))
                      suite = 'extra-a-test-1-gpu-large'
                      files = [r for r in registrations if r.backend == module.HWBackend.CUDA and r.effective_suite == suite and r.disabled is None]
                      estimates = {str(Path(r.filename).relative_to(ROOT)): max(r.est_time * 1.5, 1) for r in files}
                      model = {'est': {suite: estimates}, 'fit': {suite: {'coeff': 1.0, 'bias': 120}}}
                      plan = make_plan('extra', suite, 0, 2, hardware, partition_model=model, partition_model_sha='c' * 40)
                      expected = planner.compute_partitions(files, str(ROOT), planner.load_run_timeouts(ROOT / '.github/workflows/pr-test-extra.yml'), partition_model=model)[suite]['size']
                      self.assertEqual(len(plan['entries']), expected)
                      live = {str(ROOT / name): value for name, value in estimates.items()}
                      for entry in plan['entries']:
                          selected = module.auto_partition(files, entry['partition_id'], expected, live_est=live)
                          self.assertEqual(entry['files'], [str(Path(r.filename).relative_to(ROOT)) for r in selected])
                          command = worker_command(entry, self.directory)
                          self.assertEqual(command[command.index('--suite-timeout') + 1], str(entry['test_budget_seconds']))
                          self.assertEqual(command[command.index('--partition-model-file') + 1], str(BUNDLE / 'partition-model.json'))
                      with patch.dict(globals(), BUNDLE=self.directory):
                          save(BUNDLE / 'plan.json', plan)
                          self.assertEqual(context()['partition_model'], model)
                          plan['partition_model']['fit'][suite]['bias'] = 0
                          save(BUNDLE / 'plan.json', plan)
                          with self.assertRaisesRegex(ValueError, 'Plan hash mismatch'):
                              context()

