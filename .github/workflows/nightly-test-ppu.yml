name: Nightly Test (PPU)

# DISPATCH SHIM -- PROBE BRANCH ONLY.
#
# Replaces the indexed nightly caller with a thin launcher for the 32-PPU
# four-node Answer line. The workflow body is resolved from this branch; the
# source under test is checked out from the full SHA passed through `ref`.
#
# Never merge this branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full 40-character source revision to test.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shim-ppu-answer32-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  answer32:
    uses: ./.github/workflows/test-ppu-answer-32-k8s.yml
    with:
      ref: "${{ inputs.ref }}"
    secrets: inherit
