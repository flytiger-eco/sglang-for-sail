name: Nightly Test (PPU)

# DISPATCH SHIM -- PROBE BRANCH ONLY. Never merge this branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full 40-character source revision to test.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shim-ppu-accuracy-all-smoke-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  accuracy-all-smoke:
    uses: ./.github/workflows/test-ppu-accuracy-k8s.yml
    with:
      ref: "${{ inputs.ref }}"
      mode: smoke
      entries: all
    secrets: inherit
