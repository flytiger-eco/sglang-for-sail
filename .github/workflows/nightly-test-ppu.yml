                      with patch.dict(globals(), BUNDLE=self.directory, context=lambda: plan), patch.dict(os.environ, HF_HUB_CACHE=str(self.directory / 'cache')), contextlib.redirect_stdout(io.StringIO()):
                          save(BUNDLE / 'models.json', inventory)
