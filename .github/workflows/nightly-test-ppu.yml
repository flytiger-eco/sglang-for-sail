name: Nightly Test (PPU)

# PROBE-ONLY SHIM. This file is replaced on branch
# probe/pr-test-k8s-validate to borrow nightly-test-ppu.yml's
# default-branch workflow_dispatch index and forward to the
# workflow-under-test, pr-test-ppu.yml (which is not indexed on main).
# It is never merged into any PR.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '40-hex commit SHA to test (checked out inside the pods).'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

jobs:
  orchestrate:
    uses: ./.github/workflows/pr-test-ppu.yml
    with:
      # Pin the pod checkout to the exact commit under test. A short SHA
      # would trip actions/checkout#265, so always pass a full 40-hex SHA.
      ref: ${{ inputs.ref || github.sha }}
      # Force all stages to run: paths-filter has no PR base on dispatch.
      run_all_tests: true
      # Human review already gated the change; skip the run-ci label gate.
      require_run_ci_label: false
    secrets: inherit
