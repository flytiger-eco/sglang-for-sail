name: Nightly Test (PPU)

# PROBE-ONLY SHIM -- borrowed handle, never merged.
#
# GitHub indexes workflow_dispatch by the workflow file's presence on the
# default branch, so the not-yet-merged PD-Perf (PR#45) and Accuracy (PR#46)
# schedulers cannot be dispatched by their own names. This file borrows the
# already-registered `nightly-test-ppu.yml` handle (workflow id 333448550, still
# active) purely to trigger a one-off baseline run: dispatch it with --ref on
# this probe branch and the dispatched version is this file, which fans out to
# the same reusable workflows the two schedulers call, pinned to @v0.5.18. The
# original nightly board jobs are deliberately gone so this dispatch ignites
# nothing but the lines selected below.
#
# Delete this branch once the baseline runs have filed.

on:
  workflow_dispatch:
    inputs:
      case:
        description: 'Which line to baseline.'
        required: true
        type: choice
        default: all
        options:
          - all
          - pd-perf
          - accuracy
      ref:
        description: 'Code ref to check out in-pod. Defaults to v0.5.18.'
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-baseline-dispatch-${{ inputs.case }}-${{ inputs.ref || 'v0.5.18' }}
  cancel-in-progress: true

# Union of both lines' needs: PD-Perf callees push trend rows to
# nightly-test-data (contents: write + actions: read); Accuracy only reads.
permissions:
  contents: write
  actions: read

jobs:
  glm52-fp8-channelwise:
    name: PD Perf (GLM-5.2 fp8-channelwise)
    if: inputs.case == 'all' || inputs.case == 'pd-perf'
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-pd-perf-glm52.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      pd_config: fp8-channelwise
    secrets: inherit

  glm52-mxfp4-fp8:
    name: PD Perf (GLM-5.2 mxfp4-fp8)
    if: inputs.case == 'all' || inputs.case == 'pd-perf'
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-pd-perf-glm52.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      pd_config: mxfp4-fp8
    secrets: inherit

  qwen35-mxfp4-fp8:
    name: PD Perf (Qwen3.5 mxfp4-fp8)
    if: inputs.case == 'all' || inputs.case == 'pd-perf'
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-pd-perf-qwen35.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      pd_config: mxfp4-fp8
    secrets: inherit

  qwen35-fp8-channelwise:
    name: PD Perf (Qwen3.5 fp8-channelwise)
    if: inputs.case == 'all' || inputs.case == 'pd-perf'
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-pd-perf-qwen35.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      pd_config: fp8-channelwise
    secrets: inherit

  accuracy:
    name: Accuracy (all entries, full)
    if: inputs.case == 'all' || inputs.case == 'accuracy'
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-accuracy.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      mode: full
      entries: all
    secrets: inherit
