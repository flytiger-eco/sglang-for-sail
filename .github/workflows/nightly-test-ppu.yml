name: Probe PR68 DeepSeek Answer and Accuracy
run-name: PR68 DeepSeek probe @ ${{ inputs.ref }}

# 临时验证入口：仅保留 PR #68 的两个 job，串行请求一块八卡板。
# 不合入版本分支，不发布趋势数据；运行参数与被审提交保持一致。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'PR source commit to verify.'
        required: true
        type: string
        default: 'e22f29c7071960f35a3c9a33cf17cf94691b4be0'
      mode:
        description: 'Probe evaluates the 20-sample smoke configuration.'
        required: false
        type: choice
        options: [smoke]
        default: smoke
      entries:
        description: 'Probe accuracy entry.'
        required: false
        type: string
        default: dsv4flash-w8a8-gsm8k-smoke
      dataset_dir:
        description: 'Optional staged dataset directory override.'
        required: false
        type: string
        default: ''

concurrency:
  group: probe-pr68-dsv4flash
  cancel-in-progress: false

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312

jobs:
  ans-dsv4flash-w8a8:
    name: deepseek-v4-flash w8a8-int8 (btv1.1)
    if: ${{ !cancelled() }}
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 300
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Observe compute Pod environment
        continue-on-error: true
        shell: bash
        env:
          PPU_ENV_JOB: ${{ github.job }}
          PPU_ENV_EXPECTED_PODS: "1"
          PPU_ENV_OUTPUT: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/dsv4-flash-w8a8-int8/environment-pods.tsv
        run: bash scripts/ci/ppu/observe_pod_environment.sh start "$PPU_ENV_OUTPUT"
      - name: Run deepseek-v4-flash w8a8-int8 via K8s
        uses: flytiger-eco/ppu-distributed-action@caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9
        with:
          image: ${{ env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          command: bash /workspace/source/scripts/ci/ppu/run_answer_suite_board.sh
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "SGLANG_PPU_DISTRIBUTED_ACTION_SHA=caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9,SGLANG_PPU_WORKFLOW_SHA=${{ github.workflow_sha }},SGLANG_PPU_POD_METADATA=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/dsv4-flash-w8a8-int8/environment-pods.tsv,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},GITHUB_REPOSITORY=${{ github.repository }},GITHUB_RUN_ID=${{ github.run_id }},GITHUB_RUN_ATTEMPT=${{ github.run_attempt }},GITHUB_SERVER_URL=${{ github.server_url }},ANSWER_SUITE=nightly-answer-8-dsv4flash-ppu,ANSWER_TIMEOUT_PER_FILE=14400,SGLANG_PPU_ANSWER_TEST_CONFIG=/workspace/source/test/registered/ppu/answer_eval/configs/dsv4-flash/w8a8-int8-144g.json,SGLANG_PPU_ANSWER_RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/dsv4-flash-w8a8-int8"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 270
      - name: Collect Answer evidence
        if: always()
        shell: bash
        env:
          ENTRY: dsv4-flash-w8a8-int8
          ANSWER_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/dsv4-flash-w8a8-int8
        run: bash scripts/ci/ppu/collect_answer_evidence.sh
      - name: Upload Answer evidence
        id: upload_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-answer-k8s-dsv4-flash-w8a8-int8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-answer-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Wait out the artifact egress congestion
        if: always() && steps.upload_evidence.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Upload Answer evidence (second attempt)
        if: always() && steps.upload_evidence.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-answer-k8s-dsv4-flash-w8a8-int8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-answer-artifacts/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  dsv4flash-w8a8-gsm8k-smoke:
    name: deepseek-v4-flash w8a8 gsm8k smoke (btv1.1)
    needs: ans-dsv4flash-w8a8
    if: ${{ !cancelled() }}
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 160
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Observe compute Pod environment
        continue-on-error: true
        shell: bash
        env:
          PPU_ENV_JOB: acc-2b8f4e6a9c31
          PPU_ENV_EXPECTED_PODS: "1"
          PPU_ENV_OUTPUT: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/accuracy-results/dsv4-flash-w8a8-gsm8k-smoke/environment-pods.tsv
        run: bash scripts/ci/ppu/observe_pod_environment.sh start "$PPU_ENV_OUTPUT"
      - name: Run deepseek-v4-flash w8a8 gsm8k smoke via K8s
        uses: flytiger-eco/ppu-distributed-action@caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9
        with:
          job_suffix: acc-2b8f4e6a9c31
          image: ${{ env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          command: bash /workspace/source/scripts/ci/ppu/run_accuracy_suite_board.sh
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "SGLANG_PPU_DISTRIBUTED_ACTION_SHA=caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9,SGLANG_PPU_WORKFLOW_SHA=${{ github.workflow_sha }},SGLANG_PPU_POD_METADATA=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/accuracy-results/dsv4-flash-w8a8-gsm8k-smoke/environment-pods.tsv,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},GITHUB_REPOSITORY=${{ github.repository }},GITHUB_RUN_ID=${{ github.run_id }},GITHUB_RUN_ATTEMPT=${{ github.run_attempt }},GITHUB_SERVER_URL=${{ github.server_url }},ACCURACY_SUITE=nightly-accuracy-8-dsv4flash-ppu,ACCURACY_TIMEOUT_PER_FILE=7200,SGLANG_PPU_ACCURACY_TEST_CONFIG=/workspace/source/test/registered/ppu/accuracy_eval/configs/dsv4-flash/w8a8-int8-144g-gsm8k-smoke.json,SGLANG_PPU_ACCURACY_RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/accuracy-results/dsv4-flash-w8a8-gsm8k-smoke,SGLANG_DSV4_FP4_EXPERTS=0,SGLANG_OPT_USE_TOPK_V2=0,SGLANG_DEFAULT_THINKING=1,SGLANG_DSV4_REASONING_EFFORT=high${{ inputs.dataset_dir && format(',SGLANG_PPU_ACCURACY_DATASET_DIR={0}', inputs.dataset_dir) || '' }}"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 140
      - name: Collect Accuracy evidence
        if: always()
        shell: bash
        env:
          ENTRY: dsv4-flash-w8a8-gsm8k-smoke
          ACCURACY_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/accuracy-results/dsv4-flash-w8a8-gsm8k-smoke
        run: bash scripts/ci/ppu/collect_accuracy_evidence.sh
      - name: Upload Accuracy evidence
        id: upload_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-accuracy-k8s-dsv4-flash-w8a8-gsm8k-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-accuracy-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Wait out the artifact egress congestion
        if: always() && steps.upload_evidence.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Upload Accuracy evidence (second attempt)
        if: always() && steps.upload_evidence.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-accuracy-k8s-dsv4-flash-w8a8-gsm8k-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-accuracy-artifacts/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
