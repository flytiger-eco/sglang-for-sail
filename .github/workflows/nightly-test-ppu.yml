        run: bash scripts/ci/ppu/observe_pod_environment.sh start "$PPU_ENV_OUTPUT"
      - name: Run nightly-8-ppu via K8s
        uses: flytiger-eco/ppu-distributed-action@06c8ee7cadaae2086db4977e571b19f461653f16
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: 8
          node_selector: "board-type=OAM-810E"
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          command: bash /workspace/source/scripts/ci/ppu/run_nightly_suite_board.sh
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "NIGHTLY_SUITE=nightly-8-ppu,NIGHTLY_DEVICE_COUNT=8,NIGHTLY_MARLIN_PRELOAD=false,NIGHTLY_WARM_MODELS=/nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct,NIGHTLY_RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/nightly-results,NIGHTLY_TIMEOUT_PER_FILE=1200,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 285
          cleanup_policy: always
      - name: Collect nightly results
        if: always()
        shell: bash
        env:
          NIGHTLY_JOB: ${{ github.job }}
          NIGHTLY_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/nightly-results
        run: bash scripts/ci/ppu/collect_nightly_results.sh
      # Best effort: the verdict has already left this job over the annotations
      # the step above prints, so a reset on the github egress here must not turn
      # a passing suite red. What a lost upload costs is the copy that exists
      # nowhere else -- run.log with the per-file TIMINGS block.
      - name: Upload nightly results
        id: upload_results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-nightly-k8s-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Wait out the artifact egress congestion
        if: always() && steps.upload_results.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Upload nightly results (second attempt)
        if: always() && steps.upload_results.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-nightly-k8s-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-artifacts/
          if-no-files-found: warn
          # The first attempt can be reset after it has created the artifact,
          # and v4 refuses a name it already holds.
          overwrite: true
          retention-days: 30

  nightly-test-ppu-finish:
    needs: [nightly-1a-ppu, nightly-1b-ppu, nightly-2-ppu, nightly-4-ppu, nightly-8-ppu]
    if: always()
    # Board-free: this job only reads the `needs` verdicts and the artifacts the
    # levels uploaded.
    runs-on: ubuntu-latest
    # Rendered here, not in the level jobs: their container hook drops writes to
    # $GITHUB_STEP_SUMMARY (see collect_answer_evidence.sh); this one keeps them.
    # `actions: read` is for downloading the levels' artifacts.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      # Best effort, like the uploads: a lost upload just leaves that level unlisted.
      - name: Download nightly results
        id: download
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ppu-nightly-k8s-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-artifacts
      - name: Name the files that failed
        if: always()
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          # This table must never decide the ladder: a broken renderer leaves the
          # verdict step below untouched.
          if python3 scripts/ci/ppu/nightly_failures.py nightly-artifacts > nightly-failures.md; then
            cat nightly-failures.md
            cat nightly-failures.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not render the failed-file table; each level job's \`✗ FAILED:\` annotations still name its failing files"
          fi
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              sep = ','
              print(f'Failed jobs: {sep.join(failed)}')
              sys.exit(1)
          print('All jobs completed successfully')
          "
