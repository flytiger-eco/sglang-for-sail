name: Nightly Test (PPU)

# PROBE-ONLY SHIM -- borrowed handle, never merged.
#
# GitHub indexes workflow_dispatch by the workflow file's presence on the
# default branch, so the not-yet-merged PD-Perf (PR#45) and Accuracy (PR#46)
# schedulers cannot be dispatched by their own names. This file borrows the
# already-registered `nightly-test-ppu.yml` handle (workflow id 333448550, still
# active) purely to trigger a one-off baseline run: dispatch it with --ref on
# this probe branch and the dispatched version is this file. The PD-Perf callees
# are resolved locally with `uses: ./` from *this* commit, because the branch
# carries the per-checkpoint split (distinct static job keys) that is not yet on
# v0.5.18 -- a `@v0.5.18` ref would resolve the old single-job callee and race on
# the tar the way run 35440393512 did. Accuracy is unchanged, so it still borrows
# the callee from @v0.5.18. The original nightly board jobs are deliberately gone
# so this dispatch ignites nothing but the lines selected below.
#
# Delete this branch once the baseline runs have filed.

on:
  workflow_dispatch:
    inputs:
      case:
        description: 'Which line to baseline.'
        required: true
        type: choice
        default: all
        options:
          - all
          - pd-perf
          - accuracy
      ref:
        description: 'Code ref to check out in-pod. Defaults to v0.5.18.'
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-baseline-dispatch-${{ inputs.case }}-${{ inputs.ref || 'v0.5.18' }}
  cancel-in-progress: true

# Union of both lines' needs: PD-Perf callees push trend rows to
# nightly-test-data (contents: write + actions: read); Accuracy only reads.
permissions:
  contents: write
  actions: read

jobs:
  # REMAINING-THREE FAN-OUT (2026-09-20): the reduced-demand probe already filed a
  # green glm52 fp8-channelwise baseline (run 35501221161, with the
  # SGLANG_SAIL_MNNVL_FABRIC_SUPPORTED=0 fix now on PR#48). This dispatch fills the
  # other three PD checkpoints -- glm52 mxfp4-fp8, qwen35 fp8-channelwise, qwen35
  # mxfp4-fp8 -- so glm52 narrows to mxfp4-fp8 (its fp8chan job is skipped by the
  # callee gate) and qwen35 runs both. Three 2-node gangs = six boards; they need
  # not co-schedule across gangs, so they trickle in as the pool frees.
  glm52:
    name: PD Perf (GLM-5.2)
    if: inputs.case == 'all' || inputs.case == 'pd-perf'
    uses: ./.github/workflows/test-ppu-pd-perf-glm52.yml
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      pd_config: mxfp4-fp8
    secrets: inherit

  qwen35:
    name: PD Perf (Qwen3.5)
    if: inputs.case == 'all' || inputs.case == 'pd-perf'
    uses: ./.github/workflows/test-ppu-pd-perf-qwen35.yml
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      pd_config: all
    secrets: inherit

  accuracy:
    name: Accuracy (GLM-5.2 mxfp4 C-Eval, 2-subject DSA review probe)
    if: inputs.case == 'all' || inputs.case == 'accuracy'
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-accuracy.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      mode: full
      # DSA REVIEW PROBE (2026-09-20): the v0.5.18 accuracy baseline (run
      # 35440401306) put GLM-5.2 as the only regressing model, and per-subject
      # C-Eval showed advanced_mathematics (0/19) and probability_and_statistics
      # (0/18) scoring exactly zero on both quants -- the long-reasoning STEM
      # subjects, and GLM-5.2 is the only model on attention_backend=dsa. This
      # narrows to that one entry; its config is narrowed to just those two
      # subjects (subset_list) with the baseline nulled, and the collector is
      # widened to upload per-sample predictions/reviews, so the generated text
      # can settle whether the answers are wrong or the CoT never converges.
      # Requires -f ref=<probe branch> so the in-pod checkout carries these edits.
      entries: glm52-mxfp4-ceval
    secrets: inherit
