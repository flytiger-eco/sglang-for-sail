name: PPU CUDA Sweep (890P, temporary nightly entry)
run-name: PPU CUDA sweep | ${{ inputs.scope }} | parallel=${{ inputs.max_parallel }} | plan-only=${{ inputs.plan_only }}

# Temporarily reuse the registered nightly path. Move the sweep and restore nightly after validation; do not merge.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full dispatched commit SHA; empty uses the dispatched commit'
        type: string
        default: ''
      scope:
        description: 'CUDA scope including kernel unit/benchmark; all is plan-only (weekly/stress/native workflows excluded)'
        type: choice
        options: [base, extra, nightly, all]
        default: base
      suites:
        description: 'Optional comma-separated exact CUDA suites within the selected scope'
        type: string
        default: ''
      plan_only:
        description: 'Inventory only: no PPU allocation'
        type: boolean
        default: true
      max_parallel:
        description: 'Concurrent whole 890P boards (1-2); not visible card count'
        type: number
        default: 1
      timeout_per_file:
        description: 'Seconds (600-3600); 0 derives a fixed timeout per suite'
        type: number
        default: 0

concurrency:
  group: ppu-cuda-sweep-890p-${{ inputs.scope }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.17-py312-20261001
  PPU_SDK_VERSION: 2.2.0

jobs:
  sweep-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
      parallel: ${{ steps.plan.outputs.parallel }}
    steps:
      - name: Validate dispatch before checkout
        id: dispatch
        env:
          REQUESTED_SHA: ${{ inputs.ref }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/feat/ppu-cuda-sweep-890p ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REQUESTED_SHA:-$GITHUB_SHA}" == "$GITHUB_SHA" ]]
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.dispatch.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build self-contained sweep driver
        run: |
          python3 -m pip install PyYAML==6.0.3
          mkdir -p .ppu-sweep
          cp scripts/ci/ppu/cuda_sweep_hardware.json .ppu-sweep/hardware.json
          cat > .ppu-sweep/sweep.py <<'PY'
          import argparse
          import csv
          import hashlib
          import importlib.util
          import json
          import math
          import os
          import platform
          import re
          import shutil
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET
          from collections import Counter, defaultdict
          from pathlib import Path

          BUNDLE = Path(__file__).resolve().parent
          ROOT = Path.cwd().resolve()
          # Base includes the original CUDA kernel unit/benchmark registrations for complete coverage across all three scopes.
          STAGES = {'base': {'base-a', 'base-b', 'base-b-kernel-unit', 'base-b-kernel-benchmark', 'base-c'}, 'extra': {'extra-a', 'extra-b'}, 'nightly': {'nightly'}}
          STAGES['all'] = set().union(*STAGES.values())

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def read(path):
              return json.loads(Path(path).read_text())

          def save(path, value):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, indent=2) + '\n')

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module

          def fingerprint(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True).encode()).hexdigest()

          def output(name, value):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write(f'{name}={value}\n')

          def summary(text):
              print(text)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                      stream.write(text + '\n')

          def cuda_partitioning():
              name = 'sweep_cuda_partitioning'
              if name not in sys.modules:
                  load(name, ROOT / 'scripts/ci/utils/compute_partitions.py')
              return sys.modules[name]

          def native_layout(registrations, model):
              import yaml
              planner = cuda_partitioning()
              timeouts = {}
              for filename in ('pr-test.yml', 'pr-test-extra.yml', 'nightly-test-nvidia.yml'):
                  timeouts.update(planner.load_run_timeouts(ROOT / '.github/workflows' / filename))
              kernel = yaml.safe_load((ROOT / '.github/workflows/pr-test-jit-kernel.yml').read_text())
              whole_suites = set()
              for job in kernel['jobs'].values():
                  for step in job.get('steps', []):
                      command = step.get('run', '')
                      suites = re.findall(r'--suite\s+(base-b-kernel-[a-z0-9-]+)', command)
                      if suites:
                          require('--auto-partition' not in command and 'matrix' not in job.get('strategy', {}), 'CUDA kernel dispatch changed; update whole-suite handling')
                          whole_suites.update(suites)
              sizes = planner.compute_partitions(registrations, str(ROOT), timeouts, partition_model=model)
              return sizes, timeouts, whole_suites

          def resolve_partition_model():
              try:
                  sha = subprocess.check_output(['gh', 'api', 'repos/sgl-project/sglang-ci-stats/commits/main', '--jq', '.sha'], text=True, stderr=subprocess.DEVNULL, timeout=25).strip()
              except (OSError, subprocess.SubprocessError):
                  sha = ''
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  summary('CUDA partition model unavailable; using the native static est_time fallback.')
                  return None, ''
              model = json.loads(subprocess.check_output(['gh', 'api', f'repos/sgl-project/sglang-ci-stats/contents/model.json?ref={sha}', '-H', 'Accept: application/vnd.github.raw+json'], text=True, timeout=60))
              require(isinstance(model, dict), 'Invalid CUDA partition model')
              return model, sha

          def registry():
              module = cuda_partitioning()._ci_register
              paths = sorted(str(p.resolve()) for p in (ROOT / 'test/registered').rglob('*.py') if p.name not in {'conftest.py', '__init__.py'})
              return module, module.collect_tests(paths, sanity_check=True)

          def make_plan(scope, suites, timeout, parallel, hardware, *, plan_only=True, partition_model=None, partition_model_sha=''):
              require(scope in STAGES, 'Unknown scope')
              require(type(plan_only) is bool, 'plan_only must be boolean')
              require((partition_model is None and partition_model_sha == '') or (isinstance(partition_model, dict) and re.fullmatch(r'[0-9a-f]{40}', partition_model_sha)), 'Partition model must have an immutable identity')
              require(plan_only or scope != 'all', 'scope=all is only allowed in plan-only mode')
              require(type(parallel) is int and 1 <= parallel <= 2, 'max_parallel must be 1 or 2')
              require(type(timeout) is int and (timeout == 0 or 600 <= timeout <= 3600), 'Invalid per-file timeout')
              require(hardware['schema_version'] == 1 and hardware['board'] == 'ZW-M890P' and hardware['reserved_devices'] == 8, 'Invalid board allocation')
              require(hardware['test_budget_seconds'] == 10800 and hardware['worker_minutes'] == 300 and hardware['job_minutes'] == 330, 'Unexpected job budgets')
              module, registrations = registry()
              groups = defaultdict(list)
              disabled = []
              for reg in registrations:
                  if reg.backend != module.HWBackend.CUDA:
                      continue
                  stage = reg.stage or reg.effective_suite.split('-test-', 1)[0]
                  if stage not in STAGES['all']:
                      continue
                  require(not reg.nightly, 'Unexpected legacy nightly flag: ' + reg.effective_suite)
                  groups[reg.effective_suite].append(reg)
              selected = sorted(set(s.strip() for s in suites.split(',') if s.strip())) if suites.strip() else sorted(s for s in groups if s.split('-test-', 1)[0] in STAGES[scope])
              require(selected and all(s in groups for s in selected), 'Empty selection or unknown suite')
              require(all(s.split('-test-', 1)[0] in STAGES[scope] for s in selected), 'Requested suites must belong to the selected scope')
              sizes, native_timeouts, whole_suites = native_layout([r for s in selected for r in groups[s]], partition_model)
              entries = []
              for suite in selected:
                  require(re.fullmatch(r'[a-z0-9-]+', suite), 'Unsafe suite name')
                  enabled = [r for r in groups[suite] if r.disabled is None]
                  disabled.extend({'file': str(Path(r.filename).relative_to(ROOT)), 'cuda_suite': suite, 'reason': r.disabled} for r in groups[suite] if r.disabled is not None)
                  require(enabled, 'Suite has no enabled files: ' + suite)
                  configs = {r.runner_config or suite.split('-test-', 1)[1] for r in enabled}
                  require(len(configs) == 1, 'Mixed runner configurations')
                  config = configs.pop()
                  require(config in hardware['runner_configs'], 'Unmapped CUDA runner: ' + config)
                  devices = hardware['runner_configs'][config]
                  require(type(devices) is int and devices in (1, 2, 4, 8), 'Invalid visible card count')
                  require(len({r.filename for r in enabled}) == len(enabled), 'Duplicate registration in ' + suite)
                  require(all(math.isfinite(r.est_time) and r.est_time >= 0 for r in enabled), 'Invalid time estimates')
                  limit = timeout or math.ceil(min(max(3 * max(r.est_time for r in enabled), 600), 3600))
                  require(suite in sizes or suite.startswith('base-b-kernel-'), 'No native CUDA dispatch policy for ' + suite)
                  size = sizes[suite]['size'] if suite in sizes else 1
                  policy = 'cuda' if suite in sizes else ('whole-suite' if suite in whole_suites else 'registered-only whole-suite')
                  run_minutes = native_timeouts.get(suite, hardware['test_budget_seconds'] // 60)
                  require(0 < run_minutes <= 360, 'Unsupported native CUDA run budget')
                  test_budget = max(hardware['test_budget_seconds'], run_minutes * 60)
                  worker_minutes = hardware['worker_minutes'] + (test_budget - hardware['test_budget_seconds']) // 60
                  job_minutes = worker_minutes + hardware['job_minutes'] - hardware['worker_minutes']
                  estimates = (partition_model or {}).get('est', {}).get(suite, {})
                  live_est = {str(ROOT / key): float(value) for key, value in estimates.items()} or None
                  require(all(math.isfinite(v) and v >= 0 for v in (live_est or {}).values()), 'Invalid live time estimates')
                  partitions = [module.auto_partition(enabled, i, size, live_est=live_est) for i in range(size)] if policy == 'cuda' else [enabled]
                  require(all(partitions), 'Native CUDA partition is empty')
                  for i, part in enumerate(partitions):
                      entries.append({'id': f'e{len(entries):03d}', 'suite': suite, 'runner_config': config, 'n_devices': devices, 'partition_id': i, 'partition_size': size, 'partition_policy': policy, 'timeout': limit, 'test_budget_seconds': test_budget, 'worker_minutes': worker_minutes, 'job_minutes': job_minutes, 'files': [str(Path(r.filename).relative_to(ROOT)) for r in part]})
              require(0 < len(entries) <= 256, 'Matrix exceeds 256 entries; select one scope or fewer suites')
              sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              plan = {'schema_version': 1, 'sha': sha, 'workflow_sha': os.environ['WORKFLOW_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'scope': scope, 'plan_only': plan_only, 'parallel': parallel, 'hardware': hardware, 'partition_model': partition_model, 'partition_model_sha': partition_model_sha, 'entries': entries, 'disabled': disabled}
              plan['plan_hash'] = fingerprint(plan)
              return plan

          def plan_command():
              require(os.environ['PLAN_ONLY'] in ('true', 'false'), 'Invalid plan_only input')
              require(os.environ['PLAN_ONLY'] == 'true' or os.environ['SCOPE'] != 'all', 'scope=all is only allowed in plan-only mode')
              model, model_sha = resolve_partition_model()
              plan = make_plan(os.environ['SCOPE'], os.environ.get('SUITES', ''), int(os.environ['FILE_TIMEOUT']), int(os.environ['PARALLEL']), read(BUNDLE / 'hardware.json'), plan_only=os.environ['PLAN_ONLY'] == 'true', partition_model=model, partition_model_sha=model_sha)
              save(BUNDLE / 'plan.json', plan)
              output('sha', plan['sha'])
              output('parallel', plan['parallel'])
              output('matrix', json.dumps({'include': [{k: e[k] for k in ('id', 'suite', 'partition_id', 'worker_minutes', 'job_minutes')} for e in plan['entries']]}))
              rows = ['# CUDA registration sweep on 890P', f"Tested SHA: `{plan['sha']}`", f"Workflow SHA: `{plan['workflow_sha']}`", f"CUDA partition model: `{plan['partition_model_sha'] or 'static est_time fallback'}`", '| Suite | Enabled files | Partitions | Policy | Visible / reserved cards | Test budget (min) |', '| --- | ---: | ---: | --- | --- | ---: |']
              for suite in sorted({e['suite'] for e in plan['entries']}):
                  group = [e for e in plan['entries'] if e['suite'] == suite]
                  rows.append(f"| {suite} | {sum(len(e['files']) for e in group)} | {len(group)} | {group[0]['partition_policy']} | {group[0]['n_devices']} / 8 | {group[0]['test_budget_seconds'] // 60} |")
              rows += [f"Disabled registrations (not executed): {len(plan['disabled'])}", 'No PASS claims in plan-only mode. Base includes kernel unit/benchmark stages. Weekly, stress and workflow-native entries are excluded.', 'No cross-suite deduplication or retries. Model inventory is heuristic; missing models are never downloaded.']
              rows.append('Native CUDA sizing and LPT share one pinned model. Whole-suite entries use one task. PPU test budgets are at least 180 minutes and never smaller than the native CUDA run budget; budget expiry remains a failure.')
              summary('\n'.join(rows))

          def context():
              plan = read(BUNDLE / 'plan.json')
              stored = plan.pop('plan_hash')
              require(fingerprint(plan) == stored, 'Plan hash mismatch')
              plan['plan_hash'] = stored
              require(plan['run_id'] == os.environ['GITHUB_RUN_ID'] and plan['attempt'] == os.environ['GITHUB_RUN_ATTEMPT'], 'Stale run/attempt plan')
              return plan

          def entry_for(plan, name):
              matches = [e for e in plan['entries'] if e['id'] == name]
              require(len(matches) == 1, 'Unknown matrix entry')
              return matches[0]

          def cluster_check(destination):
              kubectl = shutil.which('kubectl') or ('/opt/bin/kubectl' if Path('/opt/bin/kubectl').is_file() else None)
              require(kubectl, 'Cannot inspect cluster occupancy: kubectl unavailable')
              def query(*args):
                  return json.loads(subprocess.check_output([kubectl, *args, '-o', 'json'], text=True, timeout=25))['items']
              nodes = query('get', 'nodes', '-l', 'board-type=ZW-M890P')
              pods = query('get', 'pods', '-A')
              occupied = set()
              pending = []
              for pod in pods:
                  if pod.get('status', {}).get('phase') in ('Succeeded', 'Failed'):
                      continue
                  spec = pod['spec']
                  def requests(container):
                      return int(container.get('resources', {}).get('requests', {}).get('alibabacloud.com/ppu', 0))
                  cards = max(sum(map(requests, spec.get('containers', []))), max(map(requests, spec.get('initContainers', [])), default=0))
                  if spec.get('nodeName'):
                      if cards:
                          occupied.add(spec['nodeName'])
                  elif cards and spec.get('nodeSelector', {}).get('board-type', 'ZW-M890P') == 'ZW-M890P':
                      pending.append(pod['metadata']['name'])
              eligible = [n['metadata']['name'] for n in nodes if not n.get('spec', {}).get('unschedulable') and int(n['status'].get('allocatable', {}).get('alibabacloud.com/ppu', 0)) >= 8 and any(c['type'] == 'Ready' and c['status'] == 'True' for c in n['status'].get('conditions', []))]
              free = [name for name in eligible if name not in occupied]
              save(destination, {'eligible_890p_nodes': eligible, 'free_890p_nodes': free, 'occupied_nodes': sorted(occupied), 'pending_ppu_pods': pending})
              require(eligible, 'No schedulable 890P board with eight devices')

          def worker_command(entry, directory):
              command = [sys.executable, 'test/run_suite.py', '--hw', 'cuda', '--suite', entry['suite'], '--pytest', '--junit-dir', str(directory / 'pytest'), '--continue-on-error', '--timeout-per-file', str(entry['timeout']), '--suite-timeout', str(entry['test_budget_seconds'])]
              if entry['partition_policy'] == 'cuda':
                  command += ['--auto-partition-id', str(entry['partition_id']), '--auto-partition-size', str(entry['partition_size']), '--partition-model-file', str(BUNDLE / 'partition-model.json')]
              return command

          def matches_selection(entry, selected, expected):
              if entry['partition_policy'] == 'cuda':
                  return selected == expected
              return Counter(selected) == Counter(expected)

          def worker(entry_id):
              plan = context()
              entry = entry_for(plan, entry_id)
              directory = Path(os.environ['PPU_EVIDENCE_DIR'])
              directory.mkdir(parents=True, exist_ok=True)
              state = {'id': entry_id, 'sha': plan['sha'], 'plan_hash': plan['plan_hash'], 'phase': 'setup', 'exit_code': None}
              started = time.monotonic()
              try:
                  sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
                  require(sha == plan['sha'], 'Worker checkout SHA mismatch')
                  require(re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ['PPU_BASE_IMAGE_DIGEST']), 'Missing immutable image digest')
                  require(os.environ['PPU_BASE_IMAGE_REF'].endswith('@' + os.environ['PPU_BASE_IMAGE_DIGEST']), 'Image reference/digest mismatch')
                  os.environ['CUDA_VISIBLE_DEVICES'] = ','.join(map(str, range(entry['n_devices'])))
                  os.environ['SGLANG_JIT_KERNEL_RUN_FULL_TESTS'] = '1' if entry['suite'].startswith('nightly-test-') else '0'
                  os.environ['SGLANG_ENABLE_ASYNC_ASSERT'] = 'false' if entry['suite'].startswith('base-a-test-') else 'true'
                  import torch
                  names = [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())]
                  require(len(names) == entry['n_devices'] and all('890' in name.upper() for name in names), 'Unexpected PPU model or visible device count: ' + repr(names))
                  save(directory / 'environment.json', {'sha': sha, 'workflow_sha': plan['workflow_sha'], 'run_id': plan['run_id'], 'attempt': plan['attempt'], 'plan_hash': plan['plan_hash'], 'devices': names, 'reserved_devices': 8, 'image': os.environ['PPU_BASE_IMAGE_REF'], 'digest': os.environ['PPU_BASE_IMAGE_DIGEST'], 'python': platform.python_version(), 'torch': torch.__version__})
                  inventory = read(BUNDLE / 'models.json')['suites'].get(entry['suite'], {})
                  cache = Path(os.environ['HF_HUB_CACHE'])
                  availability = [{'model': model, 'cache_directory_exists': (cache / ('models--' + model.replace('/', '--'))).is_dir()} for model in inventory.get('models', [])]
                  save(directory / 'model_availability.json', {'heuristic_only': True, 'models': availability, 'unresolved_files': inventory.get('unresolved_files', [])})
                  # Inventory only, never download. Directory presence does not prove complete weights; classify missing assets from test evidence.
                  with (directory / 'setup.log').open('w') as log:
                      subprocess.run(['bash', str(BUNDLE / 'install.sh')], check=True, stdout=log, stderr=subprocess.STDOUT)
                  state['setup_seconds'] = round(time.monotonic() - started, 3)
                  state['phase'] = 'tests'
                  save(directory / 'worker.json', state)
                  save(BUNDLE / 'partition-model.json', plan['partition_model'] or {})
                  command = worker_command(entry, directory)
                  with (directory / 'suite.log').open('w') as log:
                      state['exit_code'] = subprocess.call(command, stdout=log, stderr=subprocess.STDOUT)
                  state['phase'] = 'complete'
              except Exception as error:
                  state['error'] = str(error)
                  state['exit_code'] = 1
              finally:
                  state['elapsed'] = round(time.monotonic() - started, 3)
                  save(directory / 'worker.json', state)
              return state['exit_code']

          def classify(record, directory, runner):
              row = {'auto_status': 'NOT_EXECUTED', 'exit_code': None, 'wall_s': None, 'tests': 0, 'passed': 0, 'failed': 0, 'errors': 0, 'skipped': 0, 'skip_reasons': '', 'failure_signature': '', 'log_path': ''}
              if record is None:
                  return row
              row.update(exit_code=record.get('returncode'), wall_s=record.get('elapsed'))
              require(isinstance(row['wall_s'], (int, float)) and math.isfinite(row['wall_s']) and row['wall_s'] >= 0, 'Invalid elapsed time')
              for key in ('junit', 'log'):
                  require(isinstance(record.get(key), str) and Path(record[key]).name == record[key], 'Unsafe evidence path')
              log_path = directory / record['log']
              require(log_path.is_file(), 'Missing per-file log')
              text = log_path.read_text(errors='replace')
              row['log_path'] = 'evidence/pytest/' + record['log']
              error = str(record.get('error', ''))
              row['failure_signature'] = error[:200]
              junit = directory / record['junit']
              if junit.is_file():
                  # Read bounded UTF-8 input once; never pass DTDs, entities or alternative encodings to the parser.
                  with junit.open('rb') as stream:
                      data = stream.read(16 * 1024 * 1024 + 1)
                  require(len(data) <= 16 * 1024 * 1024, 'JUnit exceeds 16 MiB')
                  xml = data.decode('utf-8')
                  require('\x00' not in xml and not re.search(r'<!\s*(DOCTYPE|ENTITY)', xml, re.I), 'JUnit DTD/entities are forbidden')
                  root = ET.fromstring(xml)
                  require(root.tag in ('testsuite', 'testsuites'), 'Invalid JUnit root')
                  cases = list(root.iter('testcase'))
                  skipped = [c for c in cases if c.find('skipped') is not None]
                  failed = [c for c in cases if c.find('failure') is not None]
                  errors = [c for c in cases if c.find('error') is not None]
                  row.update(tests=len(cases), skipped=len(skipped), failed=len(failed), errors=len(errors), passed=sum(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases))
                  row['skip_reasons'] = ' | '.join(sorted({c.find('skipped').get('message', '') for c in skipped}))
                  for case in failed + errors:
                      problem = case.find('failure') if case.find('failure') is not None else case.find('error')
                      row['failure_signature'] = (problem.get('type', '') + ': ' + problem.get('message', ''))[:200]
                      break
                  if not cases:
                      status = 'ZERO_COLLECTED'
                  elif len(skipped) == len(cases):
                      status = 'ALL_SKIPPED'
                  elif failed or errors or list(root.iter('failure')) or list(root.iter('error')):
                      status = 'FAIL'
                  elif row['exit_code'] == 0:
                      status = 'PASS_WITH_SKIPS' if skipped else 'PASS'
                      if not skipped:
                          require(record.get('passed') is True and not error, 'Runner rejected apparently passing JUnit')
                  else:
                      status = 'FAIL'
              else:
                  status = 'CRASH'
              if 'timed out after' in error or 'budget exhausted' in error:
                  status = 'TIMEOUT'
              elif status not in ('PASS', 'PASS_WITH_SKIPS'):
                  signature = (row['failure_signature'] + '\n' + text).lower()
                  if any(s in signature for s in ('localentrynotfounderror', 'offlinemodeisenabled', 'cannot find the requested files in the disk cache', 'outgoing traffic has been disabled')):
                      status = 'INFRA_MODEL'
                  elif 'out of memory' in signature or 'outofmemoryerror' in signature:
                      status = 'OOM'
              row['auto_status'] = status
              return row

          def gather(entry_id, source, destination):
              plan = context()
              entry = entry_for(plan, entry_id)
              destination = Path(destination)
              destination.mkdir(parents=True, exist_ok=True)
              report = load('sweep_export', ROOT / 'scripts/ci/ppu/pr_report.py')
              result = {'id': entry_id, 'sha': plan['sha'], 'plan_hash': plan['plan_hash'], 'run_id': plan['run_id'], 'attempt': plan['attempt'], 'success': False, 'rows': []}
              issues = []
              records = {}
              try:
                  exported = report.export_evidence(source, destination / 'evidence')
                  state = read(exported / 'worker.json')
                  environment = read(exported / 'environment.json')
                  require(state['sha'] == environment['sha'] == plan['sha'] and state['plan_hash'] == environment['plan_hash'] == plan['plan_hash'], 'Worker provenance mismatch')
                  require(state['id'] == entry_id and environment['workflow_sha'] == plan['workflow_sha'], 'Worker entry/workflow mismatch')
                  require(environment['run_id'] == plan['run_id'] and environment['attempt'] == plan['attempt'], 'Worker run/attempt mismatch')
                  require(len(environment['devices']) == entry['n_devices'] and all('890' in name.upper() for name in environment['devices']) and environment['reserved_devices'] == 8, 'Worker hardware mismatch')
                  require(environment['digest'] == os.environ['PPU_BASE_IMAGE_DIGEST'] and environment['image'] == os.environ['PPU_BASE_IMAGE_REF'], 'Worker image mismatch')
                  result['image_digest'] = environment['digest']
                  data = read(exported / 'pytest/summary.json')
                  expected = ['/workspace/source/' + f for f in entry['files']]
                  require(matches_selection(entry, data['selected'], expected) and not data.get('allowed_skips'), 'Selected files or skip policy differs from plan')
                  require(len({r['file'] for r in data['files']}) == len(data['files']) and all(r['file'] in expected for r in data['files']), 'Unexpected or duplicate file results')
                  records = {r['file']: r for r in data['files']}
                  if state.get('phase') != 'complete' or state.get('exit_code') != 0 or data.get('success') is not True:
                      issues.append('Worker or pytest runner did not finish successfully')
              except Exception as error:
                  issues.append(report.runner.sanitize(str(error)))
              for filename in entry['files']:
                  try:
                      row = classify(records.get('/workspace/source/' + filename), destination / 'evidence/pytest', report.runner)
                  except Exception as error:
                      row = {'auto_status': 'INVALID_EVIDENCE', 'failure_signature': report.runner.sanitize(str(error))}
                      issues.append(row['failure_signature'])
                  row.update(file=filename, cuda_suite=entry['suite'], board='ZW-M890P', n_devices=entry['n_devices'], reserved_devices=8, entry_id=entry_id)
                  result['rows'].append(row)
              result['issues'] = issues
              result['worker_outcome'] = os.environ.get('WORKER_OUTCOME', 'unknown')
              result['success'] = not issues and result['worker_outcome'] == 'success' and all(r['auto_status'] == 'PASS' for r in result['rows'])
              save(destination / 'result.json', result)
              summary(f"{entry['suite']} / {entry_id}: {dict(Counter(r['auto_status'] for r in result['rows']))}")
              return 0 if result['success'] else 1

          def aggregate(source, destination):
              plan = context()
              destination = Path(destination)
              destination.mkdir(parents=True, exist_ok=True)
              paths = sorted(Path(source).rglob('result.json'))
              results = defaultdict(list)
              rows, issues = [], []
              for path in paths:
                  try:
                      record = read(path)
                      results[record['id']].append(record)
                  except (ValueError, KeyError, TypeError, OSError):
                      issues.append('Unreadable matrix result')
              if not set(results) <= {e['id'] for e in plan['entries']}:
                  issues.append('Unexpected matrix result')
              for entry in plan['entries']:
                  matches = results[entry['id']]
                  valid = len(matches) == 1
                  result = matches[0] if valid else {}
                  valid = valid and all(result.get(k) == plan[k] for k in ('sha', 'plan_hash', 'run_id', 'attempt'))
                  valid = valid and [(r.get('file'), r.get('cuda_suite')) for r in result.get('rows', [])] == [(f, entry['suite']) for f in entry['files']]
                  if not valid:
                      issues.append('Missing, duplicate or mismatched result: ' + entry['id'])
                      rows.extend({'file': f, 'cuda_suite': entry['suite'], 'board': 'ZW-M890P', 'n_devices': entry['n_devices'], 'reserved_devices': 8, 'entry_id': entry['id'], 'auto_status': 'NOT_EXECUTED'} for f in entry['files'])
                      continue
                  if result.get('success') is not True or result.get('issues') or result.get('worker_outcome') != 'success':
                      issues.append('Failed entry: ' + entry['id'])
                  if result.get('image_digest') != os.environ.get('PPU_BASE_IMAGE_DIGEST'):
                      issues.append('Image digest mismatch: ' + entry['id'])
                  for row in result['rows']:
                      rows.append({**row, 'image_digest': result.get('image_digest', ''), 'sha': plan['sha'], 'run_id': plan['run_id'], 'attempt': plan['attempt']})
              columns = sorted(set().union(*(r.keys() for r in rows)))
              with (destination / 'sweep_results.csv').open('w', newline='') as stream:
                  writer = csv.DictWriter(stream, fieldnames=columns)
                  writer.writeheader()
                  writer.writerows(rows)
              needs = json.loads(os.environ.get('NEEDS_JSON', '{}'))
              if any(needs.get(job, {}).get('result') != 'success' for job in ('sweep-prepare', 'sweep-image', 'sweep-execute')):
                  issues.append('Preparation or execution jobs did not succeed')
              save(destination / 'summary.json', {'sha': plan['sha'], 'counts': dict(Counter(r['auto_status'] for r in rows)), 'issues': issues, 'rows': rows, 'disabled': plan['disabled']})
              summary('# 890P sweep results\n' + json.dumps(dict(Counter(r['auto_status'] for r in rows))) + '\n' + '\n'.join(issues))
              return 0 if not issues and all(r['auto_status'] == 'PASS' for r in rows) else 1

