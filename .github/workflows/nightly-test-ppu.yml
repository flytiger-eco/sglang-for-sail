name: Nightly Test (PPU)

# DISPOSABLE PROBE BRANCH — DO NOT MERGE, DO NOT CHERRY-PICK.
#
# The real six-job nightly chain that normally lives in this file has been
# replaced by a single launcher job, on this branch only.
#
# Why: nightly-test-ppu-answer.yml is a brand-new workflow file. GitHub creates
# a workflow object only from files it sees on the default branch, and this
# fork's default branch (main) tracks upstream and carries neither PPU workflow.
# A direct dispatch therefore fails with "workflow nightly-test-ppu-answer.yml
# not found on the default branch". This file's path, in contrast, already has
# an indexed workflow object (id 333448550) from an earlier default branch, so
# it stays dispatchable at any ref. This branch borrows that object to reach the
# new workflow through its workflow_call trigger, which validates the new
# workflow end to end before PR #23 is merged.
#
# The tree under test is feat/ppu-answer-nightly, not this branch: only the
# launcher is read from here, while actions/checkout inside the called workflow
# checks out the ref passed below.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: 'feat/ppu-answer-nightly'
      mode:
        description: 'answer = run the Answer nightly; answer-k8s = run the Answer suites on the btv1.5 cluster; discover = read-only NAS inspection; inventory-k8s = read-only M890P device inspection; topology-k8s = read-only 4-node gang scheduling, DNS and rendezvous probe.'
        required: false
        type: choice
        default: answer
        options:
          - answer
          - answer-k8s
          - discover
          - inventory-k8s
          - topology-k8s

permissions:
  contents: read

jobs:
  answer:
    if: inputs.mode == 'answer'
    uses: ./.github/workflows/nightly-test-ppu-answer.yml
    with:
      ref: ${{ inputs.ref || 'feat/ppu-answer-nightly' }}

  # Same borrowing, for the K8s Answer workflow. `uses: ./` resolves the callee
  # from this branch's commit rather than from `ref`, so this branch must be
  # rebased onto the tip under test before dispatching; the callee's own
  # actions/checkout then reads the tree from `ref`. Since this branch is that
  # tip plus these launcher commits, the file executed here is byte-identical to
  # the one under review.
  answer-k8s:
    if: inputs.mode == 'answer-k8s'
    uses: ./.github/workflows/test-ppu-answer-k8s.yml
    with:
      ref: ${{ inputs.ref || 'feat/ppu-answer-nightly' }}
    secrets: inherit

  # Porting the Answer suites to the K8s btv1.5 cluster needs two facts that no
  # document can supply: the device identity string that will be recorded as
  # hardware.generation, and the per-device memory, which the board type does not
  # determine because M890P is planned internally in both a 96 GiB and a 144 GiB
  # configuration. This job reads them from a node that carries the label the
  # ported workflow will select, which also proves the label resolves at all.
  #
  # It requests one device, installs nothing, and never touches the weights, so
  # it costs a couple of minutes and cannot disturb a concurrent job. No
  # actions/checkout: the source tree is not needed, and skipping it keeps the
  # action from staging the whole repository to NAS.
  inventory-k8s:
    if: inputs.mode == 'inventory-k8s'
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 30
    steps:
      - name: Inspect one M890P device and the checkpoints it can reach
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          image: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=ZW-M890P"
          timeout_minutes: 20
          container_options: |
            privileged: true
            host_ipc: true
          command: |
            echo "===== identity"
            echo "node: ${NODE_NAME}"
            echo "pod:  $(hostname)"
            echo "===== device special files"
            ls -l /dev/alixpu* 2>&1 | head -20 || true
            echo "===== vendor tooling"
            if command -v ppu-smi >/dev/null 2>&1; then ppu-smi 2>&1 | head -40; else echo "ppu-smi absent"; fi
            echo "===== torch view of the device"
            python3 -c "
            import torch
            def report(tag):
                n = torch.cuda.device_count()
                print(tag, 'device_count =', n)
                for i in range(n):
                    p = torch.cuda.get_device_properties(i)
                    print(tag, i, 'name =', torch.cuda.get_device_name(i))
                    print(tag, i, 'total_memory_bytes =', p.total_memory)
                    print(tag, i, 'total_memory_gib =', round(p.total_memory / 1024**3, 3))
                    print(tag, i, 'properties =', p)
                return n
            if report('[plain torch]') == 0:
                try:
                    import acext
                    print('[acext] imported', getattr(acext, '__version__', 'no __version__'))
                    report('[after acext]')
                except Exception as exc:
                    print('[acext] import failed:', type(exc).__name__, exc)
            print('torch', torch.__version__)
            " 2>&1 || echo "torch inspection failed"
            echo "===== checkpoints this cluster exposes"
            echo "-- org directories holding a v3.5 or v3.8 tree --"
            ls -d /nas_aisw/datasets/checkpoints/LLM/*/v3.5 /nas_aisw/datasets/checkpoints/LLM/*/v3.8 2>/dev/null || true
            for p in /nas_aisw/datasets/checkpoints/LLM/*/v3.5/Qwen3.5-397B-A17B-W8A8-INT8 /nas_aisw/datasets/checkpoints/LLM/*/v3.8/Qwen3.8-27B; do
              if [ -d "$p" ]; then
                echo "present: $p ($(ls "$p"/*.safetensors 2>/dev/null | wc -l) shards)"
              else
                echo "absent:  $p"
              fi
            done
            echo "===== evidence return channel"
            probe="/mnt/wl_nas/devops/inventory-probe-$$"
            if mkdir -p "$probe" && echo ok > "$probe/write-test"; then
              echo "writable: $probe"
              rm -f "$probe/write-test"
              rmdir "$probe" || true
            else
              echo "NOT writable: $probe"
            fi
            echo "===== jit and hf caches"
            ls -d /nas_aisw/cache/sglang-jit-ci /nas_aisw/datasets/hf_cache/hub 2>&1 || true
            echo "===== inventory complete"

  # Porting a second model needs three facts that only exist on the runner: the
  # checkpoint path and its exact capitalisation, the architecture its
  # config.json declares, and its size. This job reads metadata only — no
  # container, no devices, no bulk read of the weights — so it costs seconds and
  # cannot disturb a concurrent nightly.
  discover:
    if: inputs.mode == 'discover'
    runs-on: ppu
    timeout-minutes: 10
    steps:
      - name: Inspect candidate checkpoints on the shared NAS
        shell: bash
        run: |
          root=/nas_aisw/datasets/checkpoints/LLM
          echo "===== org-level directories under ${root} ====="
          ls -1 "${root}" 2>&1 | head -40
          for org in Qwen qwen; do
            echo "===== ${root}/${org} ====="
            ls -1 "${root}/${org}" 2>&1 | head -40
          done
          for candidate in \
            "${root}/Qwen/v3.8/Qwen3.8-27B" \
            "${root}/qwen/v3.8/Qwen3.8-27B"; do
            echo "===== candidate ${candidate} ====="
            if [[ ! -d "${candidate}" ]]; then
              echo "absent"
              continue
            fi
            echo "-- config.json --"
            cat "${candidate}/config.json" 2>&1 | head -60
            echo "-- shard count --"
            ls -1 "${candidate}"/*.safetensors 2>/dev/null | wc -l
            echo "-- apparent size --"
            du -sh --apparent-size "${candidate}" 2>&1 | tail -1
            echo "-- chat template exposes enable_thinking? --"
            grep -c enable_thinking "${candidate}/tokenizer_config.json" 2>&1 | tail -1
            ls -1 "${candidate}" | head -25
          done

  # P0 for the 4-node Answer port. Four questions decide whether that port is
  # affordable and how it must be built, and none of them can be answered from a
  # document: does this cluster carry four schedulable ZW-M890P boards at once,
  # is the PodGroup CRD the action requires for gang scheduling installed, how
  # large is the 2.4T checkpoint (which sets the startup budget and decides
  # whether a page-cache warm is even meaningful), and does the MASTER_ADDR the
  # action injects resolve inside a pod that runs with hostNetwork -- it sets
  # spec.hostNetwork without setting dnsPolicy, and hostNetwork with the default
  # ClusterFirst falls back to the node's resolver, which would leave the
  # rendezvous address unresolvable.
  #
  # The metadata read comes first and asks for a single card, so its answers
  # arrive even if the four-board request cannot be scheduled. The gang step then
  # asks for exactly the real shape, 4 x 8, because that is the only way to prove
  # the capacity and the cross-node path; it holds the boards for minutes, not
  # hours, since it loads nothing.
  topology-k8s:
    if: inputs.mode == 'topology-k8s'
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 60
    env:
      PROBE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312
      PROBE_DIR_ON_RUNNER: /wl_nas/devops/topology-probe-${{ github.run_id }}-${{ github.run_attempt }}
      PROBE_DIR_IN_POD: /mnt/wl_nas/devops/topology-probe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: What this orchestration shell can see of the cluster
        continue-on-error: true
        shell: bash
        run: |
          if [ -x /opt/bin/kubectl ]; then
            export PATH="/opt/bin:${PATH}"
          fi
          echo "===== kubectl"
          command -v kubectl || echo "kubectl absent from this shell"
          echo "===== PodGroup CRD (the action refuses gang mode without it)"
          kubectl get crd podgroups.scheduling.x-k8s.io 2>&1 | head -3 || true
          kubectl get crd podgroups.scheduling.volcano.sh 2>&1 | head -3 || true
          echo "===== boards carrying the label the port selects"
          # The runner's ClusterRole grants pods, services, events, podgroups and
          # CRDs, but not nodes, so this is expected to be forbidden; it is
          # recorded rather than assumed, and the gang step below settles the
          # capacity question by actually asking for four boards.
          kubectl get nodes -l board-type=ZW-M890P -o wide 2>&1 | head -20 || true
          echo "===== pods this action already owns"
          kubectl get pods -l app.kubernetes.io/managed-by=ppu-distributed-action 2>&1 | head -20 || true

      - name: Read the 2.4T checkpoint metadata
        continue-on-error: true
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          image: ${{ env.PROBE_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=ZW-M890P"
          timeout_minutes: 25
          container_options: |
            privileged: true
            host_ipc: true
          command: |
            W=/nas_aisw/datasets/checkpoints/LLM/Qwen/v3.8/Qwen3.8-2.4T-A95B-FP8
            echo "===== path"
            if [ -d "$W" ]; then
              echo "present: $W"
            else
              echo "ABSENT: $W"
              ls -d /nas_aisw/datasets/checkpoints/LLM/*/v3.8 2>/dev/null || true
            fi
            echo "===== directory head"
            ls -1 "$W" 2>&1 | head -25
            echo "===== shard count"
            ls -1 "$W"/*.safetensors 2>/dev/null | wc -l
            echo "===== apparent size (one readdir, no bulk read)"
            ls -lL "$W" 2>/dev/null | awk '{s+=$5} END {printf "bytes=%.0f gib=%.1f\n", s, s/1073741824}'
            echo "===== config.json"
            python3 - "$W" <<'PY'
            import json, pathlib, sys
            config = json.loads((pathlib.Path(sys.argv[1]) / "config.json").read_text())
            for key in (
                "model_type",
                "architectures",
                "num_hidden_layers",
                "torch_dtype",
                "max_position_embeddings",
                "quantization_config",
            ):
                if key in config:
                    print(key, "=", config[key])
            PY
            echo "===== chat template exposes enable_thinking?"
            grep -c enable_thinking "$W/tokenizer_config.json" 2>&1 | tail -1
            echo "===== node resources (does a page-cache warm of this tree even fit)"
            free -g 2>&1 | head -3
            nproc
            df -h /nas_aisw 2>&1 | tail -1
            echo "===== metadata probe complete"
          extra_env: "PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}"

      - name: Gang-schedule four boards and test the rendezvous
        id: gang
        continue-on-error: true
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          image: ${{ env.PROBE_IMAGE }}
          nnodes: 4
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          # Short on purpose. Nothing is loaded, so a healthy run finishes in
          # minutes; if the four boards cannot be gang-scheduled the action warns
          # at five minutes and prints the FailedScheduling events, which is the
          # answer this probe wants either way.
          timeout_minutes: 20
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
          command: |
            dir=${{ env.PROBE_DIR_IN_POD }}
            mkdir -p "$dir"
            {
              echo "===== identity"
              echo "rank=${NODE_RANK} nnodes=${NNODES} nproc_per_node=${NPROC_PER_NODE}"
              echo "node=${NODE_NAME}"
              echo "pod=$(hostname)"
              echo "ip=$(hostname -i 2>/dev/null || echo unknown)"
              echo "master_addr=${MASTER_ADDR}"
              echo "master_port=${MASTER_PORT}"
              echo "===== resolver this pod was given"
              cat /etc/resolv.conf 2>&1
              echo "===== does the injected MASTER_ADDR resolve"
              if command -v getent >/dev/null 2>&1; then
                getent hosts "${MASTER_ADDR}" || echo "getent: no answer"
              else
                echo "getent absent from this image"
              fi
              # The verdict rests on python rather than on getent, so a missing
              # tool cannot be mistaken for a name that does not resolve.
              python3 -c "
            import os, socket
            name = os.environ['MASTER_ADDR']
            try:
                print('verdict: MASTER_ADDR resolves to', socket.gethostbyname(name))
            except OSError as error:
                print('verdict: MASTER_ADDR does NOT resolve:', type(error).__name__, error)
            " 2>&1 || echo "verdict: the resolution probe itself failed to run"
              echo "===== devices this rank holds"
              python3 -c "
            import torch
            count = torch.cuda.device_count()
            print('device_count', count)
            for index in range(count):
                properties = torch.cuda.get_device_properties(index)
                print(index, torch.cuda.get_device_name(index), properties.total_memory)
            " 2>&1 || echo "torch inspection failed"
              echo "===== rendezvous over the master port, addressed through the NAS"
              if [ "${NODE_RANK}" = "0" ]; then
                master_ip=$(hostname -i 2>/dev/null | awk '{print $1}')
                if [ -z "$master_ip" ]; then
                  master_ip=$(python3 -c "import socket; print(socket.gethostbyname(socket.gethostname()))" 2>/dev/null)
                fi
                echo "$master_ip" > "$dir/master-ip"
                echo "published master ip $master_ip"
                python3 - <<'PY'
            import os, socket

            expected = int(os.environ["NNODES"]) - 1
            server = socket.socket()
            server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            server.bind(("0.0.0.0", int(os.environ["MASTER_PORT"])))
            server.listen(8)
            server.settimeout(300)
            seen = []
            while len(seen) < expected:
                try:
                    connection, address = server.accept()
                except socket.timeout:
                    break
                seen.append((address[0], connection.recv(64).decode(errors="replace")))
                connection.close()
            for entry in seen:
                print("connected:", entry)
            print(
                "verdict:",
                "rendezvous complete"
                if len(seen) == expected
                else f"rendezvous incomplete {len(seen)}/{expected}",
            )
            PY
              else
                waited=0
                while [ ! -f "$dir/master-ip" ] && [ "$waited" -lt 180 ]; do
                  sleep 2
                  waited=$((waited + 2))
                done
                if [ -f "$dir/master-ip" ]; then
                  echo "read master ip $(cat "$dir/master-ip") after ${waited}s"
                  python3 - "$(cat "$dir/master-ip")" <<'PY'
            import os, socket, sys, time

            deadline = time.time() + 240
            while time.time() < deadline:
                try:
                    with socket.create_connection(
                        (sys.argv[1], int(os.environ["MASTER_PORT"])), timeout=10
                    ) as connection:
                        connection.sendall(
                            f"rank {os.environ['NODE_RANK']} on "
                            f"{os.environ.get('NODE_NAME', 'unknown')}".encode()
                        )
                    print("verdict: reached the master port")
                    break
                except OSError as error:
                    print("retrying:", type(error).__name__, error)
                    time.sleep(5)
            else:
                print("verdict: could not reach the master port")
            PY
                else
                  echo "verdict: the master ip never appeared on the NAS"
                fi
              fi
              echo "===== probe complete for rank ${NODE_RANK}"
            } 2>&1 | tee "$dir/rank-${NODE_RANK}.log"
          extra_env: "PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}"

      # The action streams worker-0 only, so ranks 1 to 3 are invisible in this
      # run's log until they are read back from the NAS. That is itself one of
      # the findings the 4-node port has to design around, and this step is the
      # cheap version of the answer.
      - name: Show every rank's probe log
        if: always()
        shell: bash
        run: |
          dir="${PROBE_DIR_ON_RUNNER}"
          if [ ! -d "${dir}" ]; then
            echo "::warning::no rank logs at ${dir}"
            exit 0
          fi
          for log in "${dir}"/rank-*.log; do
            [ -f "${log}" ] || continue
            echo "::group::$(basename "${log}")"
            cat "${log}"
            echo "::endgroup::"
          done
          echo "gang step outcome: ${{ steps.gang.outcome }}"
