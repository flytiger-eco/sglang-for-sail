          cat > .ppu-sweep/install.sh <<'SH'
          set -euo pipefail
          export GITHUB_WORKSPACE=/workspace/source
          export PYTHONPATH="/workspace/source/python:/workspace/source/test${PYTHONPATH:+:$PYTHONPATH}"
          export PPU_INSTALL_PROFILE=nightly
          export PIP_CACHE_DIR=/ppu-sweep-cache/pip
          export SGL_KERNEL_WHEEL_CACHE_DIR=/ppu-sweep-cache/aot/ZW-M890P
          bash scripts/ci/ppu/ppu_install_dependency.sh
          python3 -m pip install pytest==8.3.5 tabulate
          SH
          cat > .ppu-sweep/worker.sh <<'SH'
          set -euo pipefail
          cd /workspace/source
          export PYTHONPATH="$PWD/python:$PWD/test${PYTHONPATH:+:$PYTHONPATH}"
          export SGLANG_TEST_MAX_RETRY=0 SGLANG_IS_IN_CI=true
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0=/workspace/source
          export NCCL_NVLS_ENABLE=0 SGLANG_JIT_DEEPGEMM_FAST_WARMUP=true
          export GLOO_SOCKET_IFNAME=lo
          export PCCL_MNNVL_ENABLE=0 SGLANG_ENABLE_CUSTOM_ALL_REDUCE_V2_MULTINODE=0
          export TVM_FFI_CACHE_DIR=/tmp/ppu-sweep-tvm-ffi
          export SGLANG_JIT_CACHE_DIR=/tmp/ppu-sweep-jit
          export DG_JIT_CACHE_DIR=/tmp/ppu-sweep-deep-gemm
          export GITHUB_STEP_SUMMARY="$PPU_EVIDENCE_DIR/test-summary.log"
          python3 .ppu-sweep/sweep.py worker --entry "$SWEEP_ENTRY"
          SH
      - name: Verify sweep contracts without PPU allocation
        run: python3 .ppu-sweep/sweep.py selftest
      - name: Generate expected files and native CUDA partitions
        id: plan
        env:
          SCOPE: ${{ inputs.scope }}
          SUITES: ${{ inputs.suites }}
          FILE_TIMEOUT: ${{ inputs.timeout_per_file }}
          PARALLEL: ${{ inputs.max_parallel }}
          PLAN_ONLY: ${{ inputs.plan_only }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .ppu-sweep/sweep.py plan
      - name: Inventory model references without downloading
        run: python3 scripts/ci/list_stage_models.py --backend cuda --commit "$(git rev-parse HEAD)" --output .ppu-sweep/models.json
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-sweep-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ppu-sweep/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  sweep-image:
    needs: sweep-prepare
    if: ${{ !inputs.plan_only }}
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sweep-prepare.outputs.sha }}
          persist-credentials: false
      - name: Resolve one immutable image for the entire run
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Require immutable image identity
        id: image
        run: |
          [[ "$PPU_BASE_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PPU_BASE_IMAGE_REF" == *"@$PPU_BASE_IMAGE_DIGEST" ]]
          printf 'image=%s\ndigest=%s\n' "$PPU_BASE_IMAGE_REF" "$PPU_BASE_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  sweep-execute:
    needs: [sweep-prepare, sweep-image]
    if: ${{ !inputs.plan_only }}
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.sweep-prepare.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.sweep-prepare.outputs.matrix) }}
    name: sweep-890p-${{ matrix.id }}-${{ matrix.suite }}-p${{ matrix.partition_id }}
    env:
      SWEEP_ENTRY: ${{ matrix.id }}
      PPU_BASE_IMAGE_REF: ${{ needs.sweep-image.outputs.image }}
      PPU_BASE_IMAGE_DIGEST: ${{ needs.sweep-image.outputs.digest }}
      EVIDENCE_SOURCE: /wl_nas/pr-ci/sweep/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}
    steps:
      - name: Set runner-local result directory
        run: printf 'RESULT_DIR=%s/ppu-sweep/%s\n' "$RUNNER_TEMP" "$SWEEP_ENTRY" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sweep-prepare.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ppu-sweep-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ppu-sweep
      - name: Check schedulable capacity and prepare evidence
        run: |
          [[ "$PPU_BASE_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PPU_BASE_IMAGE_REF" == *"@$PPU_BASE_IMAGE_DIGEST" ]]
          mkdir -p "$RESULT_DIR"
          python3 .ppu-sweep/sweep.py cluster --destination "$RESULT_DIR/cluster.json"
          test ! -e "$EVIDENCE_SOURCE"
          mkdir -p "$EVIDENCE_SOURCE"
      - name: Execute CUDA registrations on an exclusive 890P board
        id: worker
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: 8
          node_selector: board-type=ZW-M890P
          namespace: ppu-sched
          job_suffix: sweep-${{ matrix.id }}
          command: bash /workspace/source/.ppu-sweep/worker.sh
          host_volumes: /wl_nas/pr-ci/sweep/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}:/ppu-evidence,/wl_nas/pr-ci/sweep-cache/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}:/ppu-sweep-cache
          extra_env: "SWEEP_ENTRY=${{ matrix.id }},PPU_EVIDENCE_DIR=/ppu-evidence,GITHUB_RUN_ID=${{ github.run_id }},GITHUB_RUN_ATTEMPT=${{ github.run_attempt }},PPU_BASE_IMAGE_REF=${{ env.PPU_BASE_IMAGE_REF }},PPU_BASE_IMAGE_DIGEST=${{ env.PPU_BASE_IMAGE_DIGEST }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_SUPPORTS_FP8=0,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PIP_INDEX_URL=https://pypi.org/simple"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: ${{ matrix.worker_minutes }}
          cleanup_policy: always
      - name: Export sanitized evidence and account for every selected file
        if: always()
        env:
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
          PPU_ARTIFACTORY_USER: ${{ secrets.PPU_ARTIFACTORY_USER }}
          PPU_ARTIFACTORY_PASSWORD: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
        run: python3 .ppu-sweep/sweep.py gather --entry "$SWEEP_ENTRY" --source "$EVIDENCE_SOURCE" --destination "$RESULT_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-sweep-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: error
          retention-days: 30

  sweep-summarize:
    needs: [sweep-prepare, sweep-image, sweep-execute]
    if: always() && !inputs.plan_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ppu-sweep-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ppu-sweep
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ppu-sweep-result-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: incoming
      - name: Reject missing or failed entries
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PPU_BASE_IMAGE_DIGEST: ${{ needs.sweep-image.outputs.digest }}
        run: python3 .ppu-sweep/sweep.py aggregate --source incoming --destination sweep-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-sweep-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: sweep-summary/
          if-no-files-found: error
          retention-days: 30
