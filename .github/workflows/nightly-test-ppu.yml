name: Nightly Test (PPU)

# DISPATCH SHIM -- PROBE BRANCH ONLY. Never merge this branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full 40-character source revision to test.'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: shim-ppu-pd-glm-fp8-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  pd-glm-fp8:
    uses: ./.github/workflows/test-ppu-pd-perf-k8s.yml
    with:
      ref: "${{ inputs.ref }}"
      pd_config: fp8-channelwise
    secrets: inherit
