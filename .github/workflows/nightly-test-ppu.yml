          NIGHTLY_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/nightly-results
        run: bash scripts/ci/ppu/collect_nightly_results.sh
      # Best effort: the verdict has already left this job over the annotations
