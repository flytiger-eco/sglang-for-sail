name: Nightly Test (PPU)

# DISPATCH SHIM -- PROBE BRANCH ONLY. Never merge this branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full 40-character source revision to test.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shim-ppu-perf16-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  perf16:
    uses: ./.github/workflows/test-ppu-perf-16-k8s.yml
    with:
      ref: "${{ inputs.ref }}"
    secrets: inherit
