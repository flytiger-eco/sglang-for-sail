name: Nightly Test (PPU)

# DISPATCH SHIM -- PROBE BRANCH ONLY.
#
# Replaces the nightly caller with a thin launcher for the 16-PPU (two-node)
# Answer line, which has workflow_dispatch of its own but is not indexed on the
# default branch and so cannot be dispatched directly. The workflow body is
# resolved from this branch's commit; the source under test is checked out from
# the `ref` input, which is the commit actually being validated.
#
# Never merge this branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: shim-ppu-answer16-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  answer16:
    uses: ./.github/workflows/test-ppu-answer-16-k8s.yml
    with:
      ref: "${{ inputs.ref }}"
    secrets: inherit
