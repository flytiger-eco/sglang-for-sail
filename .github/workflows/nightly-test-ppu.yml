name: Nightly Test (PPU)

# DISPATCH SHIM, PROBE BRANCH ONLY. Not part of any PR.
#
# GitHub indexes workflow_dispatch by file name on the default branch, so a
# workflow file that exists only on a version branch cannot be dispatched, no
# matter which ref is asked for. This branch therefore borrows an already indexed
# file name and, on this branch alone, replaces its body with a call to the
# workflow under review. `uses: ./` resolves the callee from the caller's commit,
# so the file that executes is byte-identical to the reviewed one, and `ref` is
# pinned to the reviewed commit so the source the pods check out is that commit
# and not this shim.
#
# The second mode is an observer: the four pods tee their own logs to the NAS as
# they go, and this runner group mounts the same NAS, so a CPU-only job can read
# a run that is still in flight. It claims no board.
#
# The nightly jobs this file carries on the version branches are deliberately
# absent here: keeping them would spend hours of PPU time to launch one entry.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = launch the four-node Answer entry; observe = read the NAS evidence of a run already in flight.'
        required: false
        type: choice
        default: run
        options:
          - run
          - observe
      ref:
        description: 'Reviewed commit to check out inside the pods.'
        required: false
        type: string
        default: '6bd8bce0dbb793c9ceed805eadaec466af2fa288'
      observe_run:
        description: 'For mode=observe: the run id whose evidence directory to read.'
        required: false
        type: string
        default: ''

concurrency:
  # The mode is part of the key on purpose: an observer must not queue behind the
  # multi-hour run it exists to look at.
  group: nightly-test-ppu-${{ inputs.mode }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  answer-32-k8s:
    if: inputs.mode == 'run'
    uses: ./.github/workflows/test-ppu-answer-32-k8s.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  observe:
    if: inputs.mode == 'observe'
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 10
    steps:
      - name: Read the four-node evidence directory
        shell: bash
        env:
          OBSERVED_RUN: ${{ inputs.observe_run }}
        run: |
          # The runner invokes this with `bash -e -o pipefail`, and a `set -u`
          # inside the script does not undo flags given on the command line. Every
          # log read below ends in `| head`, head closing the pipe leaves the
          # producer killed by SIGPIPE, pipefail surfaces that as 141 and -e then
          # kills the script -- which silently truncated earlier observations to
          # the first log's first 140 matches. Both flags are cleared here.
          set +e +o pipefail
          set -u
          base="/wl_nas/devops"
          if [ ! -d "${base}" ]; then
            echo "::error::${base} is not mounted on this runner"
            exit 1
          fi
          # Reading this costs no board, and the alternative is guessing. The
          # socket-transport run got past the collective and then died because
          # sglang's registry has no Qwen3_5MoeForCausalLM entry, so it fell
          # through to the transformers implementation, which wants fla. Whether
          # the fix is to register the class that already exists in qwen3_5.py
          # depends on what config the checkpoint actually carries -- that class
          # takes a text config, not the top-level one.
          ckpt="/nas_aisw/datasets/checkpoints/LLM/Qwen/v3.8/Qwen3.8-2.4T-A95B-FP8"
          echo "=== checkpoint ${ckpt} ==="
          if [ -d "${ckpt}" ]; then
            ls -la "${ckpt}" | head -40
            echo "--- config.json ---"
            python3 -c "import json,sys; d=json.load(open('${ckpt}/config.json')); d.pop('quantization_config',None); print(json.dumps(d, indent=2)[:6000])" 2>&1 | head -160
          else
            echo "not reachable from this runner"
            for probe in /nas_aisw /nas_aisw/datasets /wl_nas; do
              echo "-- ${probe} --"; ls -1 "${probe}" 2>&1 | head -10
            done
          fi
          echo "=== candidate run directories ==="
          ls -1 "${base}" | grep -F "${OBSERVED_RUN}" || echo "(none matching ${OBSERVED_RUN})"
          # The job id the evidence path is built from is whatever the runner
          # reports for github.job in a called workflow, so the depth is found
          # rather than assumed.
          ranks_dir=$(find "${base}" -maxdepth 5 -type d -path "*${OBSERVED_RUN}*" -name ranks | head -1)
          if [ -z "${ranks_dir}" ]; then
            echo "::warning::no ranks/ directory under ${base} for run ${OBSERVED_RUN}"
            find "${base}" -maxdepth 5 -type d -path "*${OBSERVED_RUN}*" | head -40
            exit 0
          fi
          results_dir=$(dirname "${ranks_dir}")
          echo "=== ${results_dir} ==="
          ls -la "${results_dir}" || true
          echo "=== ${ranks_dir} ==="
          ls -la "${ranks_dir}" || true
          if [ -f "${ranks_dir}/rendezvous" ]; then
            echo "=== rendezvous ==="
            cat "${ranks_dir}/rendezvous"
          fi
          for report in "${ranks_dir}"/node-*-net.txt; do
            [ -f "${report}" ] || continue
            echo "=== ${report} ==="
            cat "${report}"
          done
          # The four nodes do not see the same set of IB character devices, and
          # pccl numbers NET/IB/N by its own discovery order, so NET/IB/0 can name
          # a different physical bond on each node. Four bonds on four isolated
          # RoCE rails plus a mismatched pair gives exactly the failure under
          # investigation: the QP is built over the OOB socket and then never
          # carries a byte. These two sections are what decides that.
          echo "=== device to netdev mapping, per node, as pccl sees it ==="
          for log in "${ranks_dir}"/rank-*.log; do
            [ -f "${log}" ] || continue
            echo "--- ${log} ---"
            grep -oE 'NET/IB : Using .*' "${log}" | sort -u
          done
          echo "=== cross-node channel assignments, per node ==="
          for log in "${ranks_dir}"/rank-*.log; do
            [ -f "${log}" ] || continue
            echo "--- ${log} ---"
            grep -oE 'Channel [0-9]+/[0-9]+ : [0-9]+\[[0-9a-f]+\] -> [0-9]+\[[0-9a-f]+\] \[(send|receive)\] via NET/IB/[0-9]+' "${log}" | sort -u | head -40
          done
          for inventory in "${ranks_dir}"/rank-*-devices.json; do
            [ -f "${inventory}" ] || continue
            echo "=== ${inventory} ==="
            head -c 400 "${inventory}"
            echo
          done
          for log in "${ranks_dir}"/rank-*.log; do
            [ -f "${log}" ] || continue
            echo "=== ${log} ($(wc -l < "${log}") lines) : tail ==="
            tail -40 "${log}"
            echo "=== ${log} : transport and progress lines ==="
            grep -nE 'Connected all|NET/IB : Using|NCCL WARN|PCCL WARN|Traceback|rror|watchdog|Load(ing)? weight|init_torch_distributed|Init torch distributed ends|server is fired|The server is|Capture cuda graph|KV Cache' "${log}" | head -50
            # pccl's own monitor reports a stalled collective and dumps state
            # after it; that dump is what says which peer never answered.
            if grep -q 'RAS trigger' "${log}"; then
              echo "=== ${log} : from the first RAS dump ==="
              sed -n '/RAS trigger/,$p' "${log}" | head -120
            fi
          done
          for status in "${ranks_dir}"/rank-*.status; do
            [ -f "${status}" ] || continue
            echo "=== ${status} ==="
            cat "${status}"
          done
          echo "=== observation complete ==="
          exit 0
