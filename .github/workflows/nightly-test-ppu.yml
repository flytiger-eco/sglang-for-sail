name: PPU v0.5.18 Multi-node Validation Shim

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Validation target.'
        required: true
        type: choice
        options:
          - answer-32
          - perf-16
          - perf-32
          - pd-glm52-fp8-channelwise
          - pd-glm52-mxfp4-fp8
          - pd-qwen35-mxfp4-fp8
          - pd-qwen35-fp8-channelwise
          - accuracy
      ref:
        description: 'Full 40-character source revision tested inside the pods.'
        required: true
        type: string
      accuracy_mode:
        description: 'Accuracy mode; used only when target=accuracy.'
        required: false
        type: choice
        options:
          - smoke
          - full
          - both
        default: smoke
      accuracy_entries:
        description: "Accuracy entries; empty selects glm52-fp8chan-gsm8k."
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  answer-32:
    if: inputs.target == 'answer-32'
    uses: ./.github/workflows/test-ppu-answer-32-k8s.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  perf-16:
    if: inputs.target == 'perf-16'
    uses: ./.github/workflows/test-ppu-perf-16-k8s.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  perf-32:
    if: inputs.target == 'perf-32'
    uses: ./.github/workflows/test-ppu-perf-32-k8s.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  pd-glm52-fp8-channelwise:
    if: inputs.target == 'pd-glm52-fp8-channelwise'
    uses: ./.github/workflows/test-ppu-pd-perf-k8s.yml
    with:
      ref: ${{ inputs.ref }}
      pd_config: fp8-channelwise
    secrets: inherit

  pd-glm52-mxfp4-fp8:
    if: inputs.target == 'pd-glm52-mxfp4-fp8'
    uses: ./.github/workflows/test-ppu-pd-perf-k8s.yml
    with:
      ref: ${{ inputs.ref }}
      pd_config: mxfp4-fp8
    secrets: inherit

  pd-qwen35-mxfp4-fp8:
    if: inputs.target == 'pd-qwen35-mxfp4-fp8'
    uses: ./.github/workflows/test-ppu-qwen35-pd-perf-k8s.yml
    with:
      ref: ${{ inputs.ref }}
      pd_config: mxfp4-fp8
    secrets: inherit

  pd-qwen35-fp8-channelwise:
    if: inputs.target == 'pd-qwen35-fp8-channelwise'
    uses: ./.github/workflows/test-ppu-qwen35-pd-perf-k8s.yml
    with:
      ref: ${{ inputs.ref }}
      pd_config: fp8-channelwise
    secrets: inherit

  accuracy:
    if: inputs.target == 'accuracy'
    uses: ./.github/workflows/test-ppu-accuracy-k8s.yml
    with:
      ref: ${{ inputs.ref }}
      mode: ${{ inputs.accuracy_mode }}
      entries: ${{ inputs.accuracy_entries }}
    secrets: inherit
