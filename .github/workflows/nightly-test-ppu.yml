name: PPU real resource load validation (temporary)
run-name: PPU real test resource validation | ${{ github.run_id }}

# Temporary diagnostic workflow. Restore the CUDA sweep after the run.
on:
  workflow_dispatch:
    inputs:
      only_tests:
        description: 'Optional comma-separated test IDs for a focused rerun'
        required: false
        default: ''

concurrency:
  group: ppu-real-resource-validation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.17-py312-20261001
  PPU_SDK_VERSION: 2.2.0

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      sha: ${{ steps.dispatch.outputs.sha }}
    steps:
      - name: Validate dispatch before checkout
        id: dispatch
        run: |
          [[ "$GITHUB_REF" == refs/heads/feat/ppu-cuda-sweep-890p ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.dispatch.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build real-test validation bundle
        id: manifest
        env:
          ONLY_TESTS: ${{ inputs.only_tests }}
        run: |
          mkdir -p .ppu-resource/compat
          cat > .ppu-resource/build_manifest.py <<'PY'
          import ast
          import json
          import math
          import os
          import re
          from pathlib import Path

          ROOT = Path.cwd()


          def case(test_id, resources, target, devices=1, seconds=1200,
                   only_run='', in_ci='true', force_unskip='0'):
              return {
                  'id': test_id,
                  'resources': resources,
                  'target': target,
                  'devices': devices,
                  'seconds': seconds,
                  'worker_minutes': math.ceil(seconds / 60) + 30,
                  'job_minutes': math.ceil(seconds / 60) + 45,
                  'only_run': only_run,
                  'in_ci': in_ci,
                  'force_unskip': force_unskip,
              }


          TESTS = [
              case('qwen3-fp8', ['Qwen/Qwen3-30B-A3B-Instruct-2507-FP8'],
                   'test/registered/backends/test_flashinfer_nvfp4_online_moe_backend.py::TestFlashinferTrtllmGenMoeBackendNvFp4Online::test_gsm8k',
                   devices=4, force_unskip='1'),
              case('kimi-k3-dspark', ['RadixArk/Kimi-K3-DSpark'],
                   'test/registered/models_e2e/test_kimi_k3_b300.py::TestKimiK3B300LowLatency::test_gsm8k',
                   devices=8, seconds=1800),
              case('dsv4-dspark', ['deepseek-ai/DeepSeek-V4-Flash-DSpark'],
                   'test/registered/cp/test_deepseek_v4_flash_fp4_b200_cp.py::TestDSV4FlashFP4B200_CP_DSpark::test_capital_france',
                   devices=4, seconds=1800),
              case('kimi-k25-eagle3', ['lightseekorg/kimi-k2.5-eagle3-mla'],
                   'test/registered/gb300/test_kimi_k25_nvfp4_tp.py::TestKimiK25Nvfp4Tp::test_kimi_k25_nvfp4_tp',
                   devices=4, seconds=1800),
              case('dsv3-int8-mtp', [
                  'lmsys/sglang-ci-dsv3-channel-int8-test',
                  'lmsys/sglang-ci-dsv3-channel-int8-test-NextN',
              ], 'test/registered/mla/test_mla_int8_deepseek_v3.py::TestDeepseekV3MTPChannelInt8::test_gsm8k'),
              case('dsv3-base', ['lmsys/sglang-ci-dsv3-test'],
                   'test/registered/attention/test_deepseek_v3_deterministic.py::TestTritonDeterministic::test_single'),
              case('dsv3-mtp', ['lmsys/sglang-ci-dsv3-test-NextN'],
                   'test/registered/ep/test_deepep_small.py::TestMTPWithTBO::test_gsm8k',
                   devices=4, seconds=1800),
              case('llama2-7b', ['meta-llama/Llama-2-7b-hf'],
                   'test/registered/lora/test_lora_hf_sgl_logprob_diff.py::TestLoRAHFSGLLogprobDifference::test_lora_logprob_comparison_basic'),
              case('sep-base', ['shanearora/2025-sep-a-base-model'],
                   'test/registered/models_e2e/test_generation_models.py::TestGenerationModels::test_all_models',
                   only_run='shanearora/2025-sep-a-base-model', in_ci='false'),
              case('apertus', ['swiss-ai/Apertus-8B'],
                   'test/registered/models_e2e/test_generation_models.py::TestGenerationModels::test_all_models',
                   only_run='swiss-ai/Apertus-8B', in_ci='false'),
              case('inkling', ['thinkingmachines/Inkling'],
                   'test/registered/models_e2e/test_inkling.py::TestInklingServer::test_generation_basic'),
              case('inkling-nvfp4', ['thinkingmachines/Inkling-NVFP4'],
                   'test/registered/8-gpu-models/test_inkling_nvfp4_nightly.py::TestInklingNVFP4Nightly::test_inkling_nvfp4',
                   devices=8, seconds=1800, force_unskip='1'),
              case('inkling-small-nvfp4', ['thinkingmachines/Inkling-Small-NVFP4'],
                   'test/registered/models_e2e/test_inkling_small_nvfp4.py::TestInklingSmallNvfp4::test_gsm8k',
                   devices=4, seconds=1800),
              case('lora-nemotron', ['opherlie/lora-test-case-NVIDIA-Nemotron-3-Super-120B-A12B-BF16'],
                   'test/registered/lora/test_lora_nemotron_3_super_120b_a12b_logprob_diff.py::TestLoRANemotron3Super120B_A12B_LogprobDiff::test_lora_nemotron_3_super_120b_a12b_logprob_accuracy',
                   devices=4),
              case('lora-qwen35-35b', ['opherlie/lora-test-case-Qwen3.5-35B-A3B'],
                   'test/registered/lora/test_lora_qwen3_5_35b_a3b_logprob_diff.py::TestLoRAQwen3_5_35B_A3B_LogprobDiff::test_lora_qwen3_5_35b_a3b_logprob_accuracy',
                   devices=4),
              case('lora-qwen35-4b', ['opherlie/lora-test-case-Qwen3.5-4B'],
                   'test/registered/lora/test_lora_qwen3_5_4b_logprob_diff.py::TestLoRAQwen3_5_4BLogprobDiff::test_lora_qwen3_5_4b_logprob_accuracy'),
              case('lora-dsv31', ['yushengsu/lora-diff-DeepSeek-V3.1-Base'],
                   'test/registered/lora/test_lora_deepseek_v3_base_logprob_diff.py::TestLoRADeepSeekV3BaseLogprobDiff::test_lora_deepseek_v3_base_logprob_accuracy',
                   devices=8, seconds=1800),
              case('lora-kimi25', ['yushengsu/lora-diff-Kimi-K2.5'],
                   'test/registered/lora/test_lora_kimi_k25_logprob_diff.py::TestLoRAKimiK25LogprobDiff::test_lora_kimi_k25_logprob_accuracy',
                   devices=8, seconds=1800),
              case('lora-qwen3-30b', ['yushengsu/lora-diff-Qwen3-30B-A3B-Instruct-2507'],
                   'test/registered/lora/test_lora_qwen3_30b_a3b_instruct_2507_logprob_diff.py::TestLoRAQwen3_30B_A3B_Instruct_2507_LogprobDiff::test_lora_qwen3_30b_a3b_instruct_2507_logprob_accuracy',
                   devices=4),
              case('lora-qwen3-8b', ['yushengsu/lora-diff-Qwen3-8B'],
                   'test/registered/lora/test_lora_qwen3_8b_logprob_diff.py::TestLoRAQwen3_8BLogprobDiff::test_lora_qwen3_8b_logprob_accuracy'),
              case('lora-qwen3-vl', ['yushengsu/lora-diff-Qwen3-VL-30B-A3B-Instruct'],
                   'test/registered/lora/test_lora_qwen3_vl_30b_a3b_instruct_logprob_diff.py::TestLoRAQwen3VL_30B_A3B_Instruct_LogprobDiff::test_lora_qwen3_vl_30b_a3b_instruct_logprob_accuracy',
                   devices=4),
              case('lora-gpt-oss', ['yushengsu/lora-diff-gpt-oss-20b'],
                   'test/registered/lora/test_lora_gpt_oss_20b_logprob_diff.py::TestLoRAGptOss20BLogprobDiff::test_lora_gpt_oss_20b_logprob_accuracy',
                   devices=4),
              case('longbench', ['THUDM/LongBench-v2'],
                   'test/registered/radix_cache/unified_radix_tree/test_unified_radix_cache_kl_full.py::TestUnifiedFullRadixCache::test_multiturn_logprobs_match',
                   devices=2),
              case('mmmu', ['MMMU/MMMU'],
                   'test/registered/vlm/test_vlm_tp4.py::TestVLMTP4::test_mmmu_accuracy',
                   devices=4),
              case('hellaswag', ['HellaSwag validation'],
                   'test/registered/core/test_basic_sanity.py::TestBasicSanity::test_accuracy_floor'),
              case('sharegpt', ['anon8231489123/ShareGPT_Vicuna_unfiltered'],
                   'test/registered/rl/test_return_routed_experts.py::TestReturnRoutedExperts::test_return_routed_experts',
                   devices=4, seconds=1800),
          ]

          inherited = {
              ('TestKimiK3B300LowLatency', 'test_gsm8k'),
              ('TestDSV4FlashFP4B200_CP_DSpark', 'test_capital_france'),
              ('TestFlashinferTrtllmGenMoeBackendNvFp4Online', 'test_gsm8k'),
              ('TestTritonDeterministic', 'test_single'),
              ('TestUnifiedFullRadixCache', 'test_multiturn_logprobs_match'),
              ('TestBasicSanity', 'test_accuracy_floor'),
          }
          resources = []
          for item in TESTS:
              assert re.fullmatch(r'[a-z0-9-]+', item['id'])
              assert item['devices'] in (1, 2, 4, 8)
              assert 600 <= item['seconds'] <= 3600
              filename, class_name, method_name = item['target'].split('::')
              path = ROOT / filename
              assert path.is_file(), filename
              tree = ast.parse(path.read_text())
              cls = next((n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == class_name), None)
              assert cls is not None, item['target']
              methods = {n.name for n in cls.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
              assert method_name in methods or (class_name, method_name) in inherited, item['target']
              resources.extend(item['resources'])
          assert len(TESTS) == 26
          assert len(resources) == 27 and len(set(resources)) == 27
          selected = set(filter(None, os.environ.get('ONLY_TESTS', '').split(',')))
          if selected:
              TESTS = [item for item in TESTS if item['id'] in selected]
              assert {item['id'] for item in TESTS} == selected
          (ROOT / '.ppu-resource/manifest.json').write_text(json.dumps({'tests': TESTS}, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + json.dumps({'include': TESTS}, separators=(',', ':')) + '\n')
          PY
          cat > .ppu-resource/compat/sitecustomize.py <<'PY'
          import json
          import os
          import sys
          import time

          import datasets
          import huggingface_hub
          import requests


          def resource_event(kind, phase, **fields):
              destination = os.environ.get('PPU_EVIDENCE_DIR')
              if not destination:
                  return
              record = {'time': time.time(), 'pid': os.getpid(), 'kind': kind, 'phase': phase, **fields}
              try:
                  os.makedirs(destination, exist_ok=True)
                  line = (json.dumps(record, default=str) + '\n').encode()
                  fd = os.open(os.path.join(destination, 'events.jsonl'), os.O_WRONLY | os.O_CREAT | os.O_APPEND, 0o644)
                  try:
                      os.write(fd, line)
                  finally:
                      os.close(fd)
              except OSError:
                  pass


          _DATASET_DIRS = {
              'THUDM/LongBench-v2': '/nas_aisw/datasets/datasets/LLM/ZhipuAI/v2/LongBench-v2',
              'MMMU/MMMU': '/nas_aisw/datasets/datasets/LLM/Comprehensive_Examination/v1/MMMU',
              'lmms-lab/MMMU': '/nas_aisw/datasets/datasets/LLM/Comprehensive_Examination/v1/MMMU',
          }
          _SHAREGPT_REPO = 'anon8231489123/ShareGPT_Vicuna_unfiltered'
          _SHAREGPT_FILENAME = 'ShareGPT_V3_unfiltered_cleaned_split.json'
          _SHAREGPT_PATH = '/nas_aisw/datasets/datasets/LLM/anon8231489123/v1.0/ShareGPT_Vicuna_unfiltered/ShareGPT_V3_unfiltered_cleaned_split.json'

          _original_load_dataset = datasets.load_dataset
          _original_snapshot_download = huggingface_hub.snapshot_download
          _original_hf_hub_download = huggingface_hub.hf_hub_download
          _original_requests_get = requests.get


          def _load_dataset(path, *args, **kwargs):
              source = str(path)
              redirected = _DATASET_DIRS.get(source)
              actual = redirected or path
              fields = {'source': source, 'actual': str(actual), 'name': kwargs.get('name') or (args[0] if args else None), 'split': kwargs.get('split'), 'streaming': kwargs.get('streaming')}
              resource_event('dataset', 'start', **fields)
              try:
                  result = _original_load_dataset(actual, *args, **kwargs)
              except Exception as error:
                  resource_event('dataset', 'error', error=f'{type(error).__name__}: {error}'[:2000], **fields)
                  raise
              resource_event('dataset', 'success', **fields)
              return result


          def _snapshot_download(repo_id, *args, **kwargs):
              fields = {'repo_id': repo_id, 'repo_type': kwargs.get('repo_type', 'model'), 'revision': kwargs.get('revision')}
              resource_event('snapshot', 'start', **fields)
              try:
                  result = _original_snapshot_download(repo_id, *args, **kwargs)
              except Exception as error:
                  resource_event('snapshot', 'error', error=f'{type(error).__name__}: {error}'[:2000], **fields)
                  raise
              resource_event('snapshot', 'success', path=str(result), **fields)
              return result


          def _hf_hub_download(repo_id, filename, *args, **kwargs):
              if repo_id == _SHAREGPT_REPO and filename == _SHAREGPT_FILENAME:
                  resource_event('dataset_file', 'start', repo_id=repo_id, filename=filename, actual=_SHAREGPT_PATH)
                  if not os.path.isfile(_SHAREGPT_PATH):
                      resource_event('dataset_file', 'error', repo_id=repo_id, filename=filename, error='NAS file not found')
                      raise FileNotFoundError(_SHAREGPT_PATH)
                  resource_event('dataset_file', 'success', repo_id=repo_id, filename=filename, actual=_SHAREGPT_PATH)
                  return _SHAREGPT_PATH
              fields = {'repo_id': repo_id, 'filename': filename, 'repo_type': kwargs.get('repo_type', 'model')}
              resource_event('hub_file', 'start', **fields)
              try:
                  result = _original_hf_hub_download(repo_id, filename, *args, **kwargs)
              except Exception as error:
                  resource_event('hub_file', 'error', error=f'{type(error).__name__}: {error}'[:2000], **fields)
                  raise
              resource_event('hub_file', 'success', path=str(result), **fields)
              return result


          def _requests_get(url, *args, **kwargs):
              if 'hellaswag' not in str(url).lower():
                  return _original_requests_get(url, *args, **kwargs)
              resource_event('hellaswag_http', 'start', url=str(url))
              try:
                  response = _original_requests_get(url, *args, **kwargs)
                  resource_event('hellaswag_http', 'response', url=str(url), status=response.status_code)
                  response.raise_for_status()
                  return response
              except Exception as error:
                  resource_event('hellaswag_http', 'error', url=str(url), error=f'{type(error).__name__}: {error}'[:2000])
                  raise


          datasets.load_dataset = _load_dataset
          huggingface_hub.snapshot_download = _snapshot_download
          huggingface_hub.hf_hub_download = _hf_hub_download
          requests.get = _requests_get
          resource_event(
              'interpreter', 'sitecustomize_loaded',
              executable=sys.executable,
              sitecustomize=__file__,
              pythonpath=sys.path,
          )
          PY
          cat > .ppu-resource/compat/resource_pytest_plugin.py <<'PY'
          import os
          import pytest
          from sitecustomize import resource_event


          def _is_target(nodeid):
              target = os.environ.get('TEST_TARGET', '')
              return nodeid == target or target == f'test/{nodeid}'


          def _clear_skip(item):
              if os.environ.get('FORCE_UNSKIP') != '1' or not _is_target(item.nodeid):
                  return
              item.own_markers[:] = [
                  mark for mark in item.own_markers
                  if mark.name not in ('skip', 'skipif')
              ]
              method = getattr(item, 'obj', None)
              for obj in (getattr(item, 'cls', None), getattr(method, '__func__', method)):
                  if obj is None:
                      continue
                  try:
                      obj.__unittest_skip__ = False
                      obj.__unittest_skip_why__ = ''
                  except (AttributeError, TypeError):
                      pass


          def pytest_configure(config):
              resource_event(
                  'plugin', 'configure',
                  plugin=__file__,
                  target=os.environ.get('TEST_TARGET'),
                  force_unskip=os.environ.get('FORCE_UNSKIP'),
              )


          @pytest.hookimpl(tryfirst=True)
          def pytest_collection_modifyitems(items):
              for item in items:
                  _clear_skip(item)
                  if _is_target(item.nodeid):
                      resource_event(
                          'pytest', 'collected', nodeid=item.nodeid,
                          markers=[mark.name for mark in item.own_markers],
                      )


          @pytest.hookimpl(tryfirst=True)
          def pytest_runtest_setup(item):
              _clear_skip(item)
              if _is_target(item.nodeid):
                  resource_event('pytest', 'setup', nodeid=item.nodeid)


          def pytest_runtest_call(item):
              if _is_target(item.nodeid):
                  resource_event('pytest', 'call', nodeid=item.nodeid)


          def pytest_runtest_logreport(report):
              if _is_target(report.nodeid):
                  resource_event('pytest_report', report.when, nodeid=report.nodeid, outcome=report.outcome)
          PY
          cat > .ppu-resource/install.sh <<'SH'
          set -euo pipefail
          export GITHUB_WORKSPACE=/workspace/source
          export PYTHONPATH="/workspace/source/python:/workspace/source/test${PYTHONPATH:+:$PYTHONPATH}"
          export PPU_INSTALL_PROFILE=nightly
          export PIP_CACHE_DIR=/ppu-resource-cache/pip
          export SGL_KERNEL_WHEEL_CACHE_DIR=/ppu-resource-cache/aot/ZW-M890P
          bash scripts/ci/ppu/ppu_install_dependency.sh
          python3 -m pip install pytest==8.3.5 tabulate
          SH
          cat > .ppu-resource/worker.sh <<'SH'
          set -euo pipefail
          cd /workspace/source
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0=/workspace/source
          export PYTHONPATH="$PWD/.ppu-resource/compat:$PWD/python:$PWD/test${PYTHONPATH:+:$PYTHONPATH}"
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1
          export HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub
          export SGLANG_TEST_MAX_RETRY=0 SGLANG_IS_IN_CI="${TEST_IN_CI:-true}"
          export NCCL_NVLS_ENABLE=0 SGLANG_JIT_DEEPGEMM_FAST_WARMUP=true
          export GLOO_SOCKET_IFNAME=lo
          export PCCL_MNNVL_ENABLE=0 SGLANG_ENABLE_CUSTOM_ALL_REDUCE_V2_MULTINODE=0
          export TVM_FFI_CACHE_DIR=/tmp/ppu-resource-tvm-ffi
          export SGLANG_JIT_CACHE_DIR=/tmp/ppu-resource-jit
          export DG_JIT_CACHE_DIR=/tmp/ppu-resource-deep-gemm
          export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1
          mkdir -p "$PPU_EVIDENCE_DIR"
          bash .ppu-resource/install.sh
          echo "REAL_TEST_BEGIN id=$TEST_ID target=$TEST_TARGET only_run=${ONLY_RUN:-} force_unskip=${FORCE_UNSKIP:-0}"
          set +e
          timeout --signal=TERM --kill-after=30s "${TEST_SECONDS}s" \
            python3 -m pytest -p resource_pytest_plugin -vv -s --maxfail=1 --tb=long \
            --junitxml="$PPU_EVIDENCE_DIR/junit.xml" "$TEST_TARGET" \
            > >(tee "$PPU_EVIDENCE_DIR/test.log") 2>&1
          rc=${PIPESTATUS[0]}
          set -e
          TEST_RC="$rc" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          result = {'id': os.environ['TEST_ID'], 'target': os.environ['TEST_TARGET'], 'returncode': int(os.environ['TEST_RC'])}
          Path(os.environ['PPU_EVIDENCE_DIR'], 'test-result.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          echo "REAL_TEST_END id=$TEST_ID returncode=$rc"
          exit 0
          SH
          cat > .ppu-resource/summarize.py <<'PY'
          import argparse
          import json
          import shutil
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          BUNDLE = Path(__file__).resolve().parent


          def manifest():
              return json.loads((BUNDLE / 'manifest.json').read_text())['tests']


          def write(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, indent=2) + '\n')


          def collect(args):
              source = Path(args.source)
              destination = Path(args.destination)
              destination.mkdir(parents=True, exist_ok=True)
              for name in ('test.log', 'junit.xml', 'events.jsonl', 'reports.jsonl', 'test-result.json'):
                  if (source / name).is_file():
                      shutil.copy2(source / name, destination / name)
              result_path = destination / 'test-result.json'
              test_result = json.loads(result_path.read_text()) if result_path.is_file() else {}
              rc = test_result.get('returncode')
              events = []
              if (destination / 'events.jsonl').is_file():
                  for line in (destination / 'events.jsonl').read_text().splitlines():
                      try:
                          events.append(json.loads(line))
                      except json.JSONDecodeError:
                          pass
              junit_path = destination / 'junit.xml'
              junit = None
              if junit_path.is_file():
                  root = ET.parse(junit_path).getroot()
                  suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
                  junit = {
                      key: sum(int(suite.get(key, '0')) for suite in suites)
                      for key in ('tests', 'failures', 'errors', 'skipped')
                  }
              target = test_result.get('target', '')
              passed_call = any(
                  event.get('kind') == 'pytest_report'
                  and event.get('phase') == 'call'
                  and event.get('outcome') == 'passed'
                  and (event.get('nodeid') == target or target == f"test/{event.get('nodeid')}")
                  for event in events
              )
              plugin_loaded = any(
                  event.get('kind') == 'plugin' and event.get('phase') == 'configure'
                  for event in events
              )
              if rc is None:
                  status = 'NOT_EXECUTED'
              elif rc in (124, 137):
                  status = 'TIMEOUT'
              elif rc != 0:
                  status = 'FAIL'
              elif junit is None or junit['tests'] != 1:
                  status = 'INVALID_EVIDENCE'
              elif junit['skipped']:
                  status = 'ALL_SKIPPED'
              elif junit['failures'] or junit['errors']:
                  status = 'FAIL'
              elif not plugin_loaded or not passed_call:
                  status = 'INVALID_EVIDENCE'
              else:
                  status = 'PASS'
              result = {
                  'id': args.test_id,
                  'status': status,
                  'worker_outcome': args.worker_outcome,
                  'returncode': rc,
                  'junit': junit,
                  'plugin_loaded': plugin_loaded,
                  'passed_call': passed_call,
                  'events': events,
              }
              write(destination / 'result.json', result)


          def aggregate(args):
              source = Path(args.source)
              destination = Path(args.destination)
