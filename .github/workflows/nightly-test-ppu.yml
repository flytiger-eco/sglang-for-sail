          extra_env: "NIGHTLY_SUITE=nightly-1-ppu,NIGHTLY_DEVICE_COUNT=1,NIGHTLY_DEVICE_OFFSET=1,NIGHTLY_PARTITION_ID=1,NIGHTLY_PARTITION_SIZE=2,NIGHTLY_MARLIN_PRELOAD=true,NIGHTLY_WARM_MODELS=/nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct|/nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-30B-A3B|/nas_aisw/datasets/checkpoints/LLM/deepseek/v2/DeepSeek-V2-Lite-Chat|/nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-0.6B,NIGHTLY_RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/nightly-results,NIGHTLY_TIMEOUT_PER_FILE=1200,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 135
          cleanup_policy: always
      - name: Collect nightly results
        if: always()
        shell: bash
        env:
