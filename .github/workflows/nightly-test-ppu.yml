name: Nightly Test (PPU)

# DISPATCH SHIM, PROBE BRANCH ONLY. Not part of any PR.
#
# GitHub indexes workflow_dispatch by file name on the default branch, so a
# workflow file that exists only on a version branch cannot be dispatched, no
# matter which ref is asked for. This branch therefore borrows an already indexed
# file name and, on this branch alone, replaces its body with a single call to the
# workflow under review. `uses: ./` resolves the callee from the caller's commit,
# so the file that executes is byte-identical to the reviewed one, and `ref` is
# pinned to the reviewed commit so the source the pods check out is that commit
# and not this shim.
#
# The nightly jobs this file carries on the version branches are deliberately
# absent here: keeping them would spend hours of PPU time to launch one entry.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Reviewed commit to check out inside the pods.'
        required: false
        type: string
        default: '6bd8bce0dbb793c9ceed805eadaec466af2fa288'

concurrency:
  group: nightly-test-ppu-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  answer-32-k8s:
    uses: ./.github/workflows/test-ppu-answer-32-k8s.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit
