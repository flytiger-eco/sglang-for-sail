                  def test_scope_coverage_and_partitions(self):
                      tree = ast.parse((ROOT / 'test/run_suite.py').read_text())
                      cuda_suites = {}
                      for node in tree.body:
                          if isinstance(node, ast.Assign) and isinstance(node.targets[0], ast.Name) and node.targets[0].id in ('PER_COMMIT_SUITES', 'NIGHTLY_SUITES'):
                              for key, value in zip(node.value.keys, node.value.values):
                                  if isinstance(key, ast.Attribute) and key.attr == 'CUDA':
                                      cuda_suites[node.targets[0].id] = ast.literal_eval(value)
                      expected_suites = {'base': {s for s in cuda_suites['PER_COMMIT_SUITES'] if s.startswith('base-')}, 'extra': {s for s in cuda_suites['PER_COMMIT_SUITES'] if s.startswith('extra-')}, 'nightly': set(cuda_suites['NIGHTLY_SUITES'])}
                      expected_suites['all'] = set().union(*expected_suites.values())
                      partition_counts = {}
                      for scope, suites in expected_suites.items():
                          if scope == 'all' and sum(partition_counts.values()) > 256:
                              with self.assertRaisesRegex(ValueError, 'Matrix exceeds 256'):
                                  make_plan(scope, '', 0, 1, hardware)
                              print(f"all: {sum(partition_counts.values())} partitions exceeds GitHub's 256-entry limit; dispatch base/extra/nightly separately")
                              continue
                          plan = make_plan(scope, '', 0, 1, hardware)
                          partition_counts[scope] = len(plan['entries'])
                          expected = [r for r in registrations if r.backend == module.HWBackend.CUDA and r.effective_suite in suites and not r.nightly]
                          actual = [(e['suite'], f) for e in plan['entries'] for f in e['files']]
                          self.assertEqual(Counter(actual), Counter((r.effective_suite, str(Path(r.filename).relative_to(ROOT))) for r in expected if r.disabled is None))
                          self.assertEqual(len(plan['disabled']), sum(r.disabled is not None for r in expected))
                          self.assertEqual({e['suite'] for e in plan['entries']}, {r.effective_suite for r in expected if r.disabled is None})
                          for e in plan['entries']:
                              self.assertTrue(e['files'])
                              self.assertGreaterEqual(e['test_budget_seconds'], hardware['test_budget_seconds'])
                              self.assertLessEqual(e['test_budget_seconds'], 21600)
                              self.assertGreaterEqual(e['worker_minutes'] * 60 - e['test_budget_seconds'], 7200)
                              self.assertEqual(e['job_minutes'] - e['worker_minutes'], 30)
                              selected = [r for r in expected if r.disabled is None and r.effective_suite == e['suite']]
                              part = module.auto_partition(selected, e['partition_id'], e['partition_size']) if e['partition_policy'] == 'cuda' else selected
                              self.assertEqual(e['files'], [str(Path(r.filename).relative_to(ROOT)) for r in part])
                          print(f"{scope}: {len({e['suite'] for e in plan['entries']})} suites, {len(actual)} enabled registrations, {len(plan['disabled'])} disabled, {len(plan['entries'])} partitions")

