name: Nightly Test (PPU)

# DISPATCH SHIM -- PROBE BRANCH ONLY. This filename is registered on the default
# branch (workflow ID 333448550), which is the only reason workflow_dispatch can
# reach it; the Answer line has no registered entry of its own. The reusable
# workflow body below resolves from THIS branch's commit, not the default
# branch, so it launches the ported Answer line. The original nightly board jobs
# were removed on purpose: a plain dispatch of the real file would ignite hours
# of unrelated PPU work. Never merge this branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit/branch/tag checked out inside the PPU worker.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: shim-ppu-answer-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  answer:
    uses: ./.github/workflows/nightly-test-ppu-answer.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit
