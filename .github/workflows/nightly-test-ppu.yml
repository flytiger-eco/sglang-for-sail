name: Nightly Test (PPU K8s)

# This nightly starts at the build, not here. release-docker-ppu-nightly.yml pushes
# the image to ghcr at 00:00 Beijing time; this file waits for that to succeed and
# then tests the very same artifact.
#
# The old '0 16 * * *' schedule is gone: it started at the same moment as the
# build, knew nothing about the outcome, so "which image was actually tested" had
# no answer. workflow_run now carries that link, and the build publishes the
# digest of what it pushed: prepare consumes that value rather than reconstructing
# a tag and resolving it, because a tag names the *latest* build, not the one that
# triggered this run.
#
# A non-empty test_image switches to "test the artifact": the pod runs on that
# image (it already ships sglang and sgl-kernel, so the source install is skipped)
# after image_healthcheck.sh has looked at it. Empty keeps the previous behaviour
# exactly: fixed PPU base image plus a source install.
#
# In that mode the setup scripts come from this file's own revision, in a
# ci-harness checkout beside the tested sources: an image built before the
# harness knew about image mode must not be prepared by the installer that
# revision shipped. The cases still come from the tested commit.
#
# Only the scheduled build is auto-linked. A manually dispatched build may carry
# push=false and then finish with nothing to pull. To test a manual rebuild,
# dispatch this file and point test_image at that build's tag.
on:
  workflow_run:
    workflows: ["Release Docker Images Nightly (PPU)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
      test_image:
        description: 'Image under test (tag or image@sha256:...). Empty keeps the fixed PPU base image and installs sglang from source.'
        required: false
        type: string
        default: ''
# No workflow_call: nothing calls this file, and under a call the github context
# is the caller's, so both the harness checkout and the build-event gate would be
# looking at the caller's repository and the caller's build. Dispatch is the way
# in; a real reusable entry point has to take its own revision explicitly.

# A rejected build completion must not cancel a nightly test that is already
# running. Concurrency is evaluated before prepare's `if`, so a failed build, a
# push=false debug build or a build off another branch would otherwise join the
# default-branch group and preempt the run it is about to skip. Those events get a
# group of their own and forfeit cancellation; everything else keeps the stable
# group, so a newer nightly still replaces an older one.
concurrency:
  group: >-
    nightly-test-ppu-${{ inputs.ref || github.ref }}-${{
    (github.event_name != 'workflow_run' ||
    (github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.event == 'schedule' &&
    github.event.workflow_run.head_branch == github.event.repository.default_branch))
    && 'active' || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name != 'workflow_run' ||
    (github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.event == 'schedule' &&
    github.event.workflow_run.head_branch == github.event.repository.default_branch) }}

permissions:
  contents: read
  # prepare reads the build run's artifact to learn which digest that attempt
  # pushed; artifacts of another run are only readable with this scope.
  actions: read

defaults:
  run:
    shell: bash

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.17-py312-20261001
  PPU_SDK_VERSION: 2.2.0

jobs:
  # workflow_run fires on every completed build: the failed ones, and the
  # push-triggered runs the build file keeps for debugging. Only the scheduled
  # build on the default branch is what this test line covers.
  #
  # The run's own conclusion cannot answer whether *this* image was produced: the
  # build file also carries the branch-tag jobs, and either of them failing turns
  # the whole run red. Ask the job that publishes the digest instead.
  gate:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.job.outputs.ok }}
    steps:
      - name: Resolve the producing job's conclusion
        id: job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          conclusion=''
          # The latest producer run at or before this event's attempt, not this
          # attempt's own: "Re-run failed jobs" starts an attempt that contains
          # only the jobs that failed, so an exact-attempt lookup finds no build
          # at all. The same bound the artifact selection uses keeps the two in
          # step -- an attempt that succeeds without running the build again is
          # reuse of the earlier digest, not a reason to skip the night.
          for _ in $(seq 1 6); do
            conclusion="$(gh api --paginate --slurp "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs?filter=all&per_page=100" \
              --jq '[.[].jobs[] | select(.name == "build" and .run_attempt <= ${{ github.event.workflow_run.run_attempt }})] | if length == 0 then "" else (max_by(.run_attempt).conclusion // "") end')" || conclusion=''
            [ -n "${conclusion}" ] && break
            sleep 10
          done
          # Unknown is not a reason to skip: a skipped run reads as green to the
          # issue tracker, and a night would pass without anyone noticing.
          if [ -z "${conclusion}" ]; then
            echo '::error::the nightly image job is not readable in this run attempt; refusing to guess whether an image was published'
            exit 1
          fi
          echo "the job that publishes the nightly image: ${conclusion}"
          if [ "${conclusion}" = success ]; then
            printf 'ok=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'ok=false\n' >> "$GITHUB_OUTPUT"
            echo "no image was published by this build run; not testing a partial run"
          fi

  prepare:
    needs: [gate]
    # Under workflow_run the gate above has already settled the event, the branch
    # and the producing job; a dispatch is its own decision. !cancelled() because
    # a skipped need would otherwise apply its implicit success() and skip this
    # job too, which is exactly the dispatch case -- gate never runs there.
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_run' || needs.gate.outputs.ok == 'true')
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      test_image: ${{ steps.image.outputs.tag }}
      test_image_ref: ${{ steps.digest.outputs.ref }}
      test_image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      # The registry lookup lives in scripts/ci/ppu/, so prepare needs the tree.
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate the requested source ref
        id: shape
        env:
          # There are no inputs under workflow_run, and github.sha is the head of
          # the default branch rather than the commit that was built and is under
          # test. Only head_sha answers that.
          REQUESTED_REF: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            :
          elif [[ "$REQUESTED_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] &&
            git check-ref-format --allow-onelevel "$REQUESTED_REF" >/dev/null; then
            :
          else
            echo 'ref must be a full commit SHA or a valid branch/tag ref' >&2
            exit 1
          fi
          printf 'requested=%s\n' "$REQUESTED_REF" >> "$GITHUB_OUTPUT"

      # Apart from the harness checkout above: that one is the revision this
      # workflow runs at, this one is the revision under test.
      - name: Check out the requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.shape.outputs.requested }}
          path: .requested
          fetch-depth: 1
          filter: blob:none

      # The workers' checkouts and PPU_EXPECTED_COMMIT both come from this value.
      # A branch or tag name would be resolved again by every consumer, and the
      # health check only compares a 40-char SHA -- it would skip the comparison
      # for everything else, which is exactly the manual case.
      - name: Resolve the requested ref to a commit
        id: source
        run: |
          resolved="$(git -C .requested rev-parse HEAD)"
          printf 'ref=%s\n' "$resolved" >> "$GITHUB_OUTPUT"
          echo "sources under test: ${resolved}"

      # Settle "which image is under test" once, in prepare, so all four test jobs
      # work from the same answer. The tag rule has to match Compute image metadata
      # in release-docker-ppu-nightly.yml character for character: lowercased owner,
      # / turned into - in the branch, UTC date, first 7 of the sha. Several
      # candidates are produced because the date is the one part that can differ.
      #
      # This is the fallback name only. A tag names a build just until the next
      # build overwrites it -- and the commit cannot tell two images of the same
      # commit apart -- so the pin step below prefers the digest the build itself
      # published, and resolves these tags only when that is unavailable.
      - name: Derive the image under test
        id: image
        env:
          REQUESTED_IMAGE: ${{ inputs.test_image }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # The build stamps its tag with `date -u +%Y%m%d` when it executes, not
          # when the run was created, and a re-run keeps created_at. Reading the
          # date off created_at would name a tag that the re-run never pushed.
          BUILD_STARTED: ${{ github.event.workflow_run.run_started_at || github.event.workflow_run.created_at }}
          BUILD_CREATED: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_IMAGE" ]; then
            printf 'tag=%s\n' "$REQUESTED_IMAGE" >> "$GITHUB_OUTPUT"
            printf 'candidates=%s\n' "$REQUESTED_IMAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BUILD_SHA" ]; then
            # Manual dispatch with no test_image: keep the fixed base image and
            # the source install.
            echo 'no build run behind this dispatch and no test_image given; keeping the source path'
            printf 'tag=\n' >> "$GITHUB_OUTPUT"
            printf 'candidates=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          owner_lc=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          branch=$(printf '%s' "$BUILD_BRANCH" | sed 's|/|-|g; s/[^A-Za-z0-9._-]/-/g')
          short_sha="${BUILD_SHA:0:7}"
          day_of() { printf '%s' "$1" | cut -c1-10 | tr -d '-'; }
          started_day="$(day_of "$BUILD_STARTED")"
          created_day="$(day_of "$BUILD_CREATED")"
          # A re-run that lands after 00:00 UTC on the following day stamps that
          # later date, which neither of the two above can guess.
          next_day="$(date -u -d "${created_day} + 1 day" +%Y%m%d 2>/dev/null || echo '')"
          # Tried in this order: the default branch can stand still for several
          # nights, so the same commit gets rebuilt under more than one date tag and
          # only the first candidate belongs to this build.
          candidates=''
          for day in "$started_day" "$created_day" "$next_day"; do
            [ -n "$day" ] || continue
            candidate="ghcr.io/${owner_lc}/sglang-ppu-nightly:${branch}-${day}-cuda13.0.0-sdk2.2.0-${short_sha}"
            case " $candidates " in
              *" $candidate "*) continue ;;
            esac
            candidates="${candidates:+$candidates }$candidate"
          done
          echo "candidate images under test: ${candidates}"
          printf 'tag=%s\n' "${candidates%% *}" >> "$GITHUB_OUTPUT"
          printf 'candidates=%s\n' "$candidates" >> "$GITHUB_OUTPUT"

      # The build names the artifact it pushed after its run *attempt*, and this
      # event carries an attempt too -- but not necessarily the same one. The build
      # workflow has three jobs, so one branch job failing makes "Re-run failed
      # jobs" the way back; that bumps the attempt without re-running the build job
      # that already succeeded, and the attempt named here has uploaded nothing.
      # Ask the run which artifact it actually holds.
      - name: Find the digest artifact of this build run
        id: artifact
        if: ${{ github.event_name == 'workflow_run' && inputs.test_image == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The attempt is the last segment of the name. Only attempts at or
          # below this event's own are eligible: a later attempt of the same
          # build run is a rebuild this test was not triggered by, and being
          # newer it would otherwise win.
          name="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name | startswith("ppu-nightly-image-${{ github.event.workflow_run.id }}-")) | select((.name | split("-") | last | tonumber?) <= ${{ github.event.workflow_run.run_attempt }})] | sort_by(.name | split("-") | last | tonumber?) | last | .name // empty')"
          printf 'name=%s\n' "${name}" >> "$GITHUB_OUTPUT"
          echo "digest artifact for this run: ${name:-<none>}"

      # An automatic run has this and nothing else: the pin step refuses to guess
      # a tag, so a build that published no digest stops the run here.
      - name: Fetch the digest the build published
        id: published
        if: ${{ github.event_name == 'workflow_run' && inputs.test_image == '' && steps.artifact.outputs.name != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .build-attempt

      # One retry, because the pin step treats a missing artifact as a reason to
      # stop: a transient 5xx would otherwise fail a whole night over a download
      # that has nothing to do with sglang.
      - name: Fetch the digest the build published (retry)
        if: ${{ steps.published.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .build-attempt

      # Pin the artifact here, once, rather than in each worker: four workers
      # asking the registry about the same tag can land on two different images
      # when a same-day rebuild overwrites it between their queries.
      - name: Pin the image under test to a digest
        id: digest
        env:
          CANDIDATES: ${{ steps.image.outputs.candidates }}
          REQUESTED_IMAGE: ${{ inputs.test_image }}
          BUILT_IMAGE: .build-attempt/image.json
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          if [ -z "${CANDIDATES}" ]; then
            printf 'ref=\n' >> "$GITHUB_OUTPUT"
            printf 'digest=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref=''
          digest=''
          source=''
          # 1. The exact digest this build attempt pushed, if it said so. This is
          #    the only value that survives a same-day rebuild overwriting the tag
          #    and a build crossing UTC midnight onto the next date's tag.
          if [ -f "${BUILT_IMAGE}" ]; then
            if published="$(python3 - "${BUILT_IMAGE}" "${BUILD_SHA}" <<'PY'
          import json
          import re
          import sys

          path, expected_commit = sys.argv[1:3]
          try:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
          except (OSError, ValueError):
              sys.exit(1)

          image = str(data.get("image") or "")
          digest = str(data.get("digest") or "")
          commit = str(data.get("commit") or "")
          # Read back from another run, so it is data: admitted only in the two
          # shapes it is supposed to have, and never otherwise passed on to an
          # env file or a pod spec.
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]*", image):
              sys.exit(1)
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              sys.exit(1)
          # The build stamps the commit it built into the image and the health
          # check compares it; a digest of another commit would only fail there.
          if expected_commit and commit != expected_commit:
              sys.exit(1)
          print(f"{image}@{digest}")
          PY
            )"; then
              ref="${published}"
              digest="${published#*@}"
              source='build-run'
            else
              echo "::warning::the build published no usable digest; nothing else names this image, so the next block decides"
            fi
          fi
          # 2. Only a caller-supplied image is left. Its tag has to resolve too:
          #    four workers re-pulling an unpinned reference can land on two
          #    different images if the tag moves between their pulls. Callers whose
          #    registry this runner cannot reach anonymously pass image@sha256:...,
          #    which resolve_image_digest.sh returns as it stands.
          if [ -z "${ref}" ]; then
            # An automatic run names its image one way only: the digest its own
            # build attempt published. Falling back to the derived tags would
            # resolve whatever they point at by now, and a same-day rebuild
            # carries the same commit -- the health check could not tell the two
            # images apart.
            if [ -z "${REQUESTED_IMAGE}" ]; then
              echo '::error::this run has no digest published by its build attempt; refusing to test a mutable tag. Re-dispatch this workflow with test_image=image@sha256:<the digest that build reported> to test it explicitly.'
              exit 1
            fi
            resolved=0
            for candidate in ${CANDIDATES}; do
              if PPU_RESOLVE_INPUT="${candidate}" PPU_RESOLVE_PREFIX=PPU_TEST_IMAGE \
                PPU_RESOLVE_STRICT=1 bash scripts/ci/ppu/resolve_image_digest.sh; then
                resolved=1
                break
              fi
            done
            if [ "${resolved}" != 1 ]; then
              echo "::error::none of ${CANDIDATES} resolve in the registry"
              exit 1
            fi
            # resolve_image_digest.sh publishes through GITHUB_ENV, which only
            # later steps see; read the two values back as data. Sourcing that
            # file would execute whatever a caller put in test_image.
            while IFS='=' read -r key value; do
              case "${key}" in
                PPU_TEST_IMAGE_REF) ref="${value}" ;;
                PPU_TEST_IMAGE_DIGEST) digest="${value}" ;;
              esac
            done < "${GITHUB_ENV}"
            source='tag-lookup'
          fi
          if [ -z "${ref}" ]; then
            echo "::error::the image under test could not be named; refusing to schedule cases against it"
            exit 1
          fi
          printf 'ref=%s\n' "${ref}" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "${digest}" >> "$GITHUB_OUTPUT"
          echo "image under test: ${ref} (${digest:-unresolved}, from ${source})"

      # The issue workflow runs outside this one and only sees run metadata, where
      # head_sha is the revision this file ran at -- the default branch, which can
      # move while the image builds. Publish the commit actually under test so a
      # red test is filed against it.
      - name: Publish the commit under test
        if: ${{ always() }}
        run: printf 'tested_sha=%s\n' "${{ steps.source.outputs.ref }}" > tested_sha.txt
      - name: Upload the commit under test
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ppu-nightly-tested-ref
          # A re-run of prepare in a later attempt would otherwise collide with
          # the artifact the first attempt left behind.
          overwrite: true
          path: tested_sha.txt
          if-no-files-found: ignore
          retention-days: 14

  # Run each shard on both supported board families. Include the board slug in
  # cluster-task staging, K8s Job names, local caches, and evidence artifacts.
  nightly-1a-ppu:
    name: nightly-1a-ppu-${{ matrix.board.slug }}
    strategy:
      fail-fast: false
      matrix:
        board:
          - { slug: zw-810e, selector: "board-type=ZW-810E" }
          - { slug: zw-m890p, selector: "board-type=ZW-M890P" }
    needs: [prepare]
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # The cluster timeout below is the suite budget the pod runs with plus 30
    # minutes: the 900 seconds the suite line reserves for scheduling, setup,
    # timeout handling and export, and another 15 for the health check, which may
    # wait that long for /health on its own. A slow but successful startup must
    # not get the pod killed mid-suite, and this job's own timeout stays 10
    # minutes above the cluster's.
    timeout-minutes: 135
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 2
      # Image mode runs the setup from this workflow's own revision, not from the
      # checkout above: a build made before image mode landed has an installer
      # that would reinstall sglang from source inside the artifact and no
      # image_healthcheck.sh at all. The cases still come from the checkout above,
      # so "tested == code" is unchanged.
      - name: Checkout the CI harness at the workflow revision
        if: ${{ needs.prepare.outputs.test_image != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-harness
          fetch-depth: 1
          # Only the setup scripts are needed, and the whole workspace is
          # archived to NAS for the pod: without these two the second checkout
          # would add a second full tree and a full .git to that archive.
          filter: blob:none
          sparse-checkout: scripts/ci
      - name: Resolve the base image digest
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      # The image under test, already pinned to a digest by prepare. Resolving it
      # again per worker would let two jobs pull two different images.
      - name: Run PPU nightly tests (1-GPU, partition 1/2) via K8s
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ needs.prepare.outputs.test_image_ref || env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: ${{ matrix.board.selector }}
          namespace: ppu-sched
          job_suffix: ${{ github.job }}-${{ matrix.board.slug }}
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "PPU_EXPECTED_DEVICES=1,SGLANG_IS_IN_CI=true,SGLANG_JIT_KERNEL_RUN_FULL_TESTS=1,SGL_KERNEL_WHEEL_CACHE_DIR=/nas_aisw/cache/sgl-kernel-wheels,PPU_TEST_MODE=${{ needs.prepare.outputs.test_image != '' && 'image' || 'source' }},PPU_TEST_IMAGE_REF=${{ needs.prepare.outputs.test_image_ref }},PPU_TEST_IMAGE_DIGEST=${{ needs.prepare.outputs.test_image_digest }},PPU_EXPECTED_COMMIT=${{ needs.prepare.outputs.ref }},PPU_HEALTHCHECK_SERVE=${{ vars.PPU_HEALTHCHECK_SERVE || '1' }},PPU_BASE_IMAGE_REF=${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }},PPU_BASE_IMAGE_DIGEST=${{ env.PPU_BASE_IMAGE_DIGEST }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PIP_INDEX_URL=https://pypi.org/simple"
          command: |
            set -euo pipefail
            cd /workspace/source
            export GITHUB_WORKSPACE=/workspace/source
            git config --global --add safe.directory /workspace/source
            ulimit -l unlimited
            ulimit -s 65536
            export CUDA_VISIBLE_DEVICES="${NVIDIA_VISIBLE_DEVICES:?Assigned devices are unavailable}"
            bash scripts/ci/warm_page_cache.sh \
              /nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct \
              /nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-30B-A3B \
              /nas_aisw/datasets/checkpoints/LLM/deepseek/v2/DeepSeek-V2-Lite-Chat \
              /nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-0.6B
            export PPU_EVIDENCE_DIR="/wl_nas/devops/ppu-nightly-evidence/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}-${{ matrix.board.slug }}"
            mkdir -p "$PPU_EVIDENCE_DIR"
            python3 scripts/ci/ppu/check_nightly_board.py \
              --board "${{ matrix.board.slug }}" \
              --devices "$PPU_EXPECTED_DEVICES" \
              --output "$PPU_EVIDENCE_DIR/device_fingerprint.json"
            # Which harness prepares the pod. Image mode needs the one from this
            # workflow's revision -- it is what knows how to prepare an artifact;
            # source mode keeps the tested commit's scripts, unchanged.
            harness="$PWD"
            if [ "${PPU_TEST_MODE:-source}" = image ]; then
              harness="$PWD/ci-harness"
              if [ ! -f "$harness/scripts/ci/ppu/image_healthcheck.sh" ]; then
                echo "::error::$harness carries no CI harness; image mode cannot validate the artifact"
                exit 1
              fi
            fi
            bash "$harness/scripts/ci/ppu/ppu_install_dependency.sh" 2>&1 | tee "$PPU_EVIDENCE_DIR/setup.log"
