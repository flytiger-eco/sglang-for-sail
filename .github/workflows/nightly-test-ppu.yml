          bash -n .ppu-resource/install.sh .ppu-resource/worker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-real-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ppu-resource/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  image:
    needs: prepare
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Resolve one immutable image for the entire run
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Require immutable image identity
        id: image
        run: |
          [[ "$PPU_BASE_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PPU_BASE_IMAGE_REF" == *"@$PPU_BASE_IMAGE_DIGEST" ]]
          printf 'image=%s\ndigest=%s\n' "$PPU_BASE_IMAGE_REF" "$PPU_BASE_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  execute:
    needs: [prepare, image]
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: real-${{ matrix.id }}
    env:
      TEST_ID: ${{ matrix.id }}
      PPU_BASE_IMAGE_REF: ${{ needs.image.outputs.image }}
      PPU_BASE_IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      EVIDENCE_SOURCE: /wl_nas/pr-ci/real-resource/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}
    steps:
      - name: Set runner-local result directory
        run: printf 'RESULT_DIR=%s/ppu-resource/%s\n' "$RUNNER_TEMP" "$TEST_ID" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ppu-real-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ppu-resource
      - name: Prepare isolated evidence directory
        run: |
          [[ "$PPU_BASE_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PPU_BASE_IMAGE_REF" == *"@$PPU_BASE_IMAGE_DIGEST" ]]
          mkdir -p "$RESULT_DIR"
          test ! -e "$EVIDENCE_SOURCE"
          mkdir -p "$EVIDENCE_SOURCE"
      - name: Run the real registered test on PPU
        id: worker
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: ${{ matrix.devices }}
          node_selector: board-type=ZW-M890P
          namespace: ppu-sched
          job_suffix: real-${{ matrix.id }}
          command: bash /workspace/source/.ppu-resource/worker.sh
          host_volumes: /wl_nas/pr-ci/real-resource/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}:/ppu-evidence,/wl_nas/pr-ci/real-resource-cache/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}:/ppu-resource-cache
          extra_env: "TEST_ID=${{ matrix.id }},TEST_TARGET=${{ matrix.target }},TEST_SECONDS=${{ matrix.seconds }},TEST_IN_CI=${{ matrix.in_ci }},ONLY_RUN=${{ matrix.only_run }},FORCE_UNSKIP=${{ matrix.force_unskip }},PPU_EVIDENCE_DIR=/ppu-evidence,PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_SUPPORTS_FP8=0,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PIP_INDEX_URL=https://pypi.org/simple"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: ${{ matrix.worker_minutes }}
          cleanup_policy: always
      - name: Collect real-test evidence
        if: always()
        env:
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        run: python3 .ppu-resource/summarize.py collect --test-id "$TEST_ID" --source "$EVIDENCE_SOURCE" --destination "$RESULT_DIR" --worker-outcome "$WORKER_OUTCOME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-real-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: error
          retention-days: 7

  summarize:
    needs: [prepare, image, execute]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ppu-real-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ppu-resource
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ppu-real-result-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: incoming
      - name: Aggregate all real-test outcomes
        run: |
          python3 .ppu-resource/summarize.py aggregate --source incoming --destination summary
          cat summary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-real-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: summary/
          if-no-files-found: error
          retention-days: 7
