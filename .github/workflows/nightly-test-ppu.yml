                  for path in source.glob('*/result.json'):
                      value = json.loads(path.read_text())
                      if value.get('id') not in found:
                          found[value.get('id')] = value
              rows = []
              for item in manifest():
                  result = found.get(item['id'], {'status': 'NOT_EXECUTED', 'events': []})
                  events = result.get('events', [])
                  rows.append({**item, 'status': result.get('status', 'NOT_EXECUTED'), 'returncode': result.get('returncode'), 'event_counts': dict(Counter(f"{e.get('kind')}:{e.get('phase')}" for e in events))})
              counts = dict(Counter(row['status'] for row in rows))
              write(destination / 'summary.json', {'counts': counts, 'rows': rows})
              lines = ['# PPU real resource validation', '', json.dumps(counts), '', '| Test | Status | Resources | Target |', '|---|---|---|---|']
              for row in rows:
                  lines.append(f"| {row['id']} | {row['status']} | {', '.join(row['resources'])} | `{row['target']}` |")
              (destination / 'summary.md').write_text('\n'.join(lines) + '\n')
              print('\n'.join(lines))


          parser = argparse.ArgumentParser()
          sub = parser.add_subparsers(dest='mode', required=True)
          collect_parser = sub.add_parser('collect')
          collect_parser.add_argument('--test-id', required=True)
          collect_parser.add_argument('--source', required=True)
          collect_parser.add_argument('--destination', required=True)
          collect_parser.add_argument('--worker-outcome', required=True)
          aggregate_parser = sub.add_parser('aggregate')
          aggregate_parser.add_argument('--source', required=True)
          aggregate_parser.add_argument('--destination', required=True)
          args = parser.parse_args()
          collect(args) if args.mode == 'collect' else aggregate(args)
          PY
          python3 .ppu-resource/build_manifest.py
          python3 - <<'PY'
