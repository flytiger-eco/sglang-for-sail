  nightly-test-ppu-finish:
    needs: [nightly-1-ppu, nightly-2-ppu, nightly-4-ppu, nightly-8-ppu]
    if: always()
    # Board-free: it only reads the `needs` verdicts and the levels' artifacts.
    # It is also the only job whose $GITHUB_STEP_SUMMARY writes survive -- the
    # level jobs' container hook drops them (see collect_answer_evidence.sh).
    runs-on: ubuntu-latest
    # `actions: read` downloads the levels' artifacts.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      # Best effort, like the uploads: a lost artifact leaves that level unlisted.
      - name: Download nightly results
        id: download
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ppu-nightly-k8s-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-artifacts
      - name: Name the files that failed
        if: always()
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          # Never decides the ladder: a broken renderer leaves the verdict step
          # below untouched.
          if python3 scripts/ci/ppu/nightly_failures.py nightly-artifacts > nightly-failures.md; then
            cat nightly-failures.md
            cat nightly-failures.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not render the failed-file table; each level job's \`✗ FAILED:\` annotations still name its failing files"
          fi
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              sep = ','
              print(f'Failed jobs: {sep.join(failed)}')
              sys.exit(1)
          print('All jobs completed successfully')
          "
