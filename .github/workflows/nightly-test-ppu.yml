name: PPU model and LoRA cache repair (temporary)
run-name: PPU cache repair and real tests | ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      only_tests:
        description: 'Optional comma-separated test IDs; empty runs all 13 real tests'
        type: string
        default: ''

concurrency:
  group: ppu-model-lora-cache-repair
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.17-py312-20261001
  PPU_SDK_VERSION: 2.2.0

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      resources: ${{ steps.manifest.outputs.resources }}
      sha: ${{ steps.dispatch.outputs.sha }}
    steps:
      - name: Validate dispatch before checkout
        id: dispatch
        run: |
          [[ "$GITHUB_REF" == refs/heads/feat/ppu-cuda-sweep-890p ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.dispatch.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Build cache repair and real-test bundle
        id: manifest
        env:
          ONLY_TESTS: ${{ inputs.only_tests }}
        run: |
          mkdir -p .ppu-resource/compat
          cat > .ppu-resource/build_manifest.py <<'PY'
          import ast
          import json
          import math
          import os
          import re
          from pathlib import Path

          ROOT = Path.cwd()


          def case(test_id, resource, target, devices=1, seconds=1200,
                   only_run='', in_ci='true', force_unskip='0'):
              return {
                  'id': test_id,
                  'resource': resource,
                  'target': target,
                  'devices': devices,
                  'seconds': seconds,
                  'worker_minutes': math.ceil(seconds / 60) + 30,
                  'job_minutes': math.ceil(seconds / 60) + 45,
                  'only_run': only_run,
                  'in_ci': in_ci,
                  'force_unskip': force_unskip,
              }


          TESTS = [
              case('qwen3-fp8', 'Qwen/Qwen3-30B-A3B-Instruct-2507-FP8',
                   'test/registered/backends/test_flashinfer_nvfp4_online_moe_backend.py::TestFlashinferTrtllmGenMoeBackendNvFp4Online::test_gsm8k',
                   devices=4, force_unskip='1'),
              case('apertus', 'swiss-ai/Apertus-8B',
                   'test/registered/models_e2e/test_generation_models.py::TestGenerationModels::test_all_models',
                   only_run='swiss-ai/Apertus-8B', in_ci='false'),
              case('inkling', 'thinkingmachines/Inkling',
                   'test/registered/models_e2e/test_inkling.py::TestInklingServer::test_generation_basic'),
              case('inkling-nvfp4', 'thinkingmachines/Inkling-NVFP4',
                   'test/registered/8-gpu-models/test_inkling_nvfp4_nightly.py::TestInklingNVFP4Nightly::test_inkling_nvfp4',
                   devices=8, seconds=1800, force_unskip='1'),
              case('lora-nemotron', 'opherlie/lora-test-case-NVIDIA-Nemotron-3-Super-120B-A12B-BF16',
                   'test/registered/lora/test_lora_nemotron_3_super_120b_a12b_logprob_diff.py::TestLoRANemotron3Super120B_A12B_LogprobDiff::test_lora_nemotron_3_super_120b_a12b_logprob_accuracy',
                   devices=4),
              case('lora-qwen35-35b', 'opherlie/lora-test-case-Qwen3.5-35B-A3B',
                   'test/registered/lora/test_lora_qwen3_5_35b_a3b_logprob_diff.py::TestLoRAQwen3_5_35B_A3B_LogprobDiff::test_lora_qwen3_5_35b_a3b_logprob_accuracy',
                   devices=4),
              case('lora-qwen35-4b', 'opherlie/lora-test-case-Qwen3.5-4B',
                   'test/registered/lora/test_lora_qwen3_5_4b_logprob_diff.py::TestLoRAQwen3_5_4BLogprobDiff::test_lora_qwen3_5_4b_logprob_accuracy'),
              case('lora-dsv31', 'yushengsu/lora-diff-DeepSeek-V3.1-Base',
                   'test/registered/lora/test_lora_deepseek_v3_base_logprob_diff.py::TestLoRADeepSeekV3BaseLogprobDiff::test_lora_deepseek_v3_base_logprob_accuracy',
                   devices=8, seconds=1800),
              case('lora-kimi25', 'yushengsu/lora-diff-Kimi-K2.5',
                   'test/registered/lora/test_lora_kimi_k25_logprob_diff.py::TestLoRAKimiK25LogprobDiff::test_lora_kimi_k25_logprob_accuracy',
                   devices=8, seconds=1800),
              case('lora-qwen3-30b', 'yushengsu/lora-diff-Qwen3-30B-A3B-Instruct-2507',
                   'test/registered/lora/test_lora_qwen3_30b_a3b_instruct_2507_logprob_diff.py::TestLoRAQwen3_30B_A3B_Instruct_2507_LogprobDiff::test_lora_qwen3_30b_a3b_instruct_2507_logprob_accuracy',
                   devices=4),
              case('lora-qwen3-8b', 'yushengsu/lora-diff-Qwen3-8B',
                   'test/registered/lora/test_lora_qwen3_8b_logprob_diff.py::TestLoRAQwen3_8BLogprobDiff::test_lora_qwen3_8b_logprob_accuracy'),
              case('lora-qwen3-vl', 'yushengsu/lora-diff-Qwen3-VL-30B-A3B-Instruct',
                   'test/registered/lora/test_lora_qwen3_vl_30b_a3b_instruct_logprob_diff.py::TestLoRAQwen3VL_30B_A3B_Instruct_LogprobDiff::test_lora_qwen3_vl_30b_a3b_instruct_logprob_accuracy',
                   devices=4),
              case('lora-gpt-oss', 'yushengsu/lora-diff-gpt-oss-20b',
                   'test/registered/lora/test_lora_gpt_oss_20b_logprob_diff.py::TestLoRAGptOss20BLogprobDiff::test_lora_gpt_oss_20b_logprob_accuracy',
                   devices=4),
          ]

          inherited = {
              ('TestFlashinferTrtllmGenMoeBackendNvFp4Online', 'test_gsm8k'),
          }
          resources = []
          for item in TESTS:
              assert re.fullmatch(r'[a-z0-9-]+', item['id'])
              assert item['devices'] in (1, 2, 4, 8)
              filename, class_name, method_name = item['target'].split('::')
              path = ROOT / filename
              assert path.is_file(), filename
              tree = ast.parse(path.read_text())
              cls = next((n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == class_name), None)
              assert cls is not None, item['target']
              methods = {n.name for n in cls.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
              assert method_name in methods or (class_name, method_name) in inherited, item['target']
              resources.append(item['resource'])
          assert len(TESTS) == 13
          assert len(resources) == len(set(resources)) == 13
          selected = set(filter(None, os.environ.get('ONLY_TESTS', '').split(',')))
          if selected:
              TESTS = [item for item in TESTS if item['id'] in selected]
              assert {item['id'] for item in TESTS} == selected
          (ROOT / '.ppu-resource/manifest.json').write_text(json.dumps({'tests': TESTS}, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + json.dumps({'include': TESTS}, separators=(',', ':')) + '\n')
              stream.write('resources=' + '|'.join(item['resource'] for item in TESTS) + '\n')
          PY
          cat > .ppu-resource/repair_cache.py <<'PY'
          import hashlib
          import json
          import os
          import sys
          import traceback
          from pathlib import Path

          os.environ['HF_HUB_CACHE'] = '/nas_aisw/datasets/hf_cache/hub'
          os.environ['HF_HUB_OFFLINE'] = '1'
          os.environ['TRANSFORMERS_OFFLINE'] = '1'

          from huggingface_hub import hf_hub_download, snapshot_download

          CACHE = Path('/nas_aisw/datasets/hf_cache/hub')
          MODEL_ROOT = Path('/nas_aisw/datasets/checkpoints/LLM')
          LORA_ROOT = Path('/nas_aisw/datasets/datasets/LLM')
          MODELS = {
              'thinkingmachines/Inkling': ('Inkling',),
              'thinkingmachines/Inkling-NVFP4': ('Inkling-NVFP4',),
              'Qwen/Qwen3-30B-A3B-Instruct-2507-FP8': ('Qwen3-30B-A3B-Instruct-2507-FP8',),
              'swiss-ai/Apertus-8B': ('Apertus-8B-2509', 'Apertus-8B'),
          }
          LORAS = [
              'opherlie/lora-test-case-NVIDIA-Nemotron-3-Super-120B-A12B-BF16',
              'opherlie/lora-test-case-Qwen3.5-35B-A3B',
              'opherlie/lora-test-case-Qwen3.5-4B',
              'yushengsu/lora-diff-DeepSeek-V3.1-Base',
              'yushengsu/lora-diff-Kimi-K2.5',
              'yushengsu/lora-diff-Qwen3-30B-A3B-Instruct-2507',
              'yushengsu/lora-diff-Qwen3-8B',
              'yushengsu/lora-diff-Qwen3-VL-30B-A3B-Instruct',
              'yushengsu/lora-diff-gpt-oss-20b',
          ]


          def model_complete(path):
              if not path.is_dir() or not (path / 'config.json').is_file():
                  return False
              patterns = ('*.safetensors', '*.bin', '*.pt', '*.pth')
              return any(any(path.glob(pattern)) for pattern in patterns)


          def lora_complete(path):
              if not path.is_dir():
                  return False
              if not (path / 'adapter_config.json').is_file():
                  return False
              if not (path / 'compare_sample_train_data.pt').is_file():
                  return False
              return bool(list(path.glob('adapter_model*.safetensors')) + list(path.glob('adapter_model*.bin')))


          def cached_snapshots(repo_id, names, repo_type):
              org = repo_id.split('/', 1)[0]
              for name in names:
                  entry = CACHE / f'{repo_type}s--{org}--{name}'
                  snapshots = entry / 'snapshots'
                  if snapshots.is_dir():
                      for path in snapshots.iterdir():
                          if path.is_dir():
                              yield path


          def nas_candidates(root, names, required_file, complete):
              if not root.is_dir():
                  return
              for current, dirs, files in os.walk(root):
                  dirs[:] = [name for name in dirs if name not in {'.git', '__pycache__'}]
                  if required_file not in files:
                      continue
                  path = Path(current)
                  if any(name in path.parts for name in names):
                      yield path


          def select_candidate(repo_id, names, repo_type, root, required_file, complete):
              observed = {}
              for path in cached_snapshots(repo_id, names, repo_type):
                  observed[str(path.resolve())] = path
              for path in nas_candidates(root, names, required_file, complete):
                  observed[str(path.resolve())] = path
              candidates = {
                  resolved: path for resolved, path in observed.items()
                  if complete(path)
              }
              if repo_id == 'swiss-ai/Apertus-8B':
                  candidates = {
                      resolved: path for resolved, path in candidates.items()
                      if 'Apertus-8B-2509' in resolved
                  }
              if not candidates:
                  details = []
                  for resolved, path in sorted(observed.items()):
                      entries = []
                      for item in sorted(path.iterdir(), key=lambda value: value.name):
                          entry = {
                              'name': item.name,
                              'is_dir': item.is_dir(),
                              'is_file': item.is_file(),
                              'is_symlink': item.is_symlink(),
                          }
                          if item.is_symlink():
                              entry['target'] = os.readlink(item)
                          entries.append(entry)
                      details.append({'path': resolved, 'entries': entries[:100]})
                  raise FileNotFoundError(
                      f'No complete source found for {repo_id} under {root} or {CACHE}; '
                      f'observed={json.dumps(details)}'
                  )

              def score(item):
                  resolved, path = item
                  value = 0
                  if repo_id == 'swiss-ai/Apertus-8B' and 'Apertus-8B-2509' in resolved:
                      value += 1000
                  if path.name in names:
                      value += 100
                  value += sum(20 for name in names if name in path.parts)
                  if repo_id.split('/', 1)[0] in path.parts:
                      value += 10
                  if (path / 'tokenizer.json').is_file():
                      value += 2
                  return value, resolved

              selected = max(candidates.items(), key=score)
              return selected[1], sorted(candidates)


          def register_snapshot(repo_id, repo_type, source, refs):
              entry = CACHE / f'{repo_type}s--{repo_id.replace("/", "--")}'
              revision = hashlib.sha256(
                  f'{repo_type}:{repo_id}:{source.resolve()}'.encode()
              ).hexdigest()[:40]
              (entry / 'refs').mkdir(parents=True, exist_ok=True)
              (entry / 'snapshots').mkdir(parents=True, exist_ok=True)
              destination = entry / 'snapshots' / revision
              if destination.is_symlink():
                  if destination.resolve() != source.resolve():
                      raise RuntimeError(f'Conflicting cache symlink: {destination}')
              elif destination.exists():
                  if destination.resolve() != source.resolve():
                      raise RuntimeError(f'Conflicting cache directory: {destination}')
              else:
                  destination.symlink_to(source, target_is_directory=True)
              for ref in refs:
                  (entry / 'refs' / ref).write_text(revision)
              return entry, revision


          def validate(repo_id, repo_type, complete, refs):
              path = Path(snapshot_download(
                  repo_id,
                  repo_type=repo_type,
                  local_files_only=True,
              ))
              if not complete(path):
                  raise RuntimeError(f'Offline snapshot is incomplete for {repo_id}: {path}')
              for ref in refs:
                  if repo_type == 'model':
                      resolved = hf_hub_download(
                          repo_id,
                          'config.json',
                          repo_type=repo_type,
                          revision=ref,
                          local_files_only=True,
                      )
                      if not Path(resolved).is_file():
                          raise RuntimeError(f'Offline config missing for {repo_id} at {ref}')
              return path


          def process_model(report, repo_id, names):
              try:
                  source, candidates = select_candidate(
                      repo_id, names, 'model', MODEL_ROOT, 'config.json', model_complete,
                  )
                  entry, revision = register_snapshot(
                      repo_id, 'model', source, ('main', 'test'),
                  )
                  snapshot = validate(repo_id, 'model', model_complete, ('main', 'test'))
                  report.append({
                      'resource': repo_id,
                      'status': 'ok',
                      'source': str(source),
                      'resolved_source': str(source.resolve()),
                      'candidates': candidates,
                      'cache_entry': str(entry),
                      'revision': revision,
                      'snapshot': str(snapshot),
                  })
                  print(f'CACHE_OK {repo_id} source={source} snapshot={snapshot}', flush=True)
              except Exception as error:
                  report.append({
                      'resource': repo_id,
                      'status': 'error',
                      'error': f'{type(error).__name__}: {error}',
                      'traceback': traceback.format_exc(),
                  })
                  print(f'CACHE_ERROR {repo_id}: {type(error).__name__}: {error}', flush=True)


          def process_lora(report, repo_id):
              name = repo_id.split('/', 1)[1]
              try:
                  source, candidates = select_candidate(
                      repo_id, (name,), 'dataset', LORA_ROOT,
                      'adapter_config.json', lora_complete,
                  )
                  entry, revision = register_snapshot(
                      repo_id, 'dataset', source, ('main',),
                  )
                  snapshot = validate(repo_id, 'dataset', lora_complete, ('main',))
                  report.append({
                      'resource': repo_id,
                      'status': 'ok',
                      'source': str(source),
                      'resolved_source': str(source.resolve()),
                      'candidates': candidates,
                      'cache_entry': str(entry),
                      'revision': revision,
                      'snapshot': str(snapshot),
                  })
                  print(f'CACHE_OK {repo_id} source={source} snapshot={snapshot}', flush=True)
              except Exception as error:
                  report.append({
                      'resource': repo_id,
                      'status': 'error',
                      'error': f'{type(error).__name__}: {error}',
                      'traceback': traceback.format_exc(),
                  })
                  print(f'CACHE_ERROR {repo_id}: {type(error).__name__}: {error}', flush=True)


          def main():
              destination = Path(sys.argv[1])
              destination.parent.mkdir(parents=True, exist_ok=True)
              report = []
              for repo_id, names in MODELS.items():
                  process_model(report, repo_id, names)
              for repo_id in LORAS:
                  process_lora(report, repo_id)
              result = {
                  'cache': str(CACHE),
                  'model_root': str(MODEL_ROOT),
                  'lora_root': str(LORA_ROOT),
                  'resources': report,
              }
              destination.write_text(json.dumps(result, indent=2) + '\n')
              required = set(filter(None, os.environ.get('REQUIRED_RESOURCES', '').split('|')))
              if not required:
                  required = {item['resource'] for item in report}
              failed = [
                  item['resource'] for item in report
                  if item['status'] != 'ok' and item['resource'] in required
              ]
              print(f'CACHE_REPAIR_SUMMARY total={len(report)} required_failed={failed}', flush=True)
              if failed:
                  raise SystemExit(1)


          if __name__ == '__main__':
              main()
          PY
          cat > .ppu-resource/compat/sitecustomize.py <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import huggingface_hub


          def resource_event(kind, phase, **fields):
              directory = os.environ.get('PPU_EVIDENCE_DIR')
              if not directory:
                  return
              record = {
                  'time': time.time(),
                  'pid': os.getpid(),
                  'kind': kind,
                  'phase': phase,
                  **fields,
              }
              with Path(directory, 'events.jsonl').open('a') as stream:
                  stream.write(json.dumps(record, default=str) + '\n')


          _original_snapshot_download = huggingface_hub.snapshot_download
          _original_hf_hub_download = huggingface_hub.hf_hub_download


          def _snapshot_download(repo_id, *args, **kwargs):
              kwargs['local_files_only'] = True
              fields = {
                  'repo_id': repo_id,
                  'repo_type': kwargs.get('repo_type'),
                  'revision': kwargs.get('revision'),
              }
              resource_event('snapshot', 'start', **fields)
              try:
                  result = _original_snapshot_download(repo_id, *args, **kwargs)
              except Exception as error:
                  resource_event('snapshot', 'error', error=f'{type(error).__name__}: {error}'[:2000], **fields)
                  raise
              resource_event('snapshot', 'success', path=str(result), **fields)
              return result


          def _hf_hub_download(repo_id, filename, *args, **kwargs):
              kwargs['local_files_only'] = True
              fields = {
                  'repo_id': repo_id,
                  'filename': filename,
                  'repo_type': kwargs.get('repo_type'),
                  'revision': kwargs.get('revision'),
              }
              resource_event('hub_file', 'start', **fields)
              try:
                  result = _original_hf_hub_download(repo_id, filename, *args, **kwargs)
              except Exception as error:
                  resource_event('hub_file', 'error', error=f'{type(error).__name__}: {error}'[:2000], **fields)
                  raise
              resource_event('hub_file', 'success', path=str(result), **fields)
              return result


          huggingface_hub.snapshot_download = _snapshot_download
          huggingface_hub.hf_hub_download = _hf_hub_download
          PY
          cat > .ppu-resource/compat/resource_pytest_plugin.py <<'PY'
          import os

          from sitecustomize import resource_event


          def _target_matches(nodeid):
              target = os.environ.get('TEST_TARGET', '')
              return nodeid == target or target == f'test/{nodeid}'


          def pytest_collectstart(collector):
              if os.environ.get('FORCE_UNSKIP') != '1':
                  return
              cls = getattr(collector, 'obj', None)
              if not isinstance(cls, type):
                  return
              target = os.environ.get('TEST_TARGET', '')
              if f'::{cls.__name__}::' not in target:
                  return
              if getattr(cls, '__unittest_skip__', False):
                  cls.__unittest_skip__ = False
                  cls.__unittest_skip_why__ = ''
                  resource_event('plugin', 'class_unskip', class_name=cls.__name__)
              method_name = target.rsplit('::', 1)[-1]
              method = getattr(cls, method_name, None)
              if getattr(method, '__unittest_skip__', False):
                  original = getattr(method, '__wrapped__', None)
                  if original is not None:
                      setattr(cls, method_name, original)
                      method = original
                  method.__unittest_skip__ = False
                  method.__unittest_skip_why__ = ''
                  resource_event(
                      'plugin', 'method_unskip',
                      class_name=cls.__name__,
                      method_name=method_name,
                      restored_wrapper=original is not None,
                  )


          def pytest_runtest_logstart(nodeid):
              if _target_matches(nodeid):
                  resource_event('pytest', 'start', nodeid=nodeid)


          def pytest_runtest_setup(item):
              if _target_matches(item.nodeid):
                  resource_event('pytest', 'setup', nodeid=item.nodeid)


          def pytest_runtest_call(item):
              if _target_matches(item.nodeid):
                  resource_event('pytest', 'call', nodeid=item.nodeid)


          def pytest_runtest_logreport(report):
              if _target_matches(report.nodeid):
                  resource_event(
                      'pytest_report', report.when,
                      nodeid=report.nodeid,
                      outcome=report.outcome,
                  )
          PY
          cat > .ppu-resource/install.sh <<'SH'
          set -euo pipefail
          export GITHUB_WORKSPACE=/workspace/source
          export PYTHONPATH="/workspace/source/python:/workspace/source/test${PYTHONPATH:+:$PYTHONPATH}"
          export PPU_INSTALL_PROFILE=nightly
          export PIP_CACHE_DIR=/ppu-resource-cache/pip
          export SGL_KERNEL_WHEEL_CACHE_DIR=/ppu-resource-cache/aot/ZW-M890P
          bash scripts/ci/ppu/ppu_install_dependency.sh
          python3 -m pip install pytest==8.3.5 tabulate
          SH
          cat > .ppu-resource/worker.sh <<'SH'
          set -euo pipefail
          cd /workspace/source
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0=/workspace/source
          export PYTHONPATH="$PWD/.ppu-resource/compat:$PWD/python:$PWD/test${PYTHONPATH:+:$PYTHONPATH}"
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1
          export HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub
          export SGLANG_TEST_MAX_RETRY=0 SGLANG_IS_IN_CI="${TEST_IN_CI:-true}"
          export NCCL_NVLS_ENABLE=0 SGLANG_JIT_DEEPGEMM_FAST_WARMUP=true
          export GLOO_SOCKET_IFNAME=lo
          export PCCL_MNNVL_ENABLE=0 SGLANG_ENABLE_CUSTOM_ALL_REDUCE_V2_MULTINODE=0
          export TVM_FFI_CACHE_DIR=/tmp/ppu-resource-tvm-ffi
          export SGLANG_JIT_CACHE_DIR=/tmp/ppu-resource-jit
          export DG_JIT_CACHE_DIR=/tmp/ppu-resource-deep-gemm
          export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1
          mkdir -p "$PPU_EVIDENCE_DIR"
          if [[ "${MODE:-test}" == repair ]]; then
            python3 .ppu-resource/repair_cache.py "$PPU_EVIDENCE_DIR/repair-report.json" \
              > >(tee "$PPU_EVIDENCE_DIR/repair.log") 2>&1
            exit 0
          fi
          bash .ppu-resource/install.sh
          echo "REAL_TEST_BEGIN id=$TEST_ID target=$TEST_TARGET only_run=${ONLY_RUN:-} force_unskip=${FORCE_UNSKIP:-0}"
          set +e
          timeout --signal=TERM --kill-after=30s "${TEST_SECONDS}s" \
            python3 -m pytest -p resource_pytest_plugin -vv -s --maxfail=1 --tb=long \
            --junitxml="$PPU_EVIDENCE_DIR/junit.xml" "$TEST_TARGET" \
            > >(tee "$PPU_EVIDENCE_DIR/test.log") 2>&1
          rc=${PIPESTATUS[0]}
          set -e
          TEST_RC="$rc" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          result = {
              'id': os.environ['TEST_ID'],
              'resource': os.environ['TEST_RESOURCE'],
              'target': os.environ['TEST_TARGET'],
              'returncode': int(os.environ['TEST_RC']),
          }
          Path(os.environ['PPU_EVIDENCE_DIR'], 'test-result.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          echo "REAL_TEST_END id=$TEST_ID returncode=$rc"
          exit 0
          SH
          python3 .ppu-resource/build_manifest.py
          python3 - <<'PY'
          import textwrap
          from pathlib import Path
          for path in Path('.ppu-resource').rglob('*.py'):
              compile(path.read_text(), str(path), 'exec')
          print('Validated all cache repair and real-test Python scripts')
          PY
          bash -n .ppu-resource/install.sh .ppu-resource/worker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-cache-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ppu-resource/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  image:
    needs: prepare
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Resolve one immutable image for the entire run
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Require immutable image identity
        id: image
        run: |
          [[ "$PPU_BASE_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PPU_BASE_IMAGE_REF" == *"@$PPU_BASE_IMAGE_DIGEST" ]]
          printf 'image=%s\ndigest=%s\n' "$PPU_BASE_IMAGE_REF" "$PPU_BASE_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  repair:
    needs: [prepare, image]
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 60
    env:
      PPU_BASE_IMAGE_REF: ${{ needs.image.outputs.image }}
      PPU_BASE_IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      EVIDENCE_SOURCE: /wl_nas/pr-ci/cache-repair/${{ github.run_id }}/${{ github.run_attempt }}/repair
      REQUIRED_RESOURCES: ${{ needs.prepare.outputs.resources }}
    steps:
      - name: Set runner-local result directory
        run: printf 'RESULT_DIR=%s/ppu-cache-repair\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ppu-cache-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ppu-resource
      - name: Prepare repair evidence
        run: |
          mkdir -p "$RESULT_DIR" "$EVIDENCE_SOURCE"
      - name: Discover NAS sources and register complete offline caches
        id: worker
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: board-type=ZW-M890P
          namespace: ppu-sched
          job_suffix: cache-repair
          command: bash /workspace/source/.ppu-resource/worker.sh
          host_volumes: /wl_nas/pr-ci/cache-repair/${{ github.run_id }}/${{ github.run_attempt }}/repair:/ppu-evidence,/wl_nas/pr-ci/cache-repair-cache/${{ github.run_id }}/${{ github.run_attempt }}:/ppu-resource-cache
          extra_env: "MODE=repair,REQUIRED_RESOURCES=${{ needs.prepare.outputs.resources }},PPU_EVIDENCE_DIR=/ppu-evidence,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,HF_HUB_OFFLINE=1,TRANSFORMERS_OFFLINE=1,HF_DATASETS_OFFLINE=1"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 45
          cleanup_policy: always
      - name: Collect cache repair report
        if: always()
        run: cp -a "$EVIDENCE_SOURCE/." "$RESULT_DIR/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-cache-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: error
          retention-days: 30

  execute:
    needs: [prepare, image, repair]
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: real-${{ matrix.id }}
    env:
      TEST_ID: ${{ matrix.id }}
      PPU_BASE_IMAGE_REF: ${{ needs.image.outputs.image }}
      PPU_BASE_IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      EVIDENCE_SOURCE: /wl_nas/pr-ci/cache-repair/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}
    steps:
      - name: Set runner-local result directory
        run: printf 'RESULT_DIR=%s/ppu-cache-repair/%s\n' "$RUNNER_TEMP" "$TEST_ID" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ppu-cache-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ppu-resource
      - name: Prepare isolated evidence directory
        run: |
          mkdir -p "$RESULT_DIR"
          test ! -e "$EVIDENCE_SOURCE"
          mkdir -p "$EVIDENCE_SOURCE"
      - name: Run the real registered test on PPU
        id: worker
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: ${{ matrix.devices }}
          node_selector: board-type=ZW-M890P
          namespace: ppu-sched
          job_suffix: cache-${{ matrix.id }}
          command: bash /workspace/source/.ppu-resource/worker.sh
          host_volumes: /wl_nas/pr-ci/cache-repair/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}:/ppu-evidence,/wl_nas/pr-ci/cache-repair-cache/${{ github.run_id }}/${{ github.run_attempt }}:/ppu-resource-cache
          extra_env: "TEST_ID=${{ matrix.id }},TEST_RESOURCE=${{ matrix.resource }},TEST_TARGET=${{ matrix.target }},TEST_SECONDS=${{ matrix.seconds }},TEST_IN_CI=${{ matrix.in_ci }},ONLY_RUN=${{ matrix.only_run }},FORCE_UNSKIP=${{ matrix.force_unskip }},PPU_EVIDENCE_DIR=/ppu-evidence,PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_SUPPORTS_FP8=0,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PIP_INDEX_URL=https://pypi.org/simple"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: ${{ matrix.worker_minutes }}
          cleanup_policy: always
      - name: Collect real-test evidence
        if: always()
        run: cp -a "$EVIDENCE_SOURCE/." "$RESULT_DIR/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-cache-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: error
          retention-days: 30
