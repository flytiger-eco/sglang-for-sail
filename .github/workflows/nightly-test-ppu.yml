name: Nightly Test (PPU)

# DISPATCH SHIM -- PROBE BRANCH ONLY. This filename is registered on the default
# branch (workflow ID 333448550), which is the only reason workflow_dispatch can
# reach it. The reusable workflow body below is resolved from THIS branch's
# commit, not the default branch, so it launches the ported accuracy line. The
# original nightly board jobs were removed on purpose: a plain dispatch of the
# real file would ignite hours of unrelated PPU work. Never merge this branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit/branch/tag checked out inside the PPU worker.'
        required: false
        type: string
        default: ''
      mode:
        description: 'smoke=20 samples (path proof), full=whole split, both.'
        required: false
        type: string
        default: smoke
      entries:
        description: "Comma-separated accuracy entries, or 'all'. Empty runs glm52-fp8chan-gsm8k only."
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: shim-ppu-accuracy-${{ inputs.ref || github.ref }}-${{ inputs.entries }}
  cancel-in-progress: false

jobs:
  accuracy:
    uses: ./.github/workflows/test-ppu-accuracy-k8s.yml
    with:
      ref: ${{ inputs.ref }}
      mode: ${{ inputs.mode }}
      entries: ${{ inputs.entries }}
    secrets: inherit
