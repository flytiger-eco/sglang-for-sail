name: Nightly Test (PPU)

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test. Only the current v0.5.18 HEAD can update latest.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test. Only the current v0.5.18 HEAD can update latest.'
        required: false
        type: string
        default: ''

# Share the existing global board budget across refs and manual family runs.
concurrency:
  group: ppu-nightly-btv15
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PPU_SDK_VERSION: 2.2.0

jobs:
  build-image:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ${{ vars.PPU_NIGHTLY_BUILD_RUNNER || 'ppu' }}
    timeout-minutes: 180
    outputs:
      image: ${{ steps.identity.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      source-sha: ${{ steps.source.outputs.sha }}
      repository: ${{ steps.source.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Pin build source and candidate tag
        id: source
        env:
          IMAGE_REPOSITORY: ${{ vars.PPU_NIGHTLY_IMAGE_REPOSITORY }}
          EIC_PACKAGE_DIR: ${{ vars.PPU_CI_EIC_PACKAGE_DIR }}
        run: |
          host='[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?'
          component='[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*'
          repository_pattern="${host}(\.${host})*(:[0-9]+)?/${component}(/${component})*"
          if [[ ! "$IMAGE_REPOSITORY" =~ ^${repository_pattern}$ ]]; then
            echo 'Set PPU_NIGHTLY_IMAGE_REPOSITORY to a fully qualified, pull-accessible image repository without a tag.' >&2
            exit 1
          fi
          if [[ ! "$EIC_PACKAGE_DIR" = /* || ! -d "$EIC_PACKAGE_DIR" ]]; then
            echo 'Set PPU_CI_EIC_PACKAGE_DIR to the EIC artifact directory on the build runner.' >&2
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          {
            echo "sha=$sha"
            echo "repository=$IMAGE_REPOSITORY"
            echo "registry=${IMAGE_REPOSITORY%%/*}"
            echo "tag=$IMAGE_REPOSITORY:v0.5.18-$sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.source.outputs.registry }}
          username: ${{ secrets.PPU_ARTIFACTORY_USER }}
          password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
      - name: Build and push the candidate CI image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ppu.Dockerfile
          target: ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.source.outputs.tag }}
          build-contexts: |
            ppu-eic=${{ vars.PPU_CI_EIC_PACKAGE_DIR }}
          build-args: |
            BRANCH_TYPE=local
            SGLANG_BUILD_COMMIT=${{ steps.source.outputs.sha }}
            SGLANG_BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            SGLANG_IMAGE_TAG=${{ steps.source.outputs.tag }}
      - name: Export immutable candidate identity
        id: identity
        env:
          IMAGE_REPOSITORY: ${{ steps.source.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=$IMAGE_REPOSITORY@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo '## PPU nightly candidate'
            echo "Source: $SOURCE_SHA"
            echo "Image: $IMAGE_REPOSITORY@$IMAGE_DIGEST"
            echo 'Latest remains unchanged until PD, Perf, Answer and full Accuracy all pass.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Preserve the global PD -> Perf -> Answer -> Accuracy resource stages.
  pd-glm52:
    needs: [build-image]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    uses: ./.github/workflows/test-ppu-pd-perf-glm52.yml
    with:
      ref: ${{ needs.build-image.outputs.source-sha }}
      image_ref: ${{ needs.build-image.outputs.image }}
      image_digest: ${{ needs.build-image.outputs.digest }}
      pd_config: all
    permissions:
      contents: write
      actions: read
    secrets: inherit

  pd-qwen35:
    needs: [build-image]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    uses: ./.github/workflows/test-ppu-pd-perf-qwen35.yml
    with:
      ref: ${{ needs.build-image.outputs.source-sha }}
      image_ref: ${{ needs.build-image.outputs.image }}
      image_digest: ${{ needs.build-image.outputs.digest }}
      pd_config: all
    permissions:
      contents: write
      actions: read
    secrets: inherit

  perf-8:
    needs: [build-image, pd-glm52, pd-qwen35]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    uses: ./.github/workflows/test-ppu-perf.yml
    with:
      ref: ${{ needs.build-image.outputs.source-sha }}
      image_ref: ${{ needs.build-image.outputs.image }}
      image_digest: ${{ needs.build-image.outputs.digest }}
    permissions:
      contents: write
      actions: read
    secrets: inherit

  perf-16:
    needs: [build-image, pd-glm52, pd-qwen35]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    uses: ./.github/workflows/test-ppu-perf-16.yml
    with:
      ref: ${{ needs.build-image.outputs.source-sha }}
      image_ref: ${{ needs.build-image.outputs.image }}
      image_digest: ${{ needs.build-image.outputs.digest }}
    permissions:
      contents: write
      actions: read
    secrets: inherit

  perf-32:
    needs: [build-image, pd-glm52, pd-qwen35]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    uses: ./.github/workflows/test-ppu-perf-32.yml
    with:
      ref: ${{ needs.build-image.outputs.source-sha }}
      image_ref: ${{ needs.build-image.outputs.image }}
      image_digest: ${{ needs.build-image.outputs.digest }}
    permissions:
      contents: write
      actions: read
    secrets: inherit

  answer-8:
    needs: [build-image, pd-glm52, pd-qwen35, perf-8, perf-16, perf-32]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    uses: ./.github/workflows/test-ppu-answer.yml
    with:
      ref: ${{ needs.build-image.outputs.source-sha }}
      image_ref: ${{ needs.build-image.outputs.image }}
      image_digest: ${{ needs.build-image.outputs.digest }}
    permissions:
      contents: write
      actions: read
    secrets: inherit

  answer-16:
    needs: [build-image, pd-glm52, pd-qwen35, perf-8, perf-16, perf-32]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    uses: ./.github/workflows/test-ppu-answer-16.yml
    with:
      ref: ${{ needs.build-image.outputs.source-sha }}
      image_ref: ${{ needs.build-image.outputs.image }}
      image_digest: ${{ needs.build-image.outputs.digest }}
    permissions:
      contents: write
      actions: read
    secrets: inherit

  answer-32:
    needs: [build-image, pd-glm52, pd-qwen35, perf-8, perf-16, perf-32]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    uses: ./.github/workflows/test-ppu-answer-32.yml
    with:
      ref: ${{ needs.build-image.outputs.source-sha }}
      image_ref: ${{ needs.build-image.outputs.image }}
      image_digest: ${{ needs.build-image.outputs.digest }}
    permissions:
      contents: write
      actions: read
    secrets: inherit

  accuracy:
    needs: [build-image, pd-glm52, pd-qwen35, perf-8, perf-16, perf-32, answer-8, answer-16, answer-32]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    uses: ./.github/workflows/test-ppu-accuracy.yml
    with:
      ref: ${{ needs.build-image.outputs.source-sha }}
      image_ref: ${{ needs.build-image.outputs.image }}
      image_digest: ${{ needs.build-image.outputs.digest }}
      mode: full
      entries: all
    permissions:
      contents: write
      actions: read
    secrets: inherit

  nightly-test-ppu-finish:
    needs: [build-image, pd-glm52, pd-qwen35, perf-8, perf-16, perf-32, answer-8, answer-16, answer-32, accuracy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful build and every full test family
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_JSON'])
          expected = {'build-image', 'pd-glm52', 'pd-qwen35', 'perf-8', 'perf-16', 'perf-32', 'answer-8', 'answer-16', 'answer-32', 'accuracy'}
          if set(needs) != expected or any(info.get('result') != 'success' for info in needs.values()):
              sys.exit('Every required PPU nightly job must succeed: ' + json.dumps(needs))
          print('Build and all nine full nightly workflows passed.')
          PY

  promote-image:
    needs: [build-image, nightly-test-ppu-finish]
    runs-on: ${{ vars.PPU_NIGHTLY_BUILD_RUNNER || 'ppu' }}
    timeout-minutes: 15
    env:
      PPU_BASE_IMAGE: ${{ needs.build-image.outputs.image }}
      IMAGE_REPOSITORY: ${{ needs.build-image.outputs.repository }}
      SOURCE_SHA: ${{ needs.build-image.outputs.source-sha }}
    steps:
      - name: Select registry
        id: registry
        run: echo "host=${IMAGE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.PPU_ARTIFACTORY_USER }}
          password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
      - name: Refuse to promote an obsolete or non-version revision
        id: current-revision
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/v0.5.18'
            });
            const current = data.object.sha === process.env.SOURCE_SHA;
            core.setOutput('current', String(current));
            if (!current) core.notice('Candidate is not the current v0.5.18 HEAD; latest is unchanged.');
      - name: Promote the tested digest without rebuilding
        if: steps.current-revision.outputs.current == 'true'
        run: |
          [[ "$PPU_BASE_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE_REPOSITORY:v0.5.18-latest" "$PPU_BASE_IMAGE"
          echo "Promoted $PPU_BASE_IMAGE to v0.5.18-latest after all nightly families passed." >> "$GITHUB_STEP_SUMMARY"
