name: Nightly Test (PPU)

# DISPATCH SHIM -- PROBE BRANCH ONLY. Never merge this branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full 40-character source revision to test.'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: shim-ppu-perf32-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  perf32:
    uses: ./.github/workflows/test-ppu-perf-32-k8s.yml
    with:
      ref: "${{ inputs.ref }}"
    secrets: inherit
