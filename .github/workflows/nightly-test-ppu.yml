name: Nightly Test (PPU)

on:
  schedule:
    # 16:00 UTC == 00:00 Beijing. GitHub evaluates cron only on the default
    # branch, so on a version branch this stays dormant and the ladder is
    # exercised by dispatch (or by a default-branch caller).
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-test-ppu-${{ inputs.ref || github.ref }}
  # A cancelled run reports the levels it never reached as "no verdict" rather
  # than as a failure, so a second dispatch queues behind the one on the boards.
  cancel-in-progress: false

permissions:
  contents: read

# Every job runs on the CPU-only K8s runner group and submits a worker pod
# through flytiger-eco/ppu-distributed-action onto a board-type=OAM-810E node,
# as pr-test-ppu.yml does. The container setup lives in
# scripts/ci/ppu/run_nightly_suite_board.sh; only per-level values vary here.
# The four levels are independent jobs -- one failing does not stop the rest --
# and finish settles the ladder by reading every level's result.
#
# Device slices are a division of labour, not a pinning. nproc_per_node is a
# card *count*: a pod sees every card of the node it lands on, and
# NIGHTLY_DEVICE_OFFSET/NIGHTLY_DEVICE_COUNT only decide which of them its
# CUDA_VISIBLE_DEVICES lists (1-ppu: 0, 2-ppu: 2-3, 4-ppu: 0-3, 8-ppu: 0-7).
# Nothing co-schedules the levels onto the board their offsets were chosen for,
# and nothing keeps a neighbour off those indices -- pr-test-ppu runs 1- and
# 2-card pods on these same boards without offsets at all. So the slices stop
# the levels from treading on each other and nothing more; nightly-4-ppu asks
# for all eight cards while running on four because a whole-board request is the
# only thing that actually excludes a neighbour. _wait_for_gpu_idle_in_ci waits
# on this container's own processes and only warns about the rest, so a board
# dirtied by someone else costs a warning rather than a red suite (run
# 40482998667: a 20.84 GiB foreign process on device 4 failed every file of
# nightly-4-ppu in setUpClass).
#
# The sweep in front of each level removes worker pods a cancelled or crashed
# run of the same level left behind -- the pod keeps a server on the card after
# its run is gone. The action's `always()` cleanup is not enough: a job can be
# torn down before that step runs.
#
# The action is pinned to the revision pr-test-ppu.yml uses, not @main, so the
# ladder does not change mid-series (`uses:` cannot read `env:`).
#
# Results travel over the NAS both sides mount: the pod writes under
# /mnt/wl_nas, the runner reads the same bytes under /wl_nas. JIT caches are the
# /wl_nas ones the other lanes on these boards use; model checkpoints and the HF
# cache stay on /nas_aisw, which every board lane reads.
env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.17-py312-20261001
  PPU_SDK_VERSION: 2.2.0

jobs:
  nightly-1-ppu:
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # One job for the whole 1-PPU suite: 64 files, ~74min of in-source est_time.
    # The two LPT partitions this used to be cut into bought ~37min of est each
    # and cost a second pod, a second dependency install and a second device
    # slice to keep clear. Runs 40482998667 and 40468436377 measured the halves
    # at 69/60min and 55/93min including their own install and warm-up, so the
    # whole suite is about their sum less one setup; the watchdog below keeps
    # ~40min over the worse pair, and this adds the 30min every level allows for
    # the pod to be scheduled.
    timeout-minutes: 225
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # fetch-depth 2: ppu_install_dependency.sh detects sgl-kernel source
          # changes via `git diff HEAD~1`.
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      # Never decides the level: without kubectl the sweep is skipped.
      - name: Sweep worker pods left by earlier runs
        continue-on-error: true
        shell: bash
        env:
          PPU_SWEEP_NAMESPACE: ppu-sched
          PPU_SWEEP_JOB: ${{ github.job }}
          PPU_SWEEP_MAX_AGE_HOURS: "6"
        run: bash scripts/ci/ppu/sweep_stale_worker_pods.sh
      - name: Resolve immutable image
        shell: bash
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Observe compute Pod environment
        continue-on-error: true
        shell: bash
        env:
          PPU_ENV_JOB: ${{ github.job }}
          PPU_ENV_NAMESPACE: ppu-sched
          PPU_ENV_EXPECTED_PODS: "1"
          PPU_ENV_OUTPUT: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/nightly-results/environment-pods.tsv
        run: bash scripts/ci/ppu/observe_pod_environment.sh start "$PPU_ENV_OUTPUT"
      - name: Run nightly-1-ppu via K8s
        uses: flytiger-eco/ppu-distributed-action@06c8ee7cadaae2086db4977e571b19f461653f16
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=OAM-810E"
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          command: bash /workspace/source/scripts/ci/ppu/run_nightly_suite_board.sh
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "NIGHTLY_SUITE=nightly-1-ppu,NIGHTLY_DEVICE_COUNT=1,NIGHTLY_DEVICE_OFFSET=0,NIGHTLY_WARM_MODELS=/nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct|/nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-30B-A3B|/nas_aisw/datasets/checkpoints/LLM/deepseek/v2/DeepSeek-V2-Lite-Chat|/nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-0.6B,NIGHTLY_RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/nightly-results,NIGHTLY_TIMEOUT_PER_FILE=1200,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 195
          cleanup_policy: always
      - name: Collect nightly results
        if: always()
        shell: bash
        env:
          NIGHTLY_JOB: ${{ github.job }}
          NIGHTLY_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/nightly-results
        run: bash scripts/ci/ppu/collect_nightly_results.sh
      # Best effort: the verdict has already left this job over the step above's
      # annotations, and a lost upload only costs run.log and its TIMINGS block.
      - name: Upload nightly results
        id: upload_results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-nightly-k8s-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Wait out the artifact egress congestion
        if: always() && steps.upload_results.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Upload nightly results (second attempt)
        if: always() && steps.upload_results.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-nightly-k8s-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-artifacts/
          if-no-files-found: warn
          # v4 refuses a name it already holds, and the first attempt can be
          # reset after it has created the artifact.
          overwrite: true
          retention-days: 30

