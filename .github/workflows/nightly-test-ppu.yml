name: Nightly Test (PPU)

on:
  schedule:
    - cron: '0 16 * * *'  # 0:00 AM Beijing Time (UTC+8) every day
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-test-ppu-${{ inputs.ref || github.ref }}
  # A cancelled run reports the levels it never reached as "no verdict" rather
  # than as a failure, so a second dispatch queues behind the one on the boards
  # instead of replacing it, as the Answer callees do.
  cancel-in-progress: false

permissions:
  contents: read

# The board is no longer reached from a self-hosted `ppu` runner: each job runs
# on the CPU-only K8s runner group and submits a worker pod through
# flytiger-eco/ppu-distributed-action onto a board-type=OAM-810E node, as
# test-ppu-answer.yml and pr-test-ppu.yml do. The container setup lives in
# scripts/ci/ppu/run_nightly_suite_board.sh; only per-partition values vary here.
#
# The five levels are independent jobs, as the seven stages of
# nightly-test-nvidia.yml are: one level failing no longer stops the rest, and
# the ladder's verdict is settled by finish, which reads every level. A level
# claims a pod of its own, so the ladder no longer holds one board for most of a
# day while the board sits idle between levels.
#
# The two one-PPU levels, the two-PPU one and the four-PPU one share a board
# instead of taking four: together they ask for 88 cpus, one board's worth, and
# each claims a device slice of its own (0, 1, 2-3, 4-7) via
# NIGHTLY_DEVICE_OFFSET and NIGHTLY_DEVICE_COUNT, so the CUDA_VISIBLE_DEVICES a
# pod exports lists only its own cards. That is what makes sharing safe:
# nproc_per_node sizes the pod without pinning devices, and
# _wait_for_gpu_idle_in_ci -- the guard that failed nightly-4-ppu on an 83GiB
# neighbour -- inspects only the devices a pod lists. nightly-8-ppu needs all
# eight, so it keeps a board to itself.
#
# The action is pinned to the revision pr-test-ppu.yml uses, not @main, so the
# nightly ladder does not change mid-series (`uses:` cannot read `env:`).
#
# Around the action each job body does what the Answer board jobs do: observe
# the pod that is claimed, then carry the suite's log off the NAS and upload it
# with the same two-attempt upload. The pod writes that copy under /mnt/wl_nas
# and the runner reads the same bytes under /wl_nas.
#
# The caches are the /wl_nas ones every other lane on these boards uses; the
# /nas_aisw tree this file used to name belongs to the retired docker runner,
# which no longer exists on this path.
env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.17-py312-20261001
  PPU_SDK_VERSION: 2.2.0

jobs:
  nightly-1a-ppu:
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 155
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # fetch-depth 2: ppu_install_dependency.sh detects sgl-kernel source
          # changes via `git diff HEAD~1`.
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Resolve immutable image
        shell: bash
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Observe compute Pod environment
        continue-on-error: true
        shell: bash
        env:
          PPU_ENV_JOB: ${{ github.job }}
          PPU_ENV_NAMESPACE: ppu-sched
          PPU_ENV_EXPECTED_PODS: "1"
          PPU_ENV_OUTPUT: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/nightly-results/environment-pods.tsv
        run: bash scripts/ci/ppu/observe_pod_environment.sh start "$PPU_ENV_OUTPUT"
      - name: Run nightly-1-ppu partition 1/2 via K8s
        uses: flytiger-eco/ppu-distributed-action@06c8ee7cadaae2086db4977e571b19f461653f16
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=OAM-810E"
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          command: bash /workspace/source/scripts/ci/ppu/run_nightly_suite_board.sh
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "NIGHTLY_SUITE=nightly-1-ppu,NIGHTLY_DEVICE_COUNT=1,NIGHTLY_DEVICE_OFFSET=0,NIGHTLY_PARTITION_ID=0,NIGHTLY_PARTITION_SIZE=2,NIGHTLY_MARLIN_PRELOAD=false,NIGHTLY_WARM_MODELS=/nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct|/nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-30B-A3B|/nas_aisw/datasets/checkpoints/LLM/deepseek/v2/DeepSeek-V2-Lite-Chat|/nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-0.6B,NIGHTLY_RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/nightly-results,NIGHTLY_TIMEOUT_PER_FILE=1200,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 125
          cleanup_policy: always
      - name: Collect nightly results
        if: always()
        shell: bash
        env:
          NIGHTLY_JOB: ${{ github.job }}
          NIGHTLY_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/nightly-results
        run: bash scripts/ci/ppu/collect_nightly_results.sh
      # Best effort: the verdict has already left this job over the annotations
      # the step above prints, so a reset on the github egress here must not turn
      # a passing suite red. What a lost upload costs is the copy that exists
      # nowhere else -- run.log with the per-file TIMINGS block.
      - name: Upload nightly results
        id: upload_results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-nightly-k8s-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Wait out the artifact egress congestion
        if: always() && steps.upload_results.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Upload nightly results (second attempt)
        if: always() && steps.upload_results.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-nightly-k8s-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-artifacts/
          if-no-files-found: warn
          # The first attempt can be reset after it has created the artifact,
          # and v4 refuses a name it already holds.
          overwrite: true
          retention-days: 30

  nightly-1b-ppu:
    runs-on: k8s-runner-group-cpu-flytiger
    container:
