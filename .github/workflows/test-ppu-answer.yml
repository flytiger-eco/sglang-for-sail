name: Answer Test (PPU K8s)

# THROWAWAY PROBE SHIM — trimmed to the single glm5.2-w8a8-int8 board.
# NOT FOR MERGE. Only the glm52-w8a8 job is kept; every other entry job has
# been removed so this callee stages just one board.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''

concurrency:
  group: test-ppu-answer-k8s-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312

jobs:
  glm52-w8a8:
    name: glm5.2-w8a8-int8 (btv1.5)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 300
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Run glm5.2-w8a8-int8 via K8s
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          image: ${{ env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          command: bash /workspace/source/scripts/ci/ppu/run_answer_suite_board.sh
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},GITHUB_REPOSITORY=${{ github.repository }},GITHUB_RUN_ID=${{ github.run_id }},GITHUB_RUN_ATTEMPT=${{ github.run_attempt }},GITHUB_SERVER_URL=${{ github.server_url }},ANSWER_SUITE=nightly-answer-8-glm52-ppu,ANSWER_TIMEOUT_PER_FILE=14400,SGLANG_PPU_ANSWER_TEST_CONFIG=/workspace/source/test/registered/ppu/answer_eval/configs/glm5.2/w8a8-int8-144g.json,SGLANG_PPU_ANSWER_RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/glm5.2-w8a8-int8"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 270
      - name: Collect Answer evidence
        if: always()
        shell: bash
        env:
          ENTRY: glm5.2-w8a8-int8
          ANSWER_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/glm5.2-w8a8-int8
        run: bash scripts/ci/ppu/collect_answer_evidence.sh
      - name: Upload Answer evidence
        id: upload_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-answer-k8s-glm5.2-w8a8-int8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-answer-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Wait out the artifact egress congestion
        if: always() && steps.upload_evidence.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Upload Answer evidence (second attempt)
        if: always() && steps.upload_evidence.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-answer-k8s-glm5.2-w8a8-int8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-answer-artifacts/
          if-no-files-found: warn
          # The first attempt can be reset after it has created the
          # artifact, and v4 refuses a name it already holds.
          overwrite: true
          retention-days: 30
