name: Answer Test (PPU K8s)

on:
  # No schedule. GitHub only honours cron from the repository's default branch,
  # and this file lives on a version branch, so a cron here would never fire
  # and would misdescribe the workflow as scheduled. The btv1.5 line is
  # therefore dispatched: by hand, or by a caller through workflow_call.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''

concurrency:
  group: test-ppu-answer-k8s-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

# One job per entry, and the entries that share a board queue behind each other
# through `needs` rather than through a matrix. This is not a style choice.
# flytiger-eco/ppu-distributed-action builds both the NAS path it stages the
# source to, /wl_nas/devops/<run>-<attempt>/$GITHUB_JOB/, and the name of the
# K8s job it submits, ppu-<owner>-<run>-<attempt>-<job>, out of the job id --
# which every leg of one matrix shares, since a matrix leg is not a separate
# job id. At max-parallel 1 that is harmless, because the action cleans both up
# before the next leg starts, and that is how the first three entries were
# verified. At max-parallel 8 all twelve legs staged into one directory and
# every one of them failed inside two minutes: git's pack files are mode 444,
# so the second leg to copy one hit EPERM (run 34082162222). Even had the copy
# succeeded they would have submitted twelve pods under one K8s job name and
# each leg's cleanup would have deleted the others' pods. A job-level `env:`
# entry cannot paper over it: GITHUB_JOB is set by the runner and a workflow
# env of the same name does not win (measured, run 34084233664), and the K8s
# job name comes from an expression the action fixes at step level, which no
# caller can reach. So the entries that run at the same time have to be
# different jobs, and eight lanes give the same eight-wide cluster request the
# matrix was asking for. `needs` plus `!cancelled()` is the fail-fast: false of
# this shape -- a lane's second entry runs on its predecessor's verdict, good or
# bad, so one model's failure never suppresses another's evidence, while a
# cancelled run stops claiming boards.
#
# The lanes pair a long entry with a short one where they can. `entry` is what
# keeps configs apart -- in the job name, in the report path and in the artifact
# name -- because `suite` no longer identifies one: three GLM configs and three
# Qwen3.5 configs each share a suite, differing only in which checkpoint the
# config names. A suite is what `--suite` selects, so configs of one model share
# a suite and different models never do; see the docstring of each registered
# file.
#
# Every job body is the same three steps, so they live in a local composite
# action instead of twelve copies here; what varies is in `with`.
env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312

jobs:
  # Lane A: the single-card entry first, so a break in the shared serving path
  # shows up in minutes rather than after a 116 GiB load.
  qwen38-27b-bf16:
    name: qwen3.8-27b-bf16 (btv1.5)
    # The orchestration shell is CPU-only and holds no device; the action
    # submits a worker pod onto a board that carries the requested label.
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # fetch-depth 2: ppu_install_dependency.sh detects sgl-kernel source
          # changes via `git diff HEAD~1`.
          fetch-depth: 2
      - name: Run qwen3.8-27b-bf16
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: qwen3.8-27b-bf16
          suite: nightly-answer-1-ppu
          config: test/registered/ppu/answer_eval/configs/qwen3.8/27b-bf16-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 120
          timeout_per_file: 2400
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}

  # 116 GiB of weights, and the smallest of the new entries; it also cannot be
  # asked not to think, so its ten answers are what dominates its budget rather
  # than its load.
  minimax27-mxfp4:
    name: minimax2.7-mxfp4-fp8 (btv1.5)
    needs: qwen38-27b-bf16
    if: ${{ !cancelled() }}
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2
      - name: Run minimax2.7-mxfp4-fp8
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: minimax2.7-mxfp4-fp8
          suite: nightly-answer-8-minimax27-ppu
          config: test/registered/ppu/answer_eval/configs/minimax2.7/mxfp4-fp8-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 270
          timeout_per_file: 14400
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}

  # Lane B: the one entry already verified on this board, and the longest single
  # budget here, so it runs alone.
  qwen35-397b-w8a8:
    name: qwen3.5-397b-w8a8-int8 (btv1.5)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2
      - name: Run qwen3.5-397b-w8a8-int8
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: qwen3.5-397b-w8a8-int8
          suite: nightly-answer-8-ppu
          config: test/registered/ppu/answer_eval/configs/qwen3.5/397b-a17b-w8a8-int8-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 330
          timeout_per_file: 14400
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}

  # Lanes C and D: 704 GiB each, the largest single-board checkpoints here. The
  # warm alone reads them for roughly fifty minutes before the load starts, so
  # neither shares a lane.
  glm52-w8a8:
    name: glm5.2-w8a8-int8 (btv1.5)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2
      - name: Run glm5.2-w8a8-int8
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: glm5.2-w8a8-int8
          suite: nightly-answer-8-glm52-ppu
          config: test/registered/ppu/answer_eval/configs/glm5.2/w8a8-int8-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 270
          timeout_per_file: 14400
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}

  glm52-fp8-chan:
    name: glm5.2-fp8-channelwise (btv1.5)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2
      - name: Run glm5.2-fp8-channelwise
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: glm5.2-fp8-channelwise
          suite: nightly-answer-8-glm52-ppu
          config: test/registered/ppu/answer_eval/configs/glm5.2/fp8-channelwise-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 270
          timeout_per_file: 14400
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}

  # Lane E: the two remaining Qwen3.5 formats, same checkpoint family and the
  # same 210-minute budget.
  qwen35-397b-mxfp4:
    name: qwen3.5-397b-mxfp4-fp8 (btv1.5)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2
      - name: Run qwen3.5-397b-mxfp4-fp8
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: qwen3.5-397b-mxfp4-fp8
          suite: nightly-answer-8-ppu
          config: test/registered/ppu/answer_eval/configs/qwen3.5/397b-a17b-mxfp4-fp8-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 210
          timeout_per_file: 10800
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}

  qwen35-397b-fp8-chan:
    name: qwen3.5-397b-fp8-channelwise (btv1.5)
    needs: qwen35-397b-mxfp4
    if: ${{ !cancelled() }}
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2
      - name: Run qwen3.5-397b-fp8-channelwise
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: qwen3.5-397b-fp8-channelwise
          suite: nightly-answer-8-ppu
          config: test/registered/ppu/answer_eval/configs/qwen3.5/397b-a17b-fp8-channelwise-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 210
          timeout_per_file: 10800
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}

  # Lane F: the smaller GLM format, then the remaining MiniMax one.
  glm52-mxfp4:
    name: glm5.2-mxfp4-fp8 (btv1.5)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2
      - name: Run glm5.2-mxfp4-fp8
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: glm5.2-mxfp4-fp8
          suite: nightly-answer-8-glm52-ppu
          config: test/registered/ppu/answer_eval/configs/glm5.2/mxfp4-fp8-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 210
          timeout_per_file: 10800
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}

  minimax27-fp8-chan:
    name: minimax2.7-fp8-channelwise (btv1.5)
    needs: glm52-mxfp4
    if: ${{ !cancelled() }}
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2
      - name: Run minimax2.7-fp8-channelwise
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: minimax2.7-fp8-channelwise
          suite: nightly-answer-8-minimax27-ppu
          config: test/registered/ppu/answer_eval/configs/minimax2.7/fp8-channelwise-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 270
          timeout_per_file: 14400
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}

  # Lane G: both single-board Kimi formats, one after the other.
  kimi26-w4a8:
    name: kimi2.6-w4a8-int8 (btv1.5)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2
      - name: Run kimi2.6-w4a8-int8
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: kimi2.6-w4a8-int8
          suite: nightly-answer-8-kimi26-ppu
          config: test/registered/ppu/answer_eval/configs/kimi2.6/w4a8-int8-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 210
          timeout_per_file: 10800
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}

  kimi26-mxfp4:
    name: kimi2.6-mxfp4-fp8 (btv1.5)
    needs: kimi26-w4a8
    if: ${{ !cancelled() }}
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2
      - name: Run kimi2.6-mxfp4-fp8
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: kimi2.6-mxfp4-fp8
          suite: nightly-answer-8-kimi26-ppu
          config: test/registered/ppu/answer_eval/configs/kimi2.6/mxfp4-fp8-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 210
          timeout_per_file: 10800
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}

  # Lane H: the last MiniMax format, alone, so eight boards are asked for and
  # not nine.
  minimax27-w8a8:
    name: minimax2.7-w8a8-int8 (btv1.5)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2
      - name: Run minimax2.7-w8a8-int8
        uses: ./.github/actions/ppu-answer-entry
        with:
          entry: minimax2.7-w8a8-int8
          suite: nightly-answer-8-minimax27-ppu
          config: test/registered/ppu/answer_eval/configs/minimax2.7/w8a8-int8-144g.json
          image: ${{ env.PPU_BASE_IMAGE }}
          pod_timeout_minutes: 270
          timeout_per_file: 14400
          artifactory_user: ${{ secrets.PPU_ARTIFACTORY_USER }}
          artifactory_password: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
