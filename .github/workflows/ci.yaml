name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Ignored review events use a per-run suffix so they cannot cancel active PR CI.
  group: >-
    ci-${{ github.event.pull_request.number }}-${{
    github.event_name == 'pull_request_review' &&
    (github.event.review.state != 'approved' || github.event.review.user.type == 'Bot') &&
    github.run_id || 'active' }}
  cancel-in-progress: true

jobs:
  # Stage 1: 密钥扫描预检（组织级 reusable workflow）
  precheck:
    name: Pre-check
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.state == 'approved' && github.event.review.user.type != 'Bot')
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  # Stage 2: 注册完整性校验与 AI 评审并行
  registration-validation:
    name: Registration Validation
    needs: precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate registered tests
        run: python3 scripts/lint/check_registered_tests.py

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # Stage 3: 人工审批门禁
  human-review:
    name: Human Review Gate
    needs: [registration-validation, ai-code-review]
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  # Stage 4: 完整业务 CI —— 人工审批通过后，经 workflow_call 串起完整 PPU 套件。
  # 被调 workflow 继承本 workflow 的 pull_request 事件，其 run-ci label 门禁会默认
  # 静默跳过全部作业，故显式传 require_run_ci_label: false 绕过（human-review 已放行）。
  # 同仓 ./ 引用：被调方从本次 commit（PR merge ref）加载；不额外传 ref，其
  # `inputs.ref || github.ref` 回退到 PR merge ref。PPU_ARTIFACTORY 凭据经
  # secrets: inherit 传递。
  ci:
    name: Full CI
    needs: human-review
    uses: ./.github/workflows/pr-test-ppu.yml
    with:
      require_run_ci_label: false
    secrets: inherit
