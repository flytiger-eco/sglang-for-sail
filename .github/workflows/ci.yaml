name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Stage 1: 密钥扫描预检（组织级 reusable workflow）
  precheck:
    name: Pre-check
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  # Stage 2: 冒烟测试 与 AI 评审 并行
  smoke-test:
    name: Smoke Test
    needs: precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        run: |
          echo "在此替换为你的冒烟测试命令"

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # Stage 3: 人工审批门禁
  human-review:
    name: Human Review Gate
    needs: [smoke-test, ai-code-review]
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  # Stage 4: 完整业务 CI —— 人工审批通过后，经 workflow_call 串起完整 PPU 套件。
  # 被调 workflow 继承本 workflow 的 pull_request 事件，其 run-ci label 门禁会默认
  # 静默跳过全部作业，故显式传 require_run_ci_label: false 绕过（human-review 已放行）。
  # 同仓 ./ 引用：被调方从本次 commit（PR merge ref）加载；不额外传 ref，其
  # `inputs.ref || github.ref` 回退到 PR merge ref。PPU_ARTIFACTORY 凭据经
  # secrets: inherit 传递。
  ci:
    name: Full CI
    needs: human-review
    uses: ./.github/workflows/pr-test-ppu.yml
    with:
      require_run_ci_label: false
    secrets: inherit
