name: Nightly Accuracy Test (PPU)

# 保留手动入口；定时调度和全局锁只由 global 持有，避免嵌套自锁。
# 同一提交中的 global 解析源码 SHA，测试定义继续使用 @v0.5.18。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Code ref (branch, tag, or SHA) to check out in-pod. Defaults to v0.5.18.'
        required: false
        type: string
        default: ''
      mode:
        description: 'Accuracy 模式：smoke 为 20 条样本，full 为完整数据集。'
        required: false
        type: choice
        options: [full, smoke, both]
        default: full
      entries:
        description: 'Accuracy 条目，逗号分隔或 all；留空保留单条默认行为。'
        required: false
        type: string
        default: ''
      dataset_dir:
        description: '覆盖 Accuracy 配置中的已准备数据集目录。'
        required: false
        type: string
        default: ''

# 权限须覆盖 global；Accuracy 测试 job 自身仍仅有 contents: read。
permissions:
  contents: write
  actions: read

jobs:
  accuracy:
    uses: ./.github/workflows/nightly-test-ppu-global.yml
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      suite: accuracy
      mode: ${{ inputs.mode || 'full' }}
      entries: ${{ inputs.entries }}
      dataset_dir: ${{ inputs.dataset_dir }}
    secrets: inherit
