name: Nightly Accuracy Test (PPU)

# Default-branch scheduler for the btv1.5 Accuracy (evalscope) line. GitHub
# evaluates `schedule` only on the repository's default branch, so the cron that
# actually drives the nightly run has to live here on `main`. The accuracy
# harness itself -- the reusable workflow, the evalscope suites and the board
# scripts/configs -- does not: it lives on the `v0.5.18` product line, which is
# what we want the nightly to exercise. So this file stays deliberately thin. It
# owns no runner and runs no test; it only fans out to the reusable Accuracy
# workflow and pins it to `v0.5.18`.
#
# Two things are pinned to v0.5.18, for two different reasons:
#   * `uses: .../test-ppu-accuracy.yml@v0.5.18` resolves the callee workflow
#     *definition* from the v0.5.18 tip. A local `uses: ./` would resolve it from
#     this commit on `main`, where the file does not exist; and `uses:` cannot
#     take an expression, so the ref is the literal branch name and tracks its
#     tip. This keeps the whole harness single-sourced on v0.5.18 with no copy to
#     drift against.
#   * `ref: v0.5.18` is passed down so the callee's in-pod checkout stages the
#     v0.5.18 *code* (scripts, configs) -- without it the callee would fall back
#     to github.sha, i.e. this main commit, and test the wrong tree.
#
# `mode: full` and `entries: all` are passed so the nightly exercises every
# registered entry over its whole split; the callee's own defaults (mode full,
# entries empty) would otherwise run only glm52-fp8chan-gsm8k. Unlike the Perf
# and PD-Perf lines, the Accuracy line does not push trend rows to the
# `nightly-test-data` branch: each entry is judged in-pod against the
# `evaluation.baseline` recorded in its config and its evidence is uploaded as a
# run artifact, so this scheduler needs only read permission.
#
# A manual dispatch may override the code ref (the callee definition stays at
# v0.5.18); a scheduled run leaves inputs.ref empty and it defaults to v0.5.18.

on:
  schedule:
    # 16:00 UTC == 00:00 Beijing (UTC+8). Shares the slot with the Answer, Perf
    # and PD-Perf schedulers: the btv1.5 boards are dedicated test hardware
    # available around the clock, so the lines are allowed to start together and
    # the cluster serialises whatever cannot run at once.
    - cron: '0 16 * * *'  # 00:00 Beijing Time (UTC+8) every day
  workflow_dispatch:
    inputs:
      ref:
        description: 'Code ref (branch, tag, or SHA) to check out in-pod. Defaults to v0.5.18.'
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-test-ppu-accuracy-${{ inputs.ref || 'v0.5.18' }}
  cancel-in-progress: true

# The Accuracy callee declares only `contents: read` -- it uploads evidence
# artifacts and pushes nothing to the data branch -- so read is all this
# scheduler needs to grant. `workflow_call` caps the callee's permissions at the
# caller's grant, so this must not be narrower than what the callee declares.
permissions:
  contents: read

jobs:
  # A single caller: test-ppu-accuracy.yml runs one job per registered entry
  # internally (never a matrix), and the cluster serialises whatever cannot run
  # at once. `secrets: inherit` hands down the PPU artifactory credentials the
  # pods need.
  accuracy:
    name: Accuracy (all entries, full)
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-accuracy.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      mode: full
      entries: all
    secrets: inherit
