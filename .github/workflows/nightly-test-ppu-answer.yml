name: Nightly Answer Test (PPU)

# Default-branch scheduler for the btv1.5 Answer line. GitHub evaluates `schedule`
# only on the repository's default branch, so the cron that actually drives the
# nightly run has to live here on `main`. The Answer test harness itself -- the
# three reusable workflows, the board scripts, the eval configs and baselines --
# does not: it lives on the `v0.5.18` product line, which is what we want the
# nightly to exercise. So this file stays deliberately thin. It owns no runner
# and runs no test; it only fans out to the three reusable Answer workflows and
# pins them to `v0.5.18`.
#
# Two things are pinned to v0.5.18, for two different reasons:
#   * `uses: .../test-ppu-answer*.yml@v0.5.18` resolves the callee workflow
#     *definition* from the v0.5.18 tip. A local `uses: ./` would resolve it from
#     this commit on `main`, where the file does not exist; and `uses:` cannot
#     take an expression, so the ref is the literal branch name and tracks its
#     tip. This keeps the whole harness single-sourced on v0.5.18 with no copy to
#     drift against.
#   * `ref: v0.5.18` is passed down so each callee's in-pod checkout stages the
#     v0.5.18 *code* (scripts, configs, baselines) -- without it the callee would
#     fall back to github.sha, i.e. this main commit, and test the wrong tree.
#
# A manual dispatch may override the code ref (the callee definition stays at
# v0.5.18); a scheduled run leaves inputs.ref empty and both default to v0.5.18.

on:
  schedule:
    # 21:00 UTC == 05:00 Beijing, offset from nightly-test-ppu.yml (0 16 * * *)
    # so the two nightly lines do not start together.
    - cron: '0 21 * * *'  # 5:00 AM Beijing Time (UTC+8) every day
  workflow_dispatch:
    inputs:
      ref:
        description: 'Code ref (branch, tag, or SHA) to check out in-pod. Defaults to v0.5.18.'
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-test-ppu-answer-${{ inputs.ref || 'v0.5.18' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # No `needs` between the three: the boards they claim are disjoint (a single
  # board, two nodes, four nodes), so they are dispatched together and the
  # cluster schedules each as capacity frees. A failure in one does not cancel
  # the others -- one model line's verdict must not suppress another's evidence.
  # `secrets: inherit` hands down the PPU artifactory credentials the pods need.
  answer-single-board:
    name: Answer (single board)
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-answer.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
    secrets: inherit

  answer-two-node:
    name: Answer (two nodes)
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-answer-16.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
    secrets: inherit

  answer-four-node:
    name: Answer (four nodes)
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-answer-32.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
    secrets: inherit
