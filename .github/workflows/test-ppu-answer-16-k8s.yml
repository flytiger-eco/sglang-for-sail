name: Answer Test 16-PPU (PPU K8s)

on:
  # Dispatch only, and deliberately not wired into any nightly caller yet: each
  # entry here claims two whole ZW-M890P boards, and neither has had a measured
  # run. This becomes a scheduled line once one has passed, not before.
  #
  # It is a workflow of its own rather than two more entries in the btv1.5 matrix
  # for the same reason the four-node one is: that matrix is the routinely
  # dispatched path and every entry in it claims one board, so sharing it would
  # make each dispatch ask the cluster for two more. The pod command below is the
  # four-node workflow's, differing only in the node count, the suite and the
  # config; it is duplicated rather than extracted, and the extraction is worth
  # doing once both multi-node lines have a green run to extract from.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''

concurrency:
  group: test-ppu-answer-16-k8s-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312

jobs:
  answer-16-k8s:
    name: ${{ matrix.suite }} / ${{ matrix.entry }} (btv1.5)
    # The orchestration shell is CPU-only and holds no device; the action
    # gang-schedules two worker pods, each onto a board carrying the label.
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    strategy:
      fail-fast: false
      # One entry at a time: each claims two boards, and both at once would hold
      # four of them for hours against a cluster whose single-board matrix already
      # asks for eight.
      max-parallel: 1
      matrix:
        include:
          # 1272.1 GiB over two nodes at tp 8 x pp 2.
          - entry: qwen3.8-2.4t-a95b-mxfp4-fp8
            suite: nightly-answer-16-ppu
            config: test/registered/ppu/answer_eval/configs/qwen3.8/2.4t-a95b-mxfp4-fp8-144g.json
            job_timeout_minutes: 270
            pod_timeout_minutes: 240
            timeout_per_file: 14400
          # 968.3 GiB of INT8, which is 84 per cent of one node's device memory
          # and the reason this one is here rather than in the single-board
          # matrix.
          - entry: kimi2.6-w8a8-int8
            suite: nightly-answer-16-kimi26-ppu
            config: test/registered/ppu/answer_eval/configs/kimi2.6/w8a8-int8-144g-2n.json
            job_timeout_minutes: 270
            pod_timeout_minutes: 240
            timeout_per_file: 14400
    # Bounded by the config's own startup budget, which is what a cold load off
    # the NAS is allowed to take, plus the ten cases at their timeout ceiling and
    # the dependency install. The first measured run is what should replace these
    # numbers.
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    env:
      ANSWER_SUITE: ${{ matrix.suite }}
      ANSWER_CONFIG: ${{ matrix.config }}
      # Same NAS-as-transport arrangement as the single-board workflow: the pod
      # writes under /mnt/wl_nas and this shell reads the same bytes under
      # /wl_nas. Here the directory carries a second load -- it is also how the
      # two nodes address each other, for the rendezvous address, the device
      # inventories and rank 0's completion -- so it must be the same path in
      # every pod, which is why the test refuses a relative one. The entry name
      # keeps two matrix entries from meeting in one rendezvous directory.
      ANSWER_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/${{ matrix.entry }}
      ANSWER_RESULTS_IN_POD: /mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/${{ matrix.entry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # fetch-depth 2: ppu_install_dependency.sh detects sgl-kernel source
          # changes via `git diff HEAD~1`.
          fetch-depth: 2

      - name: Run ${{ matrix.suite }} via K8s
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          image: ${{ env.PPU_BASE_IMAGE }}
          # Two nodes of eight, gang-scheduled: the action turns nnodes > 1 into
          # a PodGroup with minMember 2, so the group either gets both boards or
          # waits, rather than one pod holding eight devices while the other
          # never arrives. Eight per node is the whole board, which is what both
          # configs' tp 8 x pp 2 needs and the only fence that keeps a second pod
          # off a board this run has already claimed. Two boards is what each of
          # these checkpoints needs and no more: 1272.1 GiB and 968.3 GiB against
          # a 1843 GiB static pool at mem_fraction_static 0.8, where the
          # single-board pool of 921 GiB holds neither.
          nnodes: 2
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          command: |
            mkdir -p ~/.pip && cat > ~/.pip/pip.conf << 'PIPEOF'
            [global]
            index-url = https://mirrors.aliyun.com/pypi/simple/
            trusted-host = mirrors.aliyun.com
            PIPEOF
            set -e
            cd /workspace/source
            git config --global --add safe.directory /workspace/source
            SGLANG_PPU_SOURCE_REVISION=$(git rev-parse HEAD)
            export SGLANG_PPU_SOURCE_REVISION
            # First thing after the checkout is in place, and before the install:
            # rank 0 publishes the address the group meets at, so the other node
            # never waits on rank 0's install, only on its own. The address the
            # action injects as MASTER_ADDR is a *.svc.cluster.local name these
            # hostNetwork pods cannot resolve, so this override is what the
            # rendezvous actually uses -- see the script's own header.
            SGLANG_PPU_ANSWER_DIST_INIT_ADDR=$(bash scripts/ci/ppu/answer_rendezvous.sh "$SGLANG_PPU_ANSWER_RESULTS_DIR/ranks")
            export SGLANG_PPU_ANSWER_DIST_INIT_ADDR
            # And the GID the RoCE data path must use. Left to itself pccl picks
            # index 0 here, the link-local address formed from the bond's MAC,
            # which does not cross the fabric between two nodes: the group
            # builds its queue pairs over the out-of-band TCP channel, logs
            # "Connected all rings", then dies on its first payload with
            # IBV_WC_RETRY_EXC_ERR. Measured on these boards, only the RoCE v2
            # entry of the routable fd03::/8 address carries traffic, and the
            # script derives its index rather than hard-coding it -- see the
            # script's own header for the full sweep. It fails loudly rather
            # than letting the group start on a GID that silently drops.
            NCCL_IB_GID_INDEX=$(bash scripts/ci/ppu/answer_gid_index.sh)
            export NCCL_IB_GID_INDEX
            CUDA_VISIBLE_DEVICES=$(python3 -c "import json, os; print(','.join(str(int(device)) for device in json.load(open(os.environ['SGLANG_PPU_ANSWER_TEST_CONFIG']))['hardware']['visible_devices']))")
            export CUDA_VISIBLE_DEVICES
            ANSWER_MODEL_PATH=$(python3 -c "import json, os; print(json.load(open(os.environ['SGLANG_PPU_ANSWER_TEST_CONFIG']))['model']['path'])")
            echo "source revision: $SGLANG_PPU_SOURCE_REVISION"
            echo "test config:     $SGLANG_PPU_ANSWER_TEST_CONFIG"
            echo "node rank:       ${NODE_RANK:-0} of ${NNODES:-1} on ${NODE_NAME:-an unnamed node}"
            echo "rendezvous:      $SGLANG_PPU_ANSWER_DIST_INIT_ADDR"
            echo "RoCE GID index:  $NCCL_IB_GID_INDEX"
            echo "visible devices: $CUDA_VISIBLE_DEVICES"
            echo "checkpoint:      $ANSWER_MODEL_PATH"
            bash scripts/ci/ppu/ppu_install_dependency.sh
            JIT_MTIME=$(git log -1 --format=%ct 2>/dev/null || echo 0)
            if [ "$JIT_MTIME" != 0 ]; then
              find python/sglang/jit_kernel -type f -exec touch -d @$JIT_MTIME {} +
              echo 'Pinned JIT source mtimes'
            fi
            # No page-cache warm here, as on the four-node entry, though for a
            # different reason: either checkpoint does fit in one node's 2266 GiB
            # of memory, but under pp 2 each node loads roughly its own half, so a
            # warm of the whole tree would read twice what the node needs and
            # double this run's NAS traffic. Whether a warm of the half would pay
            # is unmeasured, and there is no per-node shard list to warm from at
            # this point; the config's startup budget is what the first run tests.
            cd test
            # Routed through run_suite.py, as the single-board entries are, so the
            # executed set is exactly what register_ppu_ci declares; the wrapper
            # around it only keeps this node's log and its exit status, both of
            # which the action would otherwise lose for every node but worker-0.
            # No --continue-on-error: an Answer-quality regression must turn the
            # run red.
            bash ../scripts/ci/ppu/run_answer_suite_node.sh \
              ${{ env.ANSWER_SUITE }} ${{ matrix.timeout_per_file }} "$SGLANG_PPU_ANSWER_RESULTS_DIR/ranks"
          host_volumes: "/nas_aisw/cache/sglang-jit-ci:/root/.cache/tvm-ffi"
          extra_env: "SGLANG_IS_IN_CI=true,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},GITHUB_REPOSITORY=${{ github.repository }},GITHUB_RUN_ID=${{ github.run_id }},GITHUB_RUN_ATTEMPT=${{ github.run_attempt }},GITHUB_SERVER_URL=${{ github.server_url }},SGLANG_PPU_ANSWER_TEST_CONFIG=/workspace/source/${{ env.ANSWER_CONFIG }},SGLANG_PPU_ANSWER_INCLUDE_RAW_OUTPUTS=1,SGLANG_PPU_ANSWER_RESULTS_DIR=${{ env.ANSWER_RESULTS_IN_POD }}"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: ${{ matrix.pod_timeout_minutes }}

      # Read, not moved: the pods write as root and this shell is a different,
      # non-root uid, so an rm here fails with EPERM on every file and turns the
      # step red even when the suite passed. What the copy brings back is rank
      # 0's verdict plus, under ranks/, the address the group met at, one device
      # inventory per node, each node's own log and each node's exit code.
      - name: Collect Answer evidence
        if: always()
        shell: bash
        env:
          SUITE: ${{ env.ANSWER_SUITE }}
        run: |
          set -euo pipefail
          destination="${GITHUB_WORKSPACE}/ppu-answer-artifacts"
          mkdir -p "${destination}"
          if [ -d "${ANSWER_RESULTS_ON_RUNNER}" ]; then
            cp -a "${ANSWER_RESULTS_ON_RUNNER}/." "${destination}/"
          else
            echo "::warning::the group produced no Answer report at ${ANSWER_RESULTS_ON_RUNNER}"
          fi
          # A node's exit code is a workflow-level fact the report cannot carry:
          # rank 0's verdict is written before the worker is released, so a
          # worker that then failed is only visible here and in its own log.
          for status_file in "${destination}"/ranks/rank-*.status; do
            [ -f "${status_file}" ] || continue
            node=$(basename "${status_file}" .status)
            code=$(cat "${status_file}" || echo "unreadable")
            if [ "${code}" = "0" ]; then
              echo "::notice::${SUITE}: ${node} exited 0"
            else
              echo "::error::${SUITE}: ${node} exited ${code}"
            fi
          done
          if [ -f "${destination}/summary.md" ]; then
            # Annotations are what a reader of this run page actually gets here:
            # this runner drives the job through a container hook that does not
            # share the job container's filesystem with the runner process, so
            # bytes written to GITHUB_STEP_SUMMARY inside the container are
            # dropped without an error. Annotations travel over this step's
            # stdout, which does reach the runner.
            #
            # The failing cases are read back from summary.md rather than from
            # result.json because this container is not guaranteed a JSON parser
            # -- no python3, no jq. render_summary emits one bullet per failing
            # case prefixed with "- `", a prefix no other line in that document
            # has, and the evaluator's unit tests lock that shape.
            while IFS= read -r failure; do
              echo "::error::${SUITE}: ${failure#- }"
            done < <(grep '^- `' "${destination}/summary.md" || true)
            counts=$(grep '^- Cases: ' "${destination}/summary.md" | head -1 || true)
            if [ -n "${counts}" ]; then
              echo "::notice::${SUITE}: ${counts#- }"
            fi
            cat "${destination}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Answer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-answer-k8s-16-${{ matrix.entry }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-answer-artifacts/
          if-no-files-found: warn
          retention-days: 30
