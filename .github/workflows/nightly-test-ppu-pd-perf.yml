name: Nightly PD Perf Test (PPU)

# Default-branch scheduler for the btv1.5 Prefill/Decode-disaggregated
# Performance line. GitHub evaluates `schedule` only on the repository's default
# branch, so the cron that actually drives the nightly run has to live here on
# `main`. The PD-perf harness itself -- the two reusable workflows and the board
# scripts/configs -- does not: it lives on the `v0.5.18` product line, which is
# what we want the nightly to exercise. So this file stays deliberately thin. It
# owns no runner and runs no test; it only fans out to the two reusable PD-perf
# workflows and pins them to `v0.5.18`.
#
# Two things are pinned to v0.5.18, for two different reasons:
#   * `uses: .../test-ppu-pd-perf-*.yml@v0.5.18` resolves the callee workflow
#     *definition* from the v0.5.18 tip. A local `uses: ./` would resolve it from
#     this commit on `main`, where the file does not exist; and `uses:` cannot
#     take an expression, so the ref is the literal branch name and tracks its
#     tip. This keeps the whole harness single-sourced on v0.5.18 with no copy to
#     drift against.
#   * `ref: v0.5.18` is passed down so each callee's in-pod checkout stages the
#     v0.5.18 *code* (scripts, configs) -- without it the callee would fall back
#     to github.sha, i.e. this main commit, and test the wrong tree.
#
# Each reusable PD-perf workflow serves one checkpoint per invocation (its
# `pd_config` input selects which), so a full nightly of both model families
# across both quantisations is four caller jobs, not two: GLM-5.2 and Qwen3.5,
# each at fp8-channelwise and mxfp4-fp8. This matches the four PD-perf series the
# `nightly-test-data` branch already carries.
#
# A manual dispatch may override the code ref (the callee definition stays at
# v0.5.18); a scheduled run leaves inputs.ref empty and both default to v0.5.18.

on:
  schedule:
    # 16:00 UTC == 00:00 Beijing (UTC+8). Shares the slot with the Answer and
    # Perf schedulers: the btv1.5 boards are dedicated test hardware available
    # around the clock, so the lines are allowed to start together and the
    # cluster serialises whatever cannot run at once.
    - cron: '0 16 * * *'  # 00:00 Beijing Time (UTC+8) every day
  workflow_dispatch:
    inputs:
      ref:
        description: 'Code ref (branch, tag, or SHA) to check out in-pod. Defaults to v0.5.18.'
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-test-ppu-pd-perf-${{ inputs.ref || 'v0.5.18' }}
  cancel-in-progress: true

# A `workflow_call` invocation is capped by the permissions its caller holds: a
# callee job cannot be granted more than this scheduler grants here. Each
# reusable PD-perf workflow ends with a `publish-trend-rows` job that pushes
# result rows to the `nightly-test-data` orphan branch and therefore declares
# `contents: write` + `actions: read`. If this scheduler passed down only the
# read-only default, that job would be rejected at graph-compile time
# (startup_failure -- no job, no annotation) or 403 on push, and every nightly
# run would silently drop its trend rows. So grant both here at the top.
permissions:
  contents: write
  actions: read

jobs:
  # No `needs` between the four: each caller gang-schedules its own two nodes
  # (sixteen cards) and the boards they claim are otherwise disjoint, so they are
  # dispatched together and the cluster schedules each as capacity frees. A
  # failure in one does not cancel the others -- one config's verdict must not
  # suppress another's evidence. `secrets: inherit` hands down the PPU
  # artifactory credentials the pods need.
  glm52-fp8-channelwise:
    name: PD Perf (GLM-5.2 fp8-channelwise)
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-pd-perf-glm52.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      pd_config: fp8-channelwise
    secrets: inherit

  glm52-mxfp4-fp8:
    name: PD Perf (GLM-5.2 mxfp4-fp8)
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-pd-perf-glm52.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      pd_config: mxfp4-fp8
    secrets: inherit

  qwen35-mxfp4-fp8:
    name: PD Perf (Qwen3.5 mxfp4-fp8)
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-pd-perf-qwen35.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      pd_config: mxfp4-fp8
    secrets: inherit

  qwen35-fp8-channelwise:
    name: PD Perf (Qwen3.5 fp8-channelwise)
    uses: flytiger-eco/sglang-for-sail/.github/workflows/test-ppu-pd-perf-qwen35.yml@v0.5.18
    with:
      ref: ${{ inputs.ref || 'v0.5.18' }}
      pd_config: fp8-channelwise
    secrets: inherit
