name: PR Test (PPU, CUDA compatibility)

on:
  # PRs enter through ci.yaml and its existing run-ci gate.
  push:
    branches: [v0.5.21]
    paths:
      - "docker/ppu.Dockerfile"
      - ".github/workflows/pr-test-ppu.yml"
      - ".github/workflows/ci.yaml"
      - ".dockerignore"
      - ".gitignore"
      - "python/pyproject_ppu.toml"
      - "python/setup.py"
      - "python/sglang/srt/rust_extensions/torch_build.py"
      - "rust/**"
      - "python/sglang/kernels/aot/**"
      - "python/sglang/kernels/jit/include/**"
      - "sgl-model-gateway/**"
  workflow_dispatch:
    inputs:
      runtime_image:
        description: "Runtime image override for existing PPU CI"
        required: false
        type: string
        default: ""
      build_docker:
        description: "Build and test a Docker candidate (never promote on dispatch)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      runtime_image:
        description: "Runtime image override for existing PPU CI"
        required: false
        type: string
        default: ""
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
      run_all_tests:
        description: "Run all tests"
        required: false
        type: boolean
        default: false
      require_run_ci_label:
        description: >-
          Whether the run-ci label gate applies when the caller's event
          is pull_request. ci.yaml keeps the default enabled.
        required: false
        type: boolean
        default: true

concurrency:
  group: pr-test-ppu-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read
  pull-requests: read

env:
  PPU_BASE_IMAGE: ${{ inputs.runtime_image || vars.PPU_CI_BASE_IMAGE || 'pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.17-py312-20261001' }}
  PPU_SDK_VERSION: 2.2.0

jobs:
  # ==================== Check Changes ==================== #
  check-changes:
    # PPU runner consumption is gated behind the `run-ci` label on the
    # pull_request event. A called workflow inherits the caller's event,
    # so the default-enabled gate also applies on the ci.yaml -> workflow_call
    # path. Manual runs (workflow_dispatch) bypass the gate via the event check.
    if: github.event_name != 'pull_request' || !inputs.require_run_ci_label || contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    outputs:
      changes_exist: ${{ steps.filter.outputs.ppu_code == 'true'
        || steps.run-mode.outputs.run_all_tests == 'true'
        || steps.filter.outputs.ppu_docker == 'true'
        || inputs.build_docker || inputs.runtime_image != '' }}
      docker_changes: ${{ steps.filter.outputs.ppu_docker == 'true' || inputs.build_docker == true }}
      test_commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record exact test commit
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine run mode
        id: run-mode
        run: |
          if [[ "${{ inputs.run_all_tests }}" == "true" ]]; then
            echo "run_all_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_all_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            ppu_docker:
              - "docker/ppu.Dockerfile"
              - ".github/workflows/pr-test-ppu.yml"
              - ".github/workflows/ci.yaml"
              - ".dockerignore"
              - ".gitignore"
              - "python/pyproject_ppu.toml"
              - "python/setup.py"
              - "python/sglang/srt/rust_extensions/torch_build.py"
              - "rust/**"
              - "python/sglang/kernels/aot/**"
              - "python/sglang/kernels/jit/include/**"
              - "sgl-model-gateway/**"
            ppu_code:
              - ".github/workflows/pr-test-ppu.yml"
              - "python/pyproject_other.toml"
              - "python/sglang/!(multimodal_gen)/**"
              - "python/sglang/srt/hardware_backend/ppu/**"
              - "python/sglang/srt/platforms/ppu.py"
              - "test/registered/**"
              - "scripts/ci/ppu/**"

  build-ppu-docker:
    needs: check-changes
    if: >-
      needs.check-changes.outputs.docker_changes == 'true' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'run-ci')) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/v0.5.21') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ vars.PPU_DOCKER_ENVIRONMENT || 'ppu-docker' }}
    env:
      PPU_DOCKER_REPOSITORY: ${{ vars.PPU_DOCKER_REPOSITORY }}
      TEST_COMMIT: ${{ needs.check-changes.outputs.test_commit }}
    outputs:
      candidate_tag: ${{ steps.prepare.outputs.tag }}
      tested_image: ${{ steps.candidate.outputs.tested_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.test_commit }}
          persist-credentials: false
      - name: Verify checkout and prepare candidate
        id: prepare
        shell: bash
        run: |
          : "${PPU_DOCKER_REPOSITORY:?Set PPU_DOCKER_REPOSITORY}"
          test "$(git rev-parse HEAD)" = "$TEST_COMMIT"
          echo "registry=${PPU_DOCKER_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "tag=${PPU_DOCKER_REPOSITORY}:ci-${TEST_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/ppu-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.prepare.outputs.registry }}
          username: ${{ secrets.PPU_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.PPU_DOCKER_REGISTRY_TOKEN }}
      - name: Build and push runtime candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ppu.Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.prepare.outputs.tag }}
          build-args: |
            BRANCH_TYPE=local
            SGLANG_BUILD_COMMIT=${{ needs.check-changes.outputs.test_commit }}
      - name: Export immutable candidate
        id: candidate
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "tested_image=${PPU_DOCKER_REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"

  # ==================== Stage A: smoke gate (< 5 min test budget) ==================== #
  # test_ppu_basic.py exercises offline engine initialization and decoding.
  # This stage does not currently include an HTTP server smoke test.
  #
  # K8s form: the orchestration shell is CPU-only and holds no device; the
  # flytiger-eco/ppu-distributed-action submits a worker pod onto a board that
  # carries the requested label (OAM-810E), stages this checkout under
  # /workspace/source, and runs the command there. The kernel is built from
  # source and cached on /mnt/wl_nas by scripts/ci/ppu/ppu_build_kernel.sh
  # (invoked from ppu_install_dependency.sh) -- no prebuilt wheel artifact.
  stage-a-test-1-gpu-ppu:
    needs: [check-changes, build-ppu-docker]
    if: >-
      !cancelled() && needs.check-changes.result == 'success' &&
      needs.check-changes.outputs.changes_exist == 'true' &&
      (needs.check-changes.outputs.docker_changes != 'true' || needs.build-ppu-docker.result == 'success')
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 120
    steps:
      # Two checkout attempts: the fetch to github.com is the least reliable
      # step in a K8s run and a lost one takes the entry down with it; a
      # second attempt after a 90s wait roughly doubles what an entry survives.
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.test_commit }}
          # fetch-depth 2: ppu_install_dependency.sh detects sgl-kernel source
          # changes via `git diff HEAD~1`.
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.test_commit }}
          fetch-depth: 2

      - name: Run PPU smoke test (stage-a) via K8s
        uses: flytiger-eco/ppu-distributed-action@main
        env:
          PPU_BASE_IMAGE: ${{ needs.build-ppu-docker.outputs.tested_image || env.PPU_BASE_IMAGE }}
        with:
          image: ${{ env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=OAM-810E"
          command: |
            ppu-smi
            mkdir -p ~/.pip && cat > ~/.pip/pip.conf << 'PIPEOF'
            [global]
            index-url = https://mirrors.aliyun.com/pypi/simple/
            trusted-host = mirrors.aliyun.com
            PIPEOF
            cd /workspace/source &&
            bash scripts/ci/ppu/ppu_install_dependency.sh &&
            git config --global --add safe.directory /workspace/source &&
            JIT_MTIME=$(git -C /workspace/source log -1 --format=%ct 2>/dev/null || echo 0) &&
            { [ "$JIT_MTIME" != 0 ] && find /workspace/source/python/sglang/kernels/jit -type f -exec touch -d @$JIT_MTIME {} + && echo 'Pinned JIT source mtimes' || true; } &&
            cd test &&
            python3 run_suite.py --hw ppu --suite stage-a-test-1-gpu-ppu --continue-on-error
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          # SGLANG_TEST_MAX_RETRY=0: test_ppu_basic.py is a CustomTestCase, so
          # SGLANG_IS_IN_CI=true retries a failure once (2x194.5s ~ 399s > 5 min
          # budget). A smoke gate must fail fast and retries would mask flakiness
          # (ci-mechanism-gap-review §10.3 fact 1).
          # PIP_INDEX_URL/PIP_TRUSTED_HOST: the sdk2.2.0 base image ships a pip
          # index pointing at the Artifactory PyPI repo, which outranks
          # ~/.pip/pip.conf and returns 401 for the CI credentials (run
          # 37901303379). Env vars take precedence over every pip config file.
          extra_env: "SGLANG_IS_IN_CI=true,SGLANG_TEST_MAX_RETRY=0,SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            host_ipc: true
            shm_size: 8Gi
          timeout_minutes: 110

  # ==================== Stage B: 1-GPU body ==================== #
  # Serial after stage-a: stage-a is listed in needs directly so a stage-a
  # failure fast-fails this stage via !failure(). On K8s the serial chain is
  # expressed through `needs` alone -- no wait-for-jobs job is required, since
  # each stage is its own GitHub job (not a matrix leg) and the dependency
  # graph already serializes them and carries the verdict forward.
  stage-b-test-1-gpu-ppu:
    needs: [check-changes, build-ppu-docker, stage-a-test-1-gpu-ppu]
    # `always()` overrides skip-on-skipped-dependency so this job still
    # evaluates when stage-a was skipped; !failure() fast-fails when stage-a
    # went red. That fast-fail is the point of the serial chain.
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      needs.check-changes.outputs.changes_exist == 'true' &&
      (needs.check-changes.outputs.docker_changes != 'true' || needs.build-ppu-docker.result == 'success')
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.test_commit }}
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.test_commit }}
          fetch-depth: 2

      - name: Run PPU 1-GPU tests (stage-b) via K8s
        uses: flytiger-eco/ppu-distributed-action@main
        env:
          PPU_BASE_IMAGE: ${{ needs.build-ppu-docker.outputs.tested_image || env.PPU_BASE_IMAGE }}
        with:
          image: ${{ env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=OAM-810E"
          command: |
            ppu-smi
            mkdir -p ~/.pip && cat > ~/.pip/pip.conf << 'PIPEOF'
            [global]
            index-url = https://mirrors.aliyun.com/pypi/simple/
            trusted-host = mirrors.aliyun.com
            PIPEOF
            cd /workspace/source &&
            bash scripts/ci/ppu/ppu_install_dependency.sh &&
            git config --global --add safe.directory /workspace/source &&
            JIT_MTIME=$(git -C /workspace/source log -1 --format=%ct 2>/dev/null || echo 0) &&
            { [ "$JIT_MTIME" != 0 ] && find /workspace/source/python/sglang/kernels/jit -type f -exec touch -d @$JIT_MTIME {} + && echo 'Pinned JIT source mtimes' || true; } &&
            cd test &&
            python3 run_suite.py --hw ppu --suite stage-b-test-1-gpu-ppu --continue-on-error
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "SGLANG_IS_IN_CI=true,SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            host_ipc: true
            shm_size: 8Gi
          timeout_minutes: 110

  # ==================== Stage C: 2-GPU ==================== #
  # No tests are currently registered to stage-c; the suite runner reports
  # the empty stage explicitly. This job does not yet provide 2-GPU coverage.
  stage-c-test-2-gpu-ppu:
    # Same serial deviation as stage-b: stage-b is in needs directly so
    # !failure() fast-fails on every trigger.
    needs: [check-changes, build-ppu-docker, stage-b-test-1-gpu-ppu]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      needs.check-changes.outputs.changes_exist == 'true' &&
      (needs.check-changes.outputs.docker_changes != 'true' || needs.build-ppu-docker.result == 'success')
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.test_commit }}
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.test_commit }}
          fetch-depth: 2

      - name: Run PPU 2-GPU tests (stage-c) via K8s
        uses: flytiger-eco/ppu-distributed-action@main
        env:
          PPU_BASE_IMAGE: ${{ needs.build-ppu-docker.outputs.tested_image || env.PPU_BASE_IMAGE }}
        with:
          image: ${{ env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 2
          node_selector: "board-type=OAM-810E"
          command: |
            ppu-smi
            mkdir -p ~/.pip && cat > ~/.pip/pip.conf << 'PIPEOF'
            [global]
            index-url = https://mirrors.aliyun.com/pypi/simple/
            trusted-host = mirrors.aliyun.com
            PIPEOF
            export CUDA_VISIBLE_DEVICES=0,1 &&
            cd /workspace/source &&
            bash scripts/ci/ppu/ppu_install_dependency.sh &&
            git config --global --add safe.directory /workspace/source &&
            JIT_MTIME=$(git -C /workspace/source log -1 --format=%ct 2>/dev/null || echo 0) &&
            { [ "$JIT_MTIME" != 0 ] && find /workspace/source/python/sglang/kernels/jit -type f -exec touch -d @$JIT_MTIME {} + && echo 'Pinned JIT source mtimes' || true; } &&
            cd test &&
            python3 run_suite.py --hw ppu --suite stage-c-test-2-gpu-ppu --continue-on-error
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "SGLANG_IS_IN_CI=true,SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/,PIP_TRUSTED_HOST=mirrors.aliyun.com"
          container_options: |
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 110

  # ==================== Finish ==================== #
  pr-test-ppu-finish:
    needs:
      [
        check-changes,
        build-ppu-docker,
        stage-a-test-1-gpu-ppu,
        stage-b-test-1-gpu-ppu,
        stage-c-test-2-gpu-ppu,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          DOCKER_CHANGES: ${{ needs.check-changes.outputs.docker_changes }}
          CANDIDATE_TAG: ${{ needs.build-ppu-docker.outputs.candidate_tag }}
          TESTED_IMAGE: ${{ needs.build-ppu-docker.outputs.tested_image }}
        run: |
          {
            echo '## PPU CI — CUDA compatibility route'
            echo "Candidate tag: ${CANDIDATE_TAG:-not built}"
            echo "Tested image: ${TESTED_IMAGE:-ordinary PPU CI base}"
            echo '| Job | Result |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for job in $(jq -r 'keys_unsorted[]' <<< "$NEEDS_JSON"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<< "$NEEDS_JSON")
            echo "$job: $result"
            echo "| $job | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != "success" && ( "$DOCKER_CHANGES" == "true" || "$result" != "skipped" ) ]]; then
              failed=1
            fi
          done
          exit "$failed"

  promote-qualified-image:
    needs: [check-changes, build-ppu-docker, pr-test-ppu-finish]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/v0.5.21' &&
      needs.check-changes.outputs.docker_changes == 'true' &&
      needs.build-ppu-docker.result == 'success' &&
      needs.pr-test-ppu-finish.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ vars.PPU_DOCKER_ENVIRONMENT || 'ppu-docker' }}
    env:
      PPU_DOCKER_REPOSITORY: ${{ vars.PPU_DOCKER_REPOSITORY }}
      TESTED_IMAGE: ${{ needs.build-ppu-docker.outputs.tested_image }}
    steps:
      - name: Resolve registry
        id: registry
        run: |
          echo "host=${PPU_DOCKER_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/ppu-promote-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.PPU_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.PPU_DOCKER_REGISTRY_TOKEN }}
      - name: Promote exact tested digest
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "${PPU_DOCKER_REPOSITORY}:qualified" \
            "${TESTED_IMAGE}"
