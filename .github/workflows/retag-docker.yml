name: Retag Docker Image

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Disabled for PPU-only fork. Manual dispatch only.'
        required: false
        type: string
jobs:
  retag:
    if: github.repository == 'sgl-project/sglang'
    runs-on: ubuntu-22.04
    environment: "prod"
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag image
        run: |
          echo "Retagging lmsysorg/sglang:${{ inputs.source_tag }} -> lmsysorg/sglang:${{ inputs.target_tag }}"
          docker buildx imagetools create \
            -t lmsysorg/sglang:${{ inputs.target_tag }} \
            lmsysorg/sglang:${{ inputs.source_tag }}
