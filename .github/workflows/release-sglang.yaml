name: Release SGLang CUDA compatibility wheels

# Reuse the release template; the caller must configure TEMPLATE_TOKEN,
# RELEASE_USERNAME, RELEASE_TOKEN and DATA_TOKEN. Source always comes from sglang-for-sail.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'sglang-for-sail source branch, independent of the workflow repository branch'
        required: true
        type: string
        default: main
      package_name:
        description: 'Release package name for sglang'
        required: true
        type: string
        default: sglang
      framework:
        description: 'Dependency framework name'
        required: true
        type: string
        default: torch
      python_versions:
        description: 'Python version JSON array, for example ["312"]'
        required: true
        type: string
        default: '["312"]'
      os_versions:
        description: 'OS version JSON array, for example ["ubuntu2404"]'
        required: true
        type: string
        default: '["ubuntu2404"]'
      runtime_versions:
        description: 'CUDA runtime version JSON array'
        required: true
        type: string
        default: '["13.0.0"]'
      torch_versions:
        description: 'Torch version JSON array'
        required: true
        type: string
        default: '["2.13.0"]'
      sdk_versions:
        description: 'CUDA compatibility SDK version JSON array'
        required: true
        type: string
        default: '["2.2.0"]'
      tag_version:
        description: 'sglang release version; leave empty on ordinary branches to save wheel artifacts only'
        required: false
        type: string
      kernel_tag_version:
        description: 'Kernel release version; empty follows the sglang release switch and reads pyproject_sail.toml'
        required: false
        type: string

permissions:
  contents: read

# Releases for different source branches do not cancel each other.
concurrency:
  group: cudafy-sglang-release-${{ inputs.branch }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve source and sglang-kernel version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
      tag_version: ${{ steps.resolve.outputs.tag_version }}
    steps:
      - name: Clone selected sglang-for-sail branch
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$SOURCE_BRANCH"
          git clone --branch "$SOURCE_BRANCH" --single-branch https://github.com/t-head/sglang-for-sail.git sglang-source

      - name: Pin source commit and resolve kernel version
        id: resolve
        shell: bash
        working-directory: sglang-source
        env:
          SOURCE_BRANCH: ${{ inputs.branch || 'main' }}
          KERNEL_TAG_VERSION: ${{ inputs.kernel_tag_version || '' }}
          SGLANG_TAG_VERSION: ${{ inputs.tag_version || '' }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$SOURCE_BRANCH"
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/sglang/kernels/aot/pyproject_sail.toml | head -1)
          if [ -z "$version" ]; then
            echo '::error::Cannot read version from python/sglang/kernels/aot/pyproject_sail.toml' >&2
            exit 1
          fi
          # Explicit kernel version takes priority; otherwise follow the sglang release switch.
          if [ -n "$KERNEL_TAG_VERSION" ]; then
            tag_version="$KERNEL_TAG_VERSION"
          elif [ "$REF_TYPE" = 'tag' ] || [ -n "$SGLANG_TAG_VERSION" ]; then
            tag_version="$version"
          else
            tag_version=''
          fi
          {
            echo "commit=$commit"
            echo "version=$version"
            echo "tag_version=$tag_version"
          } >> "$GITHUB_OUTPUT"
          printf 'sglang-for-sail: %s -> %s\nsglang-kernel: %s (release as: %s)\n' \
            "$SOURCE_BRANCH" "$commit" "$version" "${tag_version:-<artifact only>}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build sglang
    needs: resolve
    uses: flytiger-eco/shared-workflows/.github/workflows/matrix-release.yml@main
    permissions:
      contents: write
    secrets:
      template_token: ${{ secrets.TEMPLATE_TOKEN }}
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      data_token: ${{ secrets.DATA_TOKEN }}
    with:
      package_name: ${{ inputs.package_name || 'sglang' }}
      framework: ${{ inputs.framework || 'torch' }}
      template_repository: flytiger-eco/shared-workflows
      template_ref: main
      python_versions: ${{ inputs.python_versions || '["312"]' }}
      os_versions: ${{ inputs.os_versions || '["ubuntu2404"]' }}
      runtime_versions: ${{ inputs.runtime_versions || '["13.0.0"]' }}
      torch_versions: ${{ inputs.torch_versions || '["2.13.0"]' }}
      sdk_versions: ${{ inputs.sdk_versions || '["2.2.0"]' }}
      tag_version: ${{ inputs.tag_version || '' }}
      # The template checks out this workflow repository; clone source into a subdirectory for wheel collection.
      # Only source checkout and location are added; preserve the reference sglang build steps.
      build_command: |
        set -eo pipefail
        CUDAFY_ROOT="$(pwd)"
        TARGET_ROOT="$CUDAFY_ROOT/sglang-source"
        TARGET_COMMIT='${{ needs.resolve.outputs.commit }}'
        git clone --no-checkout https://github.com/t-head/sglang-for-sail.git "$TARGET_ROOT"
        git -C "$TARGET_ROOT" fetch --no-tags origin "$TARGET_COMMIT"
        git -C "$TARGET_ROOT" checkout --detach "$TARGET_COMMIT"
        git -C "$TARGET_ROOT" submodule update --init --recursive
        cd "$TARGET_ROOT"

        unset PIP_INDEX_URL
        export HOME=$(eval echo ~$(id -un))
        source /usr/local/PPU_SDK/envsetup.sh || true
        source scripts/ci/utils/install_protoc.sh
        source scripts/ci/utils/install_rustup.sh
        cd python
        cp pyproject_other.toml pyproject.toml
        cp ../README.md ../LICENSE .
        pip install build wheel setuptools setuptools-scm setuptools-rust
        git config --global --add safe.directory '*'
        python3 -m build --wheel

  build-kernel:
    name: Convert and build sglang-kernel
    needs: resolve
    uses: flytiger-eco/shared-workflows/.github/workflows/matrix-release.yml@main
    permissions:
      contents: write
    secrets:
      template_token: ${{ secrets.TEMPLATE_TOKEN }}
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      data_token: ${{ secrets.DATA_TOKEN }}
    with:
      package_name: sglang-kernel
      framework: ${{ inputs.framework || 'torch' }}
      template_repository: flytiger-eco/shared-workflows
      template_ref: main
      python_versions: ${{ inputs.python_versions || '["312"]' }}
      os_versions: ${{ inputs.os_versions || '["ubuntu2404"]' }}
      runtime_versions: ${{ inputs.runtime_versions || '["13.0.0"]' }}
      torch_versions: ${{ inputs.torch_versions || '["2.13.0"]' }}
      sdk_versions: ${{ inputs.sdk_versions || '["2.2.0"]' }}
      tag_version: ${{ needs.resolve.outputs.tag_version }}
      # Use the conversion script from this workflow checkout, without external downloads or kernel source edits.
      build_command: |
        set -eo pipefail
        CUDAFY_ROOT="$(pwd)"
        TARGET_ROOT="$CUDAFY_ROOT/sglang-source"
        TARGET_COMMIT='${{ needs.resolve.outputs.commit }}'
        git clone --no-checkout https://github.com/t-head/sglang-for-sail.git "$TARGET_ROOT"
        git -C "$TARGET_ROOT" fetch --no-tags origin "$TARGET_COMMIT"
        git -C "$TARGET_ROOT" checkout --detach "$TARGET_COMMIT"
        git -C "$TARGET_ROOT" submodule update --init --recursive
        cd "$TARGET_ROOT"

        unset PIP_INDEX_URL
        export HOME=$(eval echo ~$(id -un))
        source /usr/local/PPU_SDK/envsetup.sh || true
        export MAX_JOBS="${MAX_JOBS:-$(nproc)}"
        git config --global --add safe.directory '*'
        pip install --no-input wheel setuptools
        cd python/sglang/kernels/aot
        test -f setup_sail.py || { echo '::error::python/sglang/kernels/aot/setup_sail.py is missing' >&2; exit 1; }
        python3 "$CUDAFY_ROOT/scripts/cudafy_sail_sglang.py" --file "$TARGET_ROOT/python/sglang/kernels/aot/setup_sail.py"
        python3 -c 'import torch; print(f"torch {torch.__version__} (cuda {torch.version.cuda})")'
        cp pyproject_sail.toml pyproject.toml
        python3 setup_sail.py bdist_wheel
