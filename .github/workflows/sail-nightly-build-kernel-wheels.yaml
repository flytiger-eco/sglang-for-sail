name: sail nightly build sglang kernel

# Build the converted sglang-kernel wheel with the reusable nightly template.
# Requires RELEASE_USERNAME and RELEASE_TOKEN; private templates also need TEMPLATE_TOKEN.
on:
  schedule:
    # Daily at 22:00 Beijing time (14:00 UTC).
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Name of the package to build and upload'
        required: false
        type: string
        default: sglang_kernel
      framework:
        description: 'Name of the dependent framework'
        required: false
        type: string
        default: torch
      branch:
        description: 't-head/sglang-for-sail source branch, independent of the workflow repository branch'
        required: true
        type: string
        default: release/v0.5.23
      python_versions:
        description: 'Python version JSON array; use 310 or 312 for this package'
        required: true
        type: string
        default: '["312"]'
      os_versions:
        description: 'OS JSON array: ubuntu2004, ubuntu2204, ubuntu2404, alios7u2; must match the Python image mapping'
        required: true
        type: string
        default: '["ubuntu2404"]'
      runtime_versions:
        description: 'CUDA version JSON array: 12.6.0, 12.8.0, 12.9.0, 13.0.0, 13.2.0'
        required: true
        type: string
        default: '["13.0.0"]'
      torch_versions:
        description: 'CUDA-compatible Torch version JSON array; must support the selected CUDA SDK'
        required: true
        type: string
        default: '["2.13.0"]'
      sdk_versions:
        description: 'CUDA SDK version JSON array: 2.1.1, 2.2.0, 2.2.1'
        required: true
        type: string
        default: '["2.2.1"]'
      package_version:
        description: 'Artifactory package version and automatic upload directory prefix; does not override the wheel version generated from source'
        required: false
        type: string
        default: ''
      package_edition:
        description: 'Artifactory package edition'
        required: false
        type: string
        default: oe
      package_type:
        description: 'Artifactory package type'
        required: false
        type: string
        default: pypi
      runs_on:
        description: 'CPU runner for template jobs; accepts a single label or a JSON array of labels'
        required: false
        type: string
        default: x86-ubuntu2404-8-32
      build_command:
        description: 'Custom Bash build command; leave empty to use the default; only trusted configuration is accepted; TARGET_COMMIT is the resolved source SHA'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: sail-nightly-sglang-kernel-wheels-${{ inputs.branch || 'release/v0.5.23' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve nightly sglang kernel source and version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      source_properties: ${{ steps.source.outputs.source_properties }}
      kernel_version: ${{ steps.source.outputs.kernel_version }}
    steps:
      - name: Set up Python for source metadata
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install version resolver
        run: python3 -m pip install --no-input packaging

      - name: Clone selected source branch and resolve kernel version
        id: source
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.branch || 'release/v0.5.23' }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$SOURCE_BRANCH"
          git clone --branch "$SOURCE_BRANCH" https://github.com/t-head/sglang-for-sail.git sglang-source
          cd sglang-source
          for file in python/sglang/kernels/aot/setup_sail.py \
                      python/sglang/kernels/aot/pyproject_sail.toml; do
            test -f "$file" || { printf '::error::Selected source is missing %s\n' "$file" >&2; exit 1; }
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          from packaging.version import Version

          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('::error::Unable to resolve the source commit')
          kernel_config = tomllib.loads(Path('python/sglang/kernels/aot/pyproject_sail.toml').read_text())
          kernel_version = str(Version(kernel_config['project']['version']))
          source_properties = json.dumps({
              'branch': os.environ['SOURCE_BRANCH'], 'commit': commit, 'tag': '',
          }, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'commit={commit}\n')
              output.write(f'source_properties={source_properties}\n')
              output.write(f'kernel_version={kernel_version}\n')
          summary = (f"Source: t-head/sglang-for-sail {os.environ['SOURCE_BRANCH']} -> {commit}\n"
                     f"Package version: sglang-kernel={kernel_version}\n")
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(summary)
          PY

  build:
    name: SAIL nightly sglang kernel
    needs: resolve
    uses: flytiger-eco/shared-workflows/.github/workflows/nightly-build.yml@main
    secrets:
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      template_token: ${{ secrets.TEMPLATE_TOKEN }}
    with:
      package_name: ${{ inputs.package_name || 'sglang_kernel' }}
      framework: ${{ inputs.framework || 'torch' }}
      template_repository: flytiger-eco/shared-workflows
      template_ref: main
      runs_on: ${{ inputs.runs_on || 'x86-ubuntu2404-8-32' }}
      # Keep conversion tools at the triggering workflow commit, as in the temporary build.
      # The build command checks out the independently pinned upstream source.
      branch: ${{ github.sha }}
      source_properties: ${{ needs.resolve.outputs.source_properties }}
      python_versions: ${{ inputs.python_versions || '["312"]' }}
      os_versions: ${{ inputs.os_versions || '["ubuntu2404"]' }}
      runtime_versions: ${{ inputs.runtime_versions || '["13.0.0"]' }}
      torch_versions: ${{ inputs.torch_versions || '["2.13.0"]' }}
      sdk_versions: ${{ inputs.sdk_versions || '["2.2.1"]' }}
      package_version: ${{ inputs.package_version || needs.resolve.outputs.kernel_version }}
      package_type: ${{ inputs.package_type || 'pypi' }}
      package_edition: ${{ inputs.package_edition || 'oe' }}
      build_command: |
        export TARGET_COMMIT='${{ needs.resolve.outputs.commit }}'
        ${{ inputs.build_command || '
        set -eo pipefail
        unset PIP_INDEX_URL
        # Remove image-provided Git URL rewrites to unreachable mirrors.
        for key in $(git config --global --name-only --get-regexp "^url\."); do
          git config --global --unset-all "$key"
        done
        git config --global --add safe.directory "*"

        CUDAFY_ROOT="$PWD"
        TARGET_ROOT="$PWD/sglang-source"
        git clone --no-checkout https://github.com/t-head/sglang-for-sail.git "$TARGET_ROOT"
        git -C "$TARGET_ROOT" fetch --no-tags origin "$TARGET_COMMIT"
        git -C "$TARGET_ROOT" checkout --detach "$TARGET_COMMIT"
        git -C "$TARGET_ROOT" submodule update --init --recursive
        cd "$TARGET_ROOT"

        export HOME=$(eval echo ~$(id -un))
        # Verify CUDA-compatible Torch before converting the kernel build configuration.
        python3 - <<''PY''
        import torch
        from torch.utils import cpp_extension

        print(f''torch {torch.__version__} (cuda {torch.version.cuda})'')
        if getattr(cpp_extension, ''IS_PPU_EXTENSION'', False):
            raise SystemExit(''::error::Torch uses hgcc / cuda-free; select CUDA-compatible Torch'')
        PY
        export MAX_JOBS="${MAX_JOBS:-$(nproc)}"
        # Pin build tools to avoid packaging/setuptools API incompatibilities.
        python3 -m pip install --no-input ''setuptools==75.8.0'' ''wheel==0.45.1'' ''packaging==24.2''
        python3 - <<''PY''
        from importlib.metadata import version
        from packaging.utils import canonicalize_version

        for name in (''setuptools'', ''wheel'', ''packaging''):
            print(f''{name} {version(name)}'')
        assert canonicalize_version(''1.0.0'', strip_trailing_zero=False) == ''1.0.0''
        PY
        cd python/sglang/kernels/aot
        python3 "$CUDAFY_ROOT/scripts/cudafy_sail_sglang.py" --file "$TARGET_ROOT/python/sglang/kernels/aot/setup_sail.py"
        cp pyproject_sail.toml pyproject.toml
        python3 setup_sail.py bdist_wheel' }}
