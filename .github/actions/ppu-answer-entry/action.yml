name: 'Run one PPU Answer entry on the K8s cluster'
description: >-
  Submits one reviewed Answer-quality config to a PPU board through
  flytiger-eco/ppu-distributed-action, then carries the pod's report off the NAS
  onto the run page and into an artifact. Factored out of test-ppu-answer-k8s.yml
  because that workflow needs one job id per concurrent entry -- the action
  derives both its NAS staging path and its K8s job name from $GITHUB_JOB, which
  every leg of one matrix shares -- and twelve jobs cannot each carry a copy of
  this body.

inputs:
  entry:
    description: 'Entry name: what keeps one config apart from another on the run page, in the report path and in the artifact name.'
    required: true
  suite:
    description: 'Registered suite name passed to run_suite.py --suite.'
    required: true
  config:
    description: 'Repository-relative path of the reviewed Answer config the pod reads.'
    required: true
  image:
    description: 'Container image for the worker pod.'
    required: true
  pod_timeout_minutes:
    description: 'Wall clock the action gives the pod before it force-cleans and fails.'
    required: true
  timeout_per_file:
    description: 'Seconds run_suite.py gives the registered file.'
    required: true
  artifactory_user:
    description: 'PPU artifactory user, forwarded into the pod for the dependency install.'
    required: true
  artifactory_password:
    description: 'PPU artifactory password, forwarded into the pod for the dependency install.'
    required: true

runs:
  using: 'composite'
  steps:
    # The action does not carry files back out of the worker pod, only its logs,
    # so the report travels over the NAS both sides already mount: the pod writes
    # under /mnt/wl_nas and the orchestration shell reads the same bytes under
    # /wl_nas. github.job is the id of the job that called this action, one per
    # entry, and the entry name is kept in the path as well so a reader of the
    # NAS directory does not have to know the mapping.
    - name: Run ${{ inputs.entry }} via K8s
      uses: flytiger-eco/ppu-distributed-action@main
      with:
        image: ${{ inputs.image }}
        nnodes: 0
        # Every entry requests the whole board. nproc_per_node is a resource
        # request, not device isolation: a pod that asks for one PPU still
        # sees all eight /dev/alixpu_ppu* nodes and torch still reports
        # device_count 8, so asking for one card would let a second pod land
        # on the same board and contend for device 0 with a run that has
        # already claimed 85% of its memory. Asking for eight makes the
        # board's PPU allocatable fully consumed, which is the only fence
        # available here, and it matches the internal btv1.5 plan, which
        # schedules its answer cases as 1node8ppu.
        nproc_per_node: 8
        node_selector: "board-type=ZW-M890P"
        command: |
          mkdir -p ~/.pip && cat > ~/.pip/pip.conf << 'PIPEOF'
          [global]
          index-url = https://mirrors.aliyun.com/pypi/simple/
          trusted-host = mirrors.aliyun.com
          PIPEOF
          set -e
          cd /workspace/source
          git config --global --add safe.directory /workspace/source
          SGLANG_PPU_SOURCE_REVISION=$(git rev-parse HEAD)
          export SGLANG_PPU_SOURCE_REVISION
          CUDA_VISIBLE_DEVICES=$(python3 -c "import json, os; print(','.join(str(int(device)) for device in json.load(open(os.environ['SGLANG_PPU_ANSWER_TEST_CONFIG']))['hardware']['visible_devices']))")
          export CUDA_VISIBLE_DEVICES
          ANSWER_MODEL_PATH=$(python3 -c "import json, os; print(json.load(open(os.environ['SGLANG_PPU_ANSWER_TEST_CONFIG']))['model']['path'])")
          echo "source revision: $SGLANG_PPU_SOURCE_REVISION"
          echo "test config:     $SGLANG_PPU_ANSWER_TEST_CONFIG"
          echo "visible devices: $CUDA_VISIBLE_DEVICES"
          echo "checkpoint:      $ANSWER_MODEL_PATH"
          bash scripts/ci/ppu/ppu_install_dependency.sh
          JIT_MTIME=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          if [ "$JIT_MTIME" != 0 ]; then
            find python/sglang/jit_kernel -type f -exec touch -d @$JIT_MTIME {} +
            echo 'Pinned JIT source mtimes'
          fi
          bash scripts/ci/warm_page_cache.sh "$ANSWER_MODEL_PATH"
          cd test
          python3 run_suite.py --hw ppu --suite ${{ inputs.suite }} --nightly --timeout-per-file ${{ inputs.timeout_per_file }}
        host_volumes: "/nas_aisw/cache/sglang-jit-ci:/root/.cache/tvm-ffi"
        extra_env: "SGLANG_IS_IN_CI=true,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ inputs.artifactory_user }},PPU_ARTIFACTORY_PASSWORD=${{ inputs.artifactory_password }},PPU_SUPPORTS_FP8=0,PPU_BASE_IMAGE=${{ inputs.image }},GITHUB_REPOSITORY=${{ github.repository }},GITHUB_RUN_ID=${{ github.run_id }},GITHUB_RUN_ATTEMPT=${{ github.run_attempt }},GITHUB_SERVER_URL=${{ github.server_url }},SGLANG_PPU_ANSWER_TEST_CONFIG=/workspace/source/${{ inputs.config }},SGLANG_PPU_ANSWER_INCLUDE_RAW_OUTPUTS=1,SGLANG_PPU_ANSWER_RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/${{ inputs.entry }}"
        container_options: |
          privileged: true
          host_ipc: true
          host_network: true
          shm_size: 8Gi
        timeout_minutes: ${{ inputs.pod_timeout_minutes }}
      # The pod derives the visible devices and the checkpoint from the same
      # reviewed config the test will read, rather than from a second copy in
      # this file, so the two cannot drift; the device list is also the one
      # value that must reach the shell, and extra_env is comma-delimited, so
      # it is exported inside the pod instead of passed as an input.
      #
      # The page-cache warm sits immediately before run_suite.py and inside
      # the pod on purpose. It warms the page cache of the node that will
      # then load the weights, which an orchestration-shell step could not
      # do, and the measured bare-metal host reclaims the cache within 30
      # minutes, so a warm separated from the load is wasted machine time.
      #
      # Routed through run_suite.py so the executed set is exactly what
      # register_ppu_ci declares. No --continue-on-error: an Answer-quality
      # regression must turn the run red.

    # The NAS copy is read, not moved. The pod writes the report as root and
    # this orchestration shell is a different, non-root uid, so it can read
    # those bytes but cannot unlink them: an rm here fails with EPERM on every
    # file and turns this step red even when the suite passed, which is how the
    # first run on this board reported itself. What is left behind is the
    # report itself, a few kilobytes under a directory this run already owns
    # exclusively, and it doubles as the on-cluster record once the artifact
    # has expired.
    - name: Collect Answer evidence
      if: always()
      shell: bash
      env:
        # The entry, not the suite: annotations from eight parallel jobs land on
        # one run page, and three of them share a suite name.
        ENTRY: ${{ inputs.entry }}
        ANSWER_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/${{ inputs.entry }}
      run: |
        set -euo pipefail
        destination="${GITHUB_WORKSPACE}/ppu-answer-artifacts"
        mkdir -p "${destination}"
        if [ -d "${ANSWER_RESULTS_ON_RUNNER}" ]; then
          cp -a "${ANSWER_RESULTS_ON_RUNNER}/." "${destination}/"
        else
          echo "::warning::the pod produced no Answer report at ${ANSWER_RESULTS_ON_RUNNER}"
        fi
        if [ -f "${destination}/summary.md" ]; then
          # Annotations are what a reader of this run page actually gets here.
          # This runner drives the job through a container hook that does not
          # share the job container's filesystem with the runner process, so
          # bytes written to GITHUB_STEP_SUMMARY inside the container are
          # dropped without an error: the check runs of the first two runs on
          # this board both reported a summary of length zero while their
          # annotations arrived intact. Annotations travel over this step's
          # stdout, which does reach the runner, and they surface on the run
          # page and in the checks UI without downloading the artifact.
          #
          # The failing cases are read back from summary.md rather than from
          # result.json because this container is not guaranteed a JSON parser
          # -- no python3, no jq. render_summary emits one bullet per failing
          # case prefixed with "- `", a prefix no other line in that document
          # has, and the evaluator's unit tests lock that shape.
          while IFS= read -r failure; do
            echo "::error::${ENTRY}: ${failure#- }"
          done < <(grep '^- `' "${destination}/summary.md" || true)
          counts=$(grep '^- Cases: ' "${destination}/summary.md" | head -1 || true)
          if [ -n "${counts}" ]; then
            echo "::notice::${ENTRY}: ${counts#- }"
          fi
          cat "${destination}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
        fi

    - name: Upload Answer evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ppu-answer-k8s-${{ inputs.entry }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ppu-answer-artifacts/
        if-no-files-found: warn
        retention-days: 30
